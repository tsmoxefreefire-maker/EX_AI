<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الشرح التفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Noto+Kufi+Arabic:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{--bg:#F4F6F8;--panel:#FFFFFF;--ink:#17222D;--muted:#5C6A77;--line:#D6DEE6;--chip:#EDF1F5;--brand:#1F6F78;--good:#2E8B57;--bad:#C8473D;--warn:#B9770E;--focus:#1F6F78;
  --water:#3A8DDE;--leaf:#2F8F4E;--soil:#7A4D2B;--sun:#F2B33D;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E151B;--panel:#151F28;--ink:#E4ECF2;--muted:#9AAAB8;--line:#283643;--chip:#1C2834;--brand:#4FB3BD;--good:#4CB36E;--bad:#E2685E;--warn:#E3B44F;--focus:#7FD0D8;--water:#62A8EE;--leaf:#4CB36E}}
:root[data-theme="dark"]{--bg:#0E151B;--panel:#151F28;--ink:#E4ECF2;--muted:#9AAAB8;--line:#283643;--chip:#1C2834;--brand:#4FB3BD;--good:#4CB36E;--bad:#E2685E;--warn:#E3B44F;--focus:#7FD0D8;--water:#62A8EE;--leaf:#4CB36E}
/* garden skin: the same games, a look that fits plant lessons */
body.skin-garden{--brand:#2F8F4E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.skin-garden{--brand:#4CB36E}}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",system-ui,sans-serif;line-height:1.7}
h1,h2,h3{font-family:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;margin:0;line-height:1.35}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 48px}
.hero{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:end;justify-content:space-between;margin-bottom:16px}
.hero h1{font-size:clamp(1.5rem,3vw,2.1rem);font-weight:800}
.hero p{margin:4px 0 0;color:var(--muted);max-width:64ch}
.pipe{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.88rem}
.pipe span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.pipe i{font-style:normal;color:var(--muted)}
.layout{display:grid;grid-template-columns:290px 1fr;gap:16px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.layout>*{min-width:0}
.side{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);max-height:calc(100vh - 30px);overflow:auto}
@media (max-width:860px){.side{position:relative;top:0;max-height:260px}}
.side h3{font-size:.95rem;margin:8px 4px 6px;color:var(--muted)}
.tree{font-size:.85rem;font-weight:700;color:var(--muted);padding:6px 10px 2px}
.tree.t{padding-inline-start:18px}.tree.t::before{content:'◇ '}
.les{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:right;border:0;background:transparent;border-radius:10px;padding:7px 10px 7px 10px;padding-inline-start:28px;cursor:pointer}
.les span{overflow-wrap:anywhere}
.les:hover{background:var(--chip)}
.les[aria-current="true"]{background:var(--brand);color:#fff}
.les small{opacity:.8;white-space:nowrap}
.main{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.lhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.lhead h2{font-size:1.35rem}
.status{font-size:.82rem;font-weight:700;border-radius:999px;padding:3px 10px;background:color-mix(in srgb,var(--warn) 18%,var(--panel))}
.cov{font-size:.82rem;font-weight:700;border-radius:999px;padding:3px 10px;background:color-mix(in srgb,var(--good) 16%,var(--panel))}
.cov.miss{background:color-mix(in srgb,var(--bad) 16%,var(--panel))}
.small{color:var(--muted);font-size:.9rem}
.sec{font-size:.95rem;margin:14px 0 8px;color:var(--muted)}
.stations{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.station{border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:6px 12px;cursor:pointer;display:grid;text-align:center;min-width:86px}
.station.on{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.station .st{letter-spacing:2px;color:var(--warn);font-size:.95rem}
.station small{color:var(--muted);font-size:.75rem}
.link{width:16px;height:3px;background:var(--line);border-radius:2px}
.qtabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.qtab{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.9rem}
.qtab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qtab.done::after{content:" ✓";color:var(--good);font-weight:800}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.diff{font-size:.8rem;font-weight:700;border-radius:999px;padding:2px 10px;color:#fff}
.diff.easy{background:var(--good)}.diff.mid{background:var(--warn)}.diff.hard{background:var(--bad)}
.qtext{font-family:"Noto Kufi Arabic",sans-serif;font-size:1.12rem;font-weight:800;margin:8px 0 2px}
.how{color:var(--muted);margin:0 0 12px}
.feedback{min-height:1.6em;margin-top:10px;font-weight:700}
.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}
.tests{margin-top:6px;font-size:.86rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.btn{border:0;border-radius:12px;padding:9px 16px;cursor:pointer;font-weight:700;background:var(--brand);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:46px}
.chip{border:1.5px solid var(--line);background:var(--chip);border-radius:12px;padding:8px 13px;cursor:pointer;font-weight:700;direction:auto}
.chip.used{opacity:.3;pointer-events:none}
.chip.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--panel))}
.chip.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel))}
.solution{margin-top:14px;border-radius:14px;padding:12px 14px;background:color-mix(in srgb,var(--good) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--good) 30%,var(--line))}
.solution h3{font-size:1rem;margin-bottom:6px}
.solution ol{margin:0;padding-inline-start:1.3em}
.solution li{direction:auto}
.stars{letter-spacing:2px;color:var(--warn)}
.code{direction:ltr;text-align:left;background:var(--chip);border-radius:12px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;line-height:1.5;overflow:auto;max-height:280px;white-space:pre}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:5px 12px;cursor:pointer;font-weight:600}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ===== shared fun ===== */
#q{position:relative;overflow:hidden}
.conf{position:absolute;top:-10px;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:fall 1.3s ease-in forwards;z-index:5}
@keyframes fall{to{transform:translateY(560px) rotate(540deg);opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes dance{25%{transform:rotate(-12deg) translateY(-6px)}75%{transform:rotate(12deg) translateY(-6px)}}
@keyframes wiggle{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.drag{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.drag-ghost{position:fixed;z-index:80;pointer-events:none;transform:translate(-50%,-60%) scale(1.06);opacity:.96;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.over{outline:3px dashed var(--warn)!important;outline-offset:3px}
/* mascot «بذور» */
.mascot{position:absolute;inset-inline-end:14px;top:10px;flex-direction:row-reverse;display:flex;align-items:center;gap:6px;z-index:6;pointer-events:none}
.mascot .m-body{font-size:2rem;display:inline-block;transform-origin:50% 90%}
.mascot .m-say{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:3px 10px;font-size:.85rem;font-weight:700;opacity:0;transform:scale(.6);transition:all .25s;white-space:nowrap}
.mascot.talk .m-say{opacity:1;transform:scale(1)}
.mascot.happy .m-body{animation:dance .5s 3}
.mascot.oops .m-body{animation:wiggle .3s 3}
.mascot.dive .m-body{animation:dive 1.2s}
@keyframes dive{40%{transform:translateY(30px) rotate(160deg)}100%{transform:translateY(0) rotate(360deg)}}
@media (max-width:520px){.mascot .m-say{white-space:normal;max-width:150px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.conf{display:none}}
</style>
<!--CSS_GAMES-->
<style>
/* ---------- 1. مين الصادق؟ (meaning) ---------- */
.namecard{display:block;width:max-content;margin:44px auto 12px;font-family:"Noto Kufi Arabic",sans-serif;font-weight:800;font-size:1.2rem;border-radius:14px;padding:8px 18px;background:var(--brand);color:#fff}
.faces{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fcard{position:relative;border:2px solid var(--line);border-radius:18px;padding:10px 10px 12px;background:color-mix(in srgb,var(--chip) 70%,var(--panel));cursor:pointer;display:grid;justify-items:center;gap:6px;text-align:center;transition:opacity .4s,transform .6s}
.fcard .ftxt{font-size:.92rem;direction:auto}
.face{position:relative;width:64px;height:64px;border-radius:50%;animation:bob 2.6s ease-in-out infinite}
.fcard:nth-child(2) .face{animation-delay:-.6s}.fcard:nth-child(3) .face{animation-delay:-1.2s}.fcard:nth-child(4) .face{animation-delay:-1.8s}
.eye{position:absolute;top:20px;width:15px;height:15px;border-radius:50%;background:#fff;overflow:hidden;animation:blink 4s infinite}
.eye.l{left:13px}.eye.r{right:13px}
.pupil{position:absolute;left:4px;top:4px;width:7px;height:7px;border-radius:50%;background:#1b1b1b;transition:transform .08s}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
.mouth{position:absolute;left:50%;bottom:12px;width:22px;height:9px;margin-left:-11px;border-radius:0 0 12px 12px;background:#3b1d1d}
.talking .mouth{animation:talk .25s infinite alternate}
@keyframes talk{to{height:3px;border-radius:6px}}
.nose{position:absolute;left:50%;top:30px;width:11px;height:10px;margin-left:-5px;border-radius:5px 9px 9px 5px;background:inherit;border:2px solid rgba(0,0,0,.18);box-shadow:inset -3px -2px 0 rgba(0,0,0,.08);filter:brightness(.96);z-index:1;transform-origin:0 50%;transition:width 1.2s cubic-bezier(.3,1.6,.5,1)}
.fcard.liar .nose{width:46px}
.bubble-say{position:absolute;top:-14px;inset-inline-end:-6px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:2px 9px;font-size:.78rem;font-weight:800;white-space:nowrap;animation:pop .3s}
.fcard.truth{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--panel))}
.fcard.truth .face{animation:dance .5s 4}
.fcard.away{opacity:.25;transform:translateY(16px) scale(.94)}
.fcard.laugh .face{animation:wiggle .2s 6}
@media (max-width:520px){.faces{grid-template-columns:1fr 1fr;gap:10px}.face{width:54px;height:54px}.eye{top:16px}.mouth{bottom:9px}}

/* ---------- 2. وصّل (match) = بذرة ← ساق ← برعم ---------- */
.mwrap{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:12px 40px;margin-top:6px}
.mwrap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mcol{display:grid;gap:10px;align-content:start}
.mterm,.mdef{border:2px solid var(--line);background:var(--chip);border-radius:14px;padding:10px 12px;text-align:start;direction:auto;display:flex;gap:8px;align-items:center}
.mterm{font-weight:800}
.mterm .ic,.mdef .ic{font-size:1.4rem;flex:none;display:inline-block}
.mterm[aria-pressed="true"]{border-color:var(--warn)}
.mterm.ok,.mdef.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--panel))}
.mdef.bloom .ic{animation:pop .6s}
.leaf-fall{position:absolute;font-size:1.3rem;pointer-events:none;animation:leaffall 1.4s ease-in forwards;z-index:4}
@keyframes leaffall{to{transform:translate(-30px,120px) rotate(220deg);opacity:0}}
.flow{stroke-dasharray:4 10;animation:flow .6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.droop{transition:all .7s ease-in;opacity:0}

/* ---------- 3. بطاقات الذاكرة ---------- */
.mem{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;perspective:800px}
@media (max-width:520px){.mem{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mc{position:relative;min-height:96px;border:0;background:none;padding:0;cursor:pointer;transform-style:preserve-3d;transition:transform .45s}
.mc.open{transform:rotateY(180deg)}
.mc .side-a,.mc .side-b{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;padding:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--line)}
.mc .side-a{background:color-mix(in srgb,var(--brand) 20%,var(--panel));font-size:2rem}
.mc .side-b{background:var(--chip);transform:rotateY(180deg);font-size:.88rem;font-weight:700;direction:auto}
.mc.done .side-b{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--panel))}
.mc.oops{animation:wiggle .25s 3}

/* ---------- 4. ركّب الاسم ---------- */
.clue{border-radius:14px;padding:10px 14px;background:color-mix(in srgb,var(--warn) 12%,var(--panel));font-weight:700;margin-bottom:12px;direction:auto}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.lslot{width:46px;height:52px;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;font-size:1.5rem;font-weight:800;background:var(--bg)}
.lslot.filled{border-style:solid;border-color:var(--brand)}
.lslot.gap{border:0;background:none;width:18px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{width:46px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--chip);font-size:1.5rem;font-weight:800;cursor:pointer;display:grid;place-items:center;position:relative}
.skin-garden .tile{border-radius:50% 4px 50% 4px;background:color-mix(in srgb,var(--leaf) 22%,var(--panel))}
.tile.spin{animation:spinback .6s}
@keyframes spinback{50%{transform:rotate(200deg) scale(.8)}}
.word-done{font-family:"Noto Kufi Arabic",sans-serif;font-size:2rem;font-weight:800;text-align:center;color:var(--good);animation:pop .6s}

/* ---------- 5. صح ولا غلط (سحب البطاقة) ---------- */
.tfzone{position:relative;display:grid;place-items:center;min-height:210px;margin:6px 0 10px;padding:0 64px}
#deck{display:grid;width:100%;justify-items:center}
.tfside{position:absolute;top:50%;transform:translateY(-50%);font-weight:800;font-size:1.05rem;opacity:.75;pointer-events:none}
.tfside.yes{right:0;color:var(--good)}.tfside.no{left:0;color:var(--bad)}
.tfcard{grid-area:1/1;position:relative;width:min(320px,100%);min-height:170px;border-radius:18px;border:2px solid var(--line);background:var(--panel);box-shadow:0 8px 20px rgba(0,0,0,.08);display:grid;place-items:center;padding:26px 16px 16px;text-align:center;font-weight:700;direction:auto;touch-action:none;cursor:grab;transition:transform .35s,opacity .35s}
.tfcard.under{transform:translateY(8px) scale(.96);opacity:.6}
.tfcard .tfn{position:absolute;top:8px;inset-inline-start:12px;font-size:.8rem;color:var(--muted)}
@media (max-width:520px){.tfzone{padding:0 46px}.tfside{font-size:.85rem}}
.tfbtns{display:flex;justify-content:center;gap:12px}

/* ---------- 6. الجسر ---------- */
.stage{display:block;width:100%;height:auto;margin:8px 0}
.stage.small{max-width:380px;margin:8px auto}
.chip.star{border-color:var(--warn)}
#br{max-width:640px;margin:8px auto}
#br .plank{cursor:pointer}
.bridge-shake{animation:bshake .5s}
@keyframes bshake{20%{transform:translate(-4px,1px)}40%{transform:translate(4px,-1px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}

/* ---------- 7. صلّح السلسلة (القطار) ---------- */
.train{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;justify-content:center;padding:10px 0 4px;transition:transform 1.6s ease-in}
.wagon{position:relative;border:2px solid var(--line);background:var(--chip);border-radius:12px 12px 6px 6px;padding:10px 12px 18px;min-width:86px;text-align:center;font-weight:800;cursor:pointer;direction:auto}
.wagon::before,.wagon::after{content:"";position:absolute;bottom:-9px;width:16px;height:16px;border-radius:50%;background:#333;border:3px solid #888}
.wagon::before{left:12px}.wagon::after{right:12px}
.wagon.engine{background:color-mix(in srgb,var(--brand) 25%,var(--panel));cursor:default}
.wagon.gap{border-style:dashed;background:transparent;color:var(--muted)}
.wagon.picked{border-color:var(--bad)}
.wagon.honk{animation:shake .4s}
.wagon .say{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:1px 8px;font-size:.78rem;white-space:nowrap;animation:pop .3s}
.train.go{transform:translateX(-120%)}

/* ---------- 8. الباب بوجه ---------- */
.doorbox{position:relative;width:min(300px,90%);margin:6px auto 10px;height:230px;perspective:900px}
.behind{position:absolute;inset:14px 34px 0;border-radius:10px;background:color-mix(in srgb,var(--sun) 30%,var(--panel));display:grid;place-items:center;align-content:center;gap:6px;text-align:center;padding:8px}
.behind .who{font-family:"Noto Kufi Arabic",sans-serif;font-weight:800;font-size:1.15rem;border-radius:12px;padding:4px 12px;background:var(--brand);color:#fff;opacity:0;transform:scale(.5);transition:all .5s .4s}
.behind .friends{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.behind .friends span{border-radius:10px;padding:2px 8px;background:var(--panel);font-weight:700;font-size:.85rem;animation:pop .5s}
.behind .line{font-weight:700;font-size:.9rem;opacity:0;transition:opacity .4s .9s}
.door{position:absolute;inset:14px 34px 0;border-radius:10px;background:#8B5A2B;border:6px solid #5E3A1F;transform-origin:left center;transition:transform 1.1s ease-in-out;display:grid;justify-items:center;align-content:start;padding-top:18px;gap:4px}
.skin-garden .door{background:repeating-linear-gradient(90deg,#7A4D2B 0 12px,#6d4426 12px 14px);border-color:#4f2f17}
.door .dface{position:relative;width:96px;height:56px}
.door .eye{top:4px;width:20px;height:20px}.door .eye.l{left:16px}.door .eye.r{right:16px}
.door .pupil{left:6px;top:6px;width:9px;height:9px}
.door .mouth{bottom:2px;width:30px;margin-left:-15px;height:11px}
.door .dname{color:#fff;font-weight:800;font-size:1rem;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.door .locks{display:flex;gap:6px;font-size:1.6rem}
.door .lk.drop{animation:lockdrop .8s forwards}
@keyframes lockdrop{to{transform:translateY(120px) rotate(70deg);opacity:0}}
.door.giggle{animation:wiggle .18s 6}
.doorbox.open .door{transform:rotateY(-105deg)}
.doorbox.open .who,.doorbox.open .line{opacity:1;transform:none}
.keys .chip::before{content:"🔑 "}
.chip.bent{transform:skewX(-18deg) rotate(-8deg)}

/* ---------- 9. ضوّي الطرق ---------- */
.dest{cursor:pointer}
.dest text{font-weight:800}
.dest.lit circle{fill:color-mix(in srgb,var(--good) 30%,var(--panel));stroke:var(--good)}
.dest.nope{opacity:.35}

/* ---------- 10. المصعد ---------- */
.lift{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:10px;align-items:stretch;max-width:520px;margin:6px auto}
.floors{display:grid;gap:6px}

drawn-=ls.length+3;}\n  function art(id,size){const s=(window.DATA.art||{})[id];if(!s)return `<circle cx=\"50\" cy=\"50\" r=\"40\" class=\"sdk-blob\"/>`;return s.replace(/^[\\s\\S]*?<svg[^>]*>/,\"\").replace(/<\\/svg>\\s*$/,\"\");}\n  const SDK={\n    W,H,\n    data:null,\n    /* a character from our art library: SDK.character(\"root\", {x, y, size, label}) */\n    character(id,o){o=o||{};const size=o.size||90,c=(window.DATA.concepts||{})[id]||{name:o.name||id};\n      const g=node(\"g\",{class:\"sdk-char\",transform:`translate(${o.x||W/2} ${o.y||H/2})`,\"data-id\":id},layer);\n      const body=node(\"g\",{class:\"sdk-body\"},g);body.innerHTML=`<svg x=\"${-size/2}\" y=\"${-size/2}\" width=\"${size}\" height=\"${size}\" viewBox=\"0 0 100 100\" overflow=\"visible\">${art(id,size)}<\\/svg>`;\n      if(o.label!==false){const t=node(\"text\",{y:size/2+18,\"text-anchor\":\"middle\",class:\"sdk-name\"},g);t.textContent=o.name||c.name;}\n      const h={id,g,size,x:o.x||W/2,y:o.y||H/2,\n        moveTo(x,y,ms){const fx=h.x,fy=h.y;x=clamp(x,size/2,W-size/2);y=clamp(y,size/2,H-size/2-18);return SDK.tween(ms||600,t=>{h.x=fx+(x-fx)*t;h.y=fy+(y-fy)*t;g.setAttribute(\"transform\",`translate(${h.x} ${h.y})`);});},\n        say(text){bubbleFor(h,text);return h;},\n        dim(on){g.style.opacity=on?.3:1;return h;},glow(on){g.classList.toggle(\"sdk-glow\",!!on);return h;},\n        onTap(fn){g.style.cursor=\"pointer\";g.addEventListener(\"click\",e=>{try{fn(h,e);}catch(err){errors.push(String(err));}});return h;},\n        draggable(opts){opts=opts||{};g.style.cursor=\"grab\";g.style.touchAction=\"none\";\n          g.addEventListener(\"pointerdown\",ev=>{ev.preventDefault();const R=stage.getBoundingClientRect(),k=W/R.width;g.setPointerCapture&&g.setPointerCapture(ev.pointerId);\n            const mv=e=>{h.x=clamp((e.clientX-R.left)*k,size/2,W-size/2);h.y=clamp((e.clientY-R.top)*k,size/2,H-size/2-18);g.setAttribute(\"transform\",`translate(${h.x} ${h.y})`);try{opts.onMove&&opts.onMove(h);}catch(err){errors.push(String(err));}};\n            const up=()=>{window.removeEventListener(\"pointermove\",mv);window.removeEventListener(\"pointerup\",up);try{opts.onDrop&&opts.onDrop(h);}catch(err){errors.push(String(err));}};\n            window.addEventListener(\"pointermove\",mv);window.addEventListener(\"pointerup\",up);});return h;},\n        near(other,dist){return Math.hypot(h.x-other.x,h.y-other.y)<(dist||80);}};\n      handles.push(h);return h;},\n    /* the platform's «needs» arrow: from the one who needs → to what it needs, with the age's word on it */\n    arrow(from,to,o){o=o||{};const g=node(\"g\",{class:\"sdk-arrow\",opacity:o.hidden?0:1},layer);\n      const draw=()=>{const dx=to.x-from.x,dy=to.y-from.y,d=Math.hypot(dx,dy)||1,r1=from.size/2+6,r2=to.size/2+10;\n        const a=[from.x+dx/d*r1,from.y+dy/d*r1],b=[to.x-dx/d*r2,to.y-dy/d*r2],m=[(a[0]+b[0])/2,(a[1]+b[1])/2-18];\n        g.innerHTML=`<path d=\"M${a[0]} ${a[1]} Q${m[0]} ${m[1]} ${b[0]} ${b[1]}\" class=\"sdk-line\" marker-end=\"url(#sdkhead)\"/>`+(o.label===false?\"\":`<g transform=\"translate(${(a[0]+2*m[0]+b[0])/4} ${(a[1]+2*m[1]+b[1])/4})\"><rect class=\"sdk-tag\" x=\"-34\" y=\"-11\" width=\"68\" height=\"20\" rx=\"10\"/><text y=\"4\" text-anchor=\"middle\" class=\"sdk-tagt\">${o.label||window.DATA.needsWord}<\\/text><\\/g>`);};\n      draw();return {g,redraw:draw,show(on){g.setAttribute(\"opacity\",on?1:0);}};},\n    text(x,y,str,o){o=o||{};const t=node(\"text\",{x,y,\"text-anchor\":o.anchor||\"middle\",class:\"sdk-text\",\"font-size\":o.size||16,\"font-weight\":o.weight||700,fill:o.color,direction:o.ltr?\"ltr\":null,\"unicode-bidi\":o.ltr?\"embed\":null},layer);t.textContent=String(str);return t;},\n    shape(kind,attrs){if(![\"circle\",\"rect\",\"line\",\"path\",\"ellipse\",\"polygon\",\"polyline\"].includes(kind))throw new Error(\"shape: \"+kind);return node(kind,Object.assign({class:\"sdk-shape\"},attrs||{}),layer);},\n    slider(o,onChange){o=o||{};const lab=document.createElement(\"label\");lab.className=\"sdk-sl\";const sp=document.createElement(\"span\");sp.textContent=o.label||\"\";\n      const r=document.createElement(\"input\");r.type=\"range\";r.min=o.min??0;r.max=o.max??10;r.step=o.step??1;r.value=o.value??o.min??0;const b=document.createElement(\"b\");b.textContent=r.value;\n      lab.append(sp,r,b);ui.appendChild(lab);const fire=()=>{b.textContent=r.value;try{onChange&&onChange(parseFloat(r.value));}catch(err){errors.push(String(err));}};r.addEventListener(\"input\",fire);setTimeout(fire,0);\n      return {set(v){r.value=v;fire();},get value(){return parseFloat(r.value);}};},\n    button(label,onClick){const bt=document.createElement(\"button\");bt.className=\"sdk-btn\";bt.textContent=label;bt.addEventListener(\"click\",()=>{try{onClick&&onClick();}catch(err){errors.push(String(err));}});ui.appendChild(bt);return bt;},\n    caption(t){capEl.textContent=String(t||\"\");parent.postMessage({type:\"llm-caption\",text:String(t||\"\")},\"*\");},\n    tween(ms,fn){return new Promise(res=>{const t0=performance.now();const go=()=>{const t=Math.min(1,(performance.now()-t0)/(ms||1));try{fn(t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2);}catch(err){errors.push(String(err));}if(t<1)requestAnimationFrame(go);else res();};go();});},\n    wait(ms){return new Promise(r=>setTimeout(r,Math.min(ms||0,10000)));},\n    done(note){doneNote=String(note||\"تم\");report();}};\n  /* the report the page/teacher screen receives: did it draw, is everything inside the picture, any errors? */\n  function report(){const R=stage.getBoundingClientRect(),k=W/(R.width||W);let outside=0;\n    stage.querySelectorAll(\".sdk-char,.sdk-text,.sdk-bub rect\").forEach(e=>{const r=e.getBoundingClientRect();if(!r.width)return;const x0=(r.left-R.left)*k,x1=(r.right-R.left)*k,y0=(r.top-R.top)*k,y1=(r.bottom-R.top)*k;if(x0<-2||y0<-2||x1>W+2||y1>H+2)outside++;});\n    const msg={type:\"llm-scene\",ok:!errors.length&&drawn>0,drawn,outside,errors:errors.slice(0,5),done:doneNote};window.__REPORT=msg;try{parent.postMessage(msg,\"*\");}catch(e){}}\n  window.addEventListener(\"error\",e=>{errors.push(String(e.message||e));});\n  const size=()=>{try{parent.postMessage({type:\"llm-size\",h:document.documentElement.scrollHeight},\"*\");}catch(e){}};   /* the page sizes the iframe to fit */\n  window.addEventListener(\"resize\",size);setTimeout(size,50);setTimeout(size,600);\n  window.__bootScene=function(){SDK.data=window.DATA;\n    if(typeof window.buildScene!==\"function\"){errors.push(\"buildScene is missing\");report();return;}\n    try{const r=window.buildScene(SDK,window.DATA);if(r&&r.then)r.catch(err=>errors.push(String(err)));}catch(err){errors.push(String(err&&err.message||err));}\n    setTimeout(report,1200);};\n})();\n<\/script><script>function buildScene(SDK, data) {\n  const c = data.concept;\n  const y = 250, x0 = 60, x1 = 600, sc = (x1 - x0) / 80;           // the road: 0 → 80 m\n  SDK.shape(\"line\", { x1: x0, y1: y, x2: x1, y2: y, stroke: \"var(--ink)\", \"stroke-width\": 3 });\n  for (let m = 0; m <= 80; m += 10) {\n    SDK.shape(\"line\", { x1: x0 + m * sc, y1: y - 6, x2: x0 + m * sc, y2: y + 6, stroke: \"var(--ink)\", \"stroke-width\": 2 });\n    SDK.text(x0 + m * sc, y + 24, m, { size: 11, ltr: true });\n  }\n  SDK.text(x1 + 18, y + 24, \"m\", { size: 11, ltr: true });\n  const car = SDK.character(c.id, { x: x0, y: y - 46, size: 70, label: false });\n  const formula = SDK.text(320, 40, \"\", { size: 18, ltr: true });\n  let a = 2, dots = [];\n  const clear = () => { dots.forEach(d => d.remove()); dots = []; };\n  const place = (t) => { const d = 0.5 * a * t * t; car.g.setAttribute(\"transform\", \"translate(\" + (x0 + Math.min(d, 80) * sc) + \" \" + (y - 46) + \")\"); car.x = x0 + Math.min(d, 80) * sc; return d; };\n  SDK.slider({ label: \"التسارع a (م/ث²)\", min: 1, max: 4, step: 0.5, value: 2 }, v => {\n    a = v; clear(); place(0); formula.textContent = \"d = ½ a t²   ·   a = \" + a + \" m/s²\";\n    SDK.caption(\"اختار التسارع واك const SUBJ_COLORS=[["#7CC6F2","#2F6FA8"],["#F6C177","#9A6416"],["#A3D9A5","#2E7D3A"],["#C4A7E7","#6A45A8"],["#F5A97F","#B5532A"],["#9CCFD8","#2E7A86"],["#EBBCBA","#A8505A"],["#F2D479","#8A6D0B"]];

function subjColor(label){const s=String(label||"");let n=0;for(let i=0;i<s.length;i++)n+=s.charCodeAt(i);const c=SUBJ_COLORS[n%SUBJ_COLORS.length];return {f:c[0],k:c[1]};}
function subjLabel(label){const t=String(label||"").replace(/[<&>"]/g,"").replace(/\s+/g," ").trim();if(!t)return {lines:[],fs:0};
  let lines=[t];const w=t.split(" ");
  if(t.length>9&&w.length>1){let best=null;for(let i=1;i<w.length;i++){const a=w.slice(0,i).join(" "),b=w.slice(i).join(" "),m=Math.max(a.length,b.length);if(!best||m<best.m)best={m:m,l:[a,b]};}lines=best.l;}
  const n=Math.max(...lines.map(x=>x.length));return {lines:lines,fs:Math.max(7,Math.min(lines.length>1?12:15,Math.floor(128/n)))};}   /* an Arabic letter ≈ half the font size wide (measured); 2 lines: at most 12, so the face stays free */

    if(Math.hypot(m[5]-m[1],m[6]-m[2])<2*hw+24)return `<path class="xarrow ${cls||""}" d="${d}" marker-end="url(#xhead)"/>`;   /* batch 29: no room → no word ON the arrow (the legend says what it means) */
    t=`<g class="needs" transform="translate(${x} ${y})"><rect x="${-hw}" y="-11" width="${2*hw}" height="20" rx="10"/><text y="4" text-anchor="middle">${nw}</text></g>`;}   /* «بيعتمد على» for the bigger grades */
  return `<path class="xarrow ${cls||""}" d="${d}" marker-end="url(#xhead)"/>${t}`;}
const DEFS=`<defs><marker id="xhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></marker></defs>`;
const edgeEnds=(a,b,r)=>{const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy)||1;return [[a[0]+dx/d*r,a[1]+dy/d*r],[b[0]-dx/d*r,b[1]-dy/d*r]];};

/* ======================= 🎵 THE SOUNDS (batch 26) — made in the browser with Web Audio, no sound files =======================
   · the AGE STAGE decides the character of the sound: kids = little melodies, high and bouncy · junior = soft and friendly ·
     teen = short clean notes · senior = deeper and calmer (one octave lower, a bigger room) — 🆕 batch 29: EVERY stage has a sound
     for every touch and move (Hareth: «لكل مرحلة أصوات خاصة، والكبار أصوات كبيرة»), only the little ones are the loudest;
   · the SUBJECT decides the instrument and the scale, so every subject sounds different:
       science = marimba · maths = plucked string · physics = electric piano · chemistry = glass bells ·
       geography = kalimba · history = wood · language = a soft flute · (anything else = a small bell);
   · never the same sound twice in a row: every event picks a note of the subject's pentatonic scale (always pleasant together),
     not the one it played last time, with a tiny change of pitch and loudness;
   · right moves in a row climb up the scale (a little tune that grows); a wrong move is a soft low note, never a buzzer;
   · a soft room echo + a limiter: never harsh, never too loud;
   · hovering a character (its pitch always comes from its name, so each one has its OWN voice): kids = a giggle · junior = a curious
     «همم؟» · teen = two quick rising notes · senior = one warm low note (🆕 batch 29: it used to be silent).
   Events it does not know (the films' cat, train, water…) go back to the old sounds (part3_core.js) and the stage packs (stage.js).
   🆕 batch 27 — a NEW subject (identity.py) brings its OWN sound in the page data (graph().sound = {instr, root, scale}):
       computer = a soft 8-bit «chip» · music = a harp · art = a vibraphone · economy / sport = a steel drum · religion = a calm harp …
       and anything else gets a stable instrument + key + scale from its name. The 7 subjects we had keep exactly their sounds. */
const SOUND=(()=>{
  const SCALE={major:[0,2,4,7,9],sus:[0,2,5,7,9],minor:[0,3,5,7,10],egypt:[0,2,5,7,10]};
  const SUBJ={science:{instr:"marimba",root:65,scale:"major"},math:{instr:"pluck",root:60,scale:"major"},physics:{instr:"epiano",root:62,scale:"major"},
    chemistry:{instr:"glass",root:69,scale:"major"},geography:{instr:"kalimba",root:67,scale:"sus"},history:{instr:"wood",root:57,scale:"minor"},
    language:{instr:"flute",root:62,scale:"minor"},general:{instr:"bell",root:60,scale:"major"}};
  const STG={kids:{vel:1,oct:12,wet:.14},junior:{vel:.64,oct:0,wet:.2},teen:{vel:.52,oct:0,wet:.14},senior:{vel:.44,oct:-12,wet:.22}};   /* senior: an octave lower + a bigger room = a «big», calm sound */
  let bus=null,TEST=null,FORCE=null,NB=null;const LOG=[];
  const ctx=()=>TEST||ac();
  const hz=m=>440*Math.pow(2,(m-69)/12);
  function impulse(a,sec,decay){const n=Math.floor(a.sampleRate*sec),b=a.createBuffer(2,n,a.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay);}return b;}
  function getBus(){const a=ctx();if(bus&&bus.a===a)return bus;
    const lim=a.createDynamicsCompressor();lim.threshold.value=-14;lim.knee.value=10;lim.ratio.value=4;lim.attack.value=.003;lim.release.value=.25;lim.connect(a.destination);
    const master=a.createGain();master.gain.value=.7;master.connect(lim);

    bus={a,master,rev};return bus;}
  function env(g,t,peak,att,dec){dec=Math.max(.06,dec);g.gain.setValueAtTime(.0001,t);   /* never a click too short to hear */g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),t+att);g.gain.exponentialRampToValueAtTime(.0001,t+att+dec);}
  function part(a,d,type,f,t,peak,att,dec,det){const g=a.createGain();g.connect(d);env(g,t,peak,att,dec);const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);
    if(det)o.detune.setValueAtTime(det,t);o.connect(g);o.start(t);o.stop(t+att+Math.max(.06,dec)+.05);}
  function hit(a,d,t,peak,dec){if(!NB||NB.sampleRate!==a.sampleRate){NB=a.createBuffer(1,Math.floor(a.sampleRate*.4),a.sampleRate);const c=NB.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;}
    const s=a.createBufferSource();s.buffer=NB;const g=a.createGain();g.connect(d);env(g,t,peak,.001,dec);s.connect(g);s.start(t);s.stop(t+dec+.05);}
  /* the instruments: f = pitch (Hz), t = when, v = loudness, L = length factor */
  const VOICES={
    marimba:(a,d,f,t,v,L)=>{part(a,d,"sine",f,t,.34*v,.004,.45*L);part(a,d,"sine",f*3.93,t,.09*v,.002,.09*L);part(a,d,"sine",f*9.4,t,.03*v,.001,.03);},
    pluck:(a,d,f,t,v,L)=>{const lp=a.createBiquadFilter();lp.type="lowpass";lp.Q.value=1.5;lp.frequency.setValueAtTime(Math.min(9000,f*10),t);
      lp.frequency.exponentialRampToValueAtTime(Math.max(220,f*1.5),t+.3*L);lp.connect(d);part(a,lp,"triangle",f,t,.36*v,.002,.55*L);part(a,lp,"sawtooth",f,t,.08*v,.002,.35*L,4);},
    epiano:(a,d,f,t,v,L)=>{const g=a.createGain();g.connect(d);env(g,t,.3*v,.003,.7*L);const car=a.createOscillator();car.frequency.setValueAtTime(f,t);   /* FM, like an electric piano */
      const mod=a.createOscillator();mod.frequency.setValueAtTime(f*2,t);const mg=a.createGain();mg.gain.setValueAtTime(f*1.6,t);mg.gain.exponentialRampToValueAtTime(f*.05,t+.4*L);
      mod.connect(mg);mg.connect(car.frequency);car.connect(g);car.start(t);mod.start(t);car.stop(t+.75*L+.06);mod.stop(t+.75*L+.06);},
    glass:(a,d,f,t,v,L)=>{part(a,d,"sine",f,t,.22*v,.002,1*L);part(a,d,"sine",f*2.756,t,.09*v,.002,.45*L,3);part(a,d,"sine",f*5.404,t,.04*v,.001,.22*L,-4);},
    kalimba:(a,d,f,t,v,L)=>{part(a,d,"sine",f,t,.32*v,.003,.55*L);part(a,d,"sine",f*6.26,t,.06*v,.001,.05);part(a,d,"triangle",f*2,t,.05*v,.002,.12*L);},
    wood:(a,d,f,t,v,L)=>{const bp=a.createBiquadFilter();bp.type="bandpass";bp.frequency.value=Math.min(8000,f*2.2);bp.Q.value=9;bp.connect(d);hit(a,bp,t,.7*v,.06);
      part(a,d,"sine",f,t,.36*v,.002,Math.max(.12,.2*L));part(a,d,"triangle",f*2.01,t,.08*v,.002,.08*L);},   /* a hollow wooden «tok», long enough to hear */
    flute:(a,d,f,t,v,L)=>{const g=a.createGain();g.connect(d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.24*v,t+.035);g.gain.exponentialRampToValueAtTime(.0001,t+.035+.5*L);
      const o=a.createOscillator();o.frequency.setValueAtTime(f,t);const lfo=a.createOscillator();lfo.frequency.value=5.2;const lg=a.createGain();lg.gain.value=f*.006;lfo.connect(lg);lg.connect(o.frequency);o.connect(g);

      root.addEventListener("pointerup",e=>{if(!drag)return;const from=drag.id,id=hit(toSvg(e));drag=null;rubber(null);
        if(id&&id!==from){select(null);attempt(from,id);}
        else if(id===from){sfx("pick");cap(`👉 اخترت ${naQ(from)}. ${VOICE("هلأ اكبس على المفهوم الثاني.")}`);}});
      root.addEventListener("pointercancel",()=>{drag=null;rubber(null);});
      document.getElementById("naHelp").addEventListener("click",()=>{naTake(root);const k=req.find(x=>!drawn.has(x));if(k===undefined)return;const l=s.links[k];
        root.querySelectorAll(".na-ghost").forEach(x=>x.remove());arrow(l.from,l.to,"na-ghost");sfx("pick");cap(`💡 ${VOICE("جرّب")}: ${VOICE("من")} ${naQ(l.from)} ${VOICE("لـ")}${naQ(l.to)}.`);});}};}

/* ⚖️ COMPARE — two close concepts. Each fact card goes to «X», to «Y», or to «الاثنين» (tap the card, then its place).
   Right → it is explained. Wrong → «try another place»; a second wrong try puts it in its place, with the reason. */
function sceneCompare(s){const v=V(),W=v?380:640,H=v?196:216,Z=v?76:90,A=s.target,B=s.other;
  const pa=[W*0.77,H/2-10],pb=[W*0.23,H/2-10];
  const svg=`<svg class="xstage" id="xs" viewBox="0 0 ${W} ${H}" role="img" aria-label="${naEsc(VOICE("قارن"))}">
    <ellipse class="na-venn na-va" cx="${W*0.62}" cy="${H/2}" rx="${W*0.25}" ry="${H*0.45}"/><ellipse class="na-venn na-vb" cx="${W*0.38}" cy="${H/2}" rx="${W*0.25}" ry="${H*0.45}"/>
    <text class="na-vlab" x="${W/2}" y="${H/2+5}" text-anchor="middle">${VOICE("الاثنين")}</text>
    ${node(A,pa[0],pa[1],Z,"happy","na-ca")}${node(B,pb[0],pb[1],Z,"happy","na-cb")}</svg>
    <div class="na-tray" id="naTray">${s.facts.map((f,i)=>`<div class="na-card" role="button" tabindex="0" data-i="${i}" aria-pressed="false">${naEsc(VOICE(f.fact))}</div>`).join("")}</div>
    <div class="na-zones">${[["a",naQ(A)],["both",VOICE("الاثنين")],["b",naQ(B)]].map(([k,t])=>`<div class="na-zone na-z-${k}" role="button" tabindex="0" data-side="${k}"><b class="na-zh">${naEsc(t)}</b><div class="na-zl"></div></div>`).join("")}</div>`;
  return {svg,wire:root=>{let pick=null;const tries={};
      const choose=i=>{naTake(root);pick=pick===i?null:i;document.querySelectorAll(".na-card").forEach(c=>{const on=+c.dataset.i===pick;c.classList.toggle("na-picked",on);c.setAttribute("aria-pressed",String(on));});if(pick!==null)sfx("pick");};
      const place=(i,side,auto)=>{const f=s.facts[i],card=document.querySelector(`.na-card[data-i="${i}"]`);if(!card)return;
        const z=document.querySelector(`.na-zone[data-side="${side}"] .na-zl`);const d=document.createElement("div");d.className="na-placed";d.textContent="✔️ "+VOICE(f.fact);z.appendChild(d);card.remove();pick=null;
        cap((auto?"💡 ":"")+f.why);sfx(auto?"pick":"place");(side==="both"?[A,B]:[side==="a"?A:B]).forEach(id=>mood(root,id,"laugh"));
        if(!document.querySelector(".na-card"))setTimeout(()=>{if(!root.isConnected)return;cap(s.end_say);sfx("ready");if(!grown())sparkles();},900);};
      const drop=side=>{naTake(root);if(pick===null){cap(VOICE("👆 اختار بطاقة أول، وبعدين مكانها."));return;}const i=pick,f=s.facts[i];
        if(f.side===side){place(i,side,false);return;}
        tries[i]=(tries[i]||0)+1;const z=document.querySelector(`.na-zone[data-side="${side}"]`);z.classList.remove("na-nope");void z.offsetWidth;z.classList.add("na-nope");sfx("nope");
        if(tries[i]>=2)place(i,f.side,true);else cap(VOICE("🙂 مش هون. فكّر فيها كمان، وجرّب مكان ثاني."));};
      document.querySelectorAll(".na-card").forEach(c=>{c.addEventListener("click",()=>choose(+c.dataset.i));naKeys(c,()=>choose(+c.dataset.i));});
      document.querySelectorAll(".na-zone").forEach(z=>{z.addEventListener("click",()=>drop(z.dataset.side));naKeys(z,()=>drop(z.dataset.side));});}};}

/* 🧑‍🏫 TEACH — a classmate does not get it. He asks; the student picks the answer; the classmate repeats it in his words.
   A wrong pick is answered with WHY (that definition belongs to «Y» · the arrow is the other way). At the end: the explanation he built. */
function sceneTeach(s){const v=V(),W=v?380:640,H=v?226:236,st=stageNow(),Z=v?90:104;
  const mate=st==="kids"?skin().name:st==="junior"?"صاحبك":"زميلك";
  const M=v?[92,104]:[180,108],T=v?[W-96,104]:[W-180,108];                      /* the classmate on the left: his messages are on the left */
  const person=`<svg class="ch" viewBox="0 0 100 100"><circle cx="50" cy="34" r="19" style="fill:var(--chip);stroke:var(--brand)" stroke-width="3"/><path d="M16 94 Q18 60 50 58 Q82 60 84 94 Z" style="fill:var(--chip);stroke:var(--brand)" stroke-width="3"/></svg>`;
  const mart=((st==="kids"||st==="junior")&&artSVG(skin().mascot,""))||person;   /* teen / senior: a plain person (no cartoon face) */
  const svg=`<svg class="xstage" id="xs" viewBox="0 0 ${W} ${H}" data-bubble="70" role="img" aria-label="${naEsc(VOICE("اشرح لزميلك"))}">
    <g class="xnode na-mate" data-id="__mate" transform="translate(${M[0]} ${M[1]})"><g class="xbody" data-mood="o">${mart.replace("<svg ",`<svg width="${Z}" height="${Z}" x="${-Z/2}" y="${-Z/2}" `)}</g><text class="xname" y="${Z/2+18}" text-anchor="middle">${naEsc(mate)}</text><g class="xsay"></g></g>
    ${node(s.target,T[0],T[1],Z,"happy","star")}</svg>
    <div class="na-chat" id="naChat" aria-live="polite"></div><div class="na-opts" id="naOpts"></div><div class="na-note" id="naNote" hidden></div>`;
  return {svg,wire:root=>{let r=0;const chat=document.getElementById("naChat"),opts=document.getElementById("naOpts");
      const msg=(who,html)=>{chat.insertAdjacentHTML("beforeend",`<div class="na-msg na-${who}">${who==="them"?`<b>${naEsc(mate)}:</b> `:""}${html}</div>`);};
      const ask=()=>{const R=s.rounds[r];msg("them",naEsc(VOICE(R.ask)));say(root,"__mate",R.ask);mood(root,"__mate","o");
        opts.innerHTML=R.options.map((o,k)=>`<button class="na-opt" data-k="${k}">${naEsc(VOICE(o.opt))}</button>`).join("");
        opts.querySelectorAll(".na-opt").forEach(b=>b.addEventListener("click",()=>choose(+b.dataset.k,b)));};
      const end=()=>{const note=document.getElementById("naNote");note.hidden=false;note.innerHTML=richText(s.learnt);cap(s.learnt);sfx("ready");if(!grown())sparkles();
        say(root,"__mate",VOICE(st==="kids"?"هلأ فهمت! شكراً 😄":"هلأ وضحت. شكراً."));mood(root,"__mate","laugh");};
      const choose=(k,b)=>{naTake(root);const R=s.rounds[r],o=R.options[k];msg("me",naEsc(VOICE(o.opt)));
        if(o.ok){opts.innerHTML="";msg("them",richText(o.reply));say(root,"__mate",o.reply.replace(/[«»]/g,""));cap(o.reply);sfx("place");mood(root,"__mate","laugh");mood(root,s.target,"laugh");r++;
          setTimeout(()=>{if(!root.isConnected)return;if(r<s.rounds.length)ask();else end();},1300);}
        else{b.disabled=true;b.classList.add("na-wrong");msg("them",richText(o.reply));say(root,"__mate",o.reply.replace(/[«»]/g,""));cap(o.reply);sfx("nope");mood(root,"__mate","sad");}};
      ask();}};}

/* 🪜 LADDER — «ليش؟» again and again: each answer is the reason one rung deeper, down to the base
   (or «وبعدين؟»: what comes after, rung by rung). The arrows keep the «needs» direction (from the one who needs). */
function sceneLadder(s){const v=V(),n=s.rungs.length,W=v?380:640,G=v?128:140,TZ=v?94:100,Z=v?68:72;const H=72+G*n+82;   /* room between rungs: the «needs» label never sits on a name */
  const ids=[s.target].concat(s.rungs.map(r=>r.id));const dx=v?72:112;
  const pos=ids.map((id,k)=>[W/2+(k%2?-dx:dx),66+k*G]);const rail=v?160:200;   /* zigzag: every rung is beside the one before it */
  const svg=`<svg class="xstage" id="xs" viewBox="0 0 ${W} ${H}" data-bubble="74" role="img" aria-label="${naEsc(VOICE("السلّم"))}">${DEFS}
    <path class="na-rail" d="M${W/2-rail} 26 V${H-30} M${W/2+rail} 26 V${H-30}"/>${ids.slice(1).map((_,k)=>`<path class="na-rungline" d="M${W/2-rail} ${66+(k+1)*G} H${W/2+rail}"/>`).join("")}
    ${ids.slice(1).map((id,k)=>`<g class="na-slot" data-k="${k+1}"><circle cx="${pos[k+1][0]}" cy="${pos[k+1][1]}" r="${Z/2-4}"/><text x="${pos[k+1][0]}" y="${pos[k+1][1]+9}" text-anchor="middle">؟</text></g>`).join("")}
    <g id="naArrows"></g>${ids.map((id,k)=>node(id,pos[k][0],pos[k][1],k?Z:TZ,"happy",k?"na-hid":"star")).join("")}</svg>
    <div class="row center na-lrow"><button class="btn na-ask" id="naAsk">${s.mode==="why"?"❓ "+VOICE("ليش؟"):"⏭️ "+VOICE("وبعدين؟")}</button><button class="btn ghost" id="naReset" hidden>↺ ${VOICE("من الأول")}</button></div>`;
  return {svg,wire:root=>{let k=0;const ask=document.getElementById("naAsk"),reset=document.getElementById("naReset");
      const up=(a,b)=>s.mode==="why"?[a,b]:[b,a];                                 /* [the one who needs, what it needs] */
      ask.addEventListener("click",()=>{naTake(root);if(k>=n)return;const r=s.rungs[k];
        const [a,b]=up(ids[k],ids[k+1]),ia=ids.indexOf(a),ib=ids.indexOf(b);
        root.querySelector(`.xnode[data-id="${ids[k+1]}"]`).classList.remove("na-hid");root.querySelector(`.na-slot[data-k="${k+1}"]`).classList.add("na-found");
        const sg=pos[ib][0]>pos[ia][0]?1:-1,p=[pos[ia][0]+sg*((ia?Z:TZ)/2+6),pos[ia][1]],q=[pos[ib][0]-sg*((ib?Z:TZ)/2+12),pos[ib][1]];   /* from side to side: the arrow never crosses a name */
        const g=document.createElementNS(svgNS,"g");g.setAttribute("class","xedge lit na-arr");g.innerHTML=flow(curve(p,q,14),"");root.querySelector("#naArrows").appendChild(g);
        say(root,a,r.short);cap(r.because);mood(root,ids[k+1],"laugh");sfx("rung",{n:k,down:s.mode==="why"});k++;
        if(k>=n){ask.hidden=true;setTimeout(()=>{if(!root.isConnected)return;cap(s.end_say);sfx("ready");if(!grown())sparkles();reset.hidden=false;},1900);}});
      reset.addEventListener("click",()=>{k=0;root.querySelector("#naArrows").innerHTML="";root.querySelectorAll(".na-slot").forEach(x=>x.classList.remove("na-found"));ids.slice(1).forEach(id=>root.querySelector(`.xnode[data-id="${id}"]`).classList.add("na-hid"));
        say(root,null,"");ask.hidden=false;reset.hidden=true;cap(s.steps[0]);sfx("flip");});}};}

/* ======================= 👥 THE AGE STAGES (grade 1 → 12) =======================
   The same scenes for every grade, but the WORLD around them grows up with the student:
   · 🌈 kids   (1–4):  a playful friend — full faces, giggles, hops, emoji, playful sounds (as before);
   · 🧭 junior (5–7):  a curious explorer — faces without cheeks, no giggles, fewer emoji, soft sounds;
   · 🔬 teen   (8–9):  a confident classmate — eyes only, no hopping, «بيعتمد على» instead of «بيحتاج», clean clicks, a lab-notebook look;
   · 📐 senior (10–12): a calm expert — NO faces (textbook diagrams, thin lines), no emoji in the words, «نقاش» instead of «حوار», almost silent.
   The stage comes from the lesson (lesson.audience.stage, set by the factory from the book's grade). A small switcher lets you try any stage. */

  senior:{label:"ثانوي",grades:"١٠–١٢",icon:"📐",persona:"خبير هادي",giggle:false}};

const grown=()=>stageNow()==="teen"||stageNow()==="senior";

const VOICE_LINES={   /* whole childish lines → what a bigger student hears (teen | senior) */
  "أهلاً! 👋":["هاد أنا.","—"],"أنا هون! 👋":["هون.","هون."],"وصلتني! 😄":["وصلت.","اكتملت هالمرحلة."],"صار دوري! 😄":["دوري هلأ.","هلأ هالمرحلة."],
  "رجعت! 😄":["رجعت.","رجع يشتغل."],"وين راح؟ 😢":["غيابه أثّر عليّ.","تأثّر بغيابه."],"وأنا كمان! 😢":["وأنا كمان تأثّرت.","تأثّر كمان."],
  "اكبس المحطة الجاية، وأنا بمشي بالطريق 👣":["اكبس المحطة الجاية.","اكبس المرحلة التالية."],"اكبس المرحلة الجاية 👆":["اكبس المرحلة الجاية.","اكبس المرحلة التالية."],
  "أنا تمام 😎":["أنا ما تأثرت.","لا يتأثر."]};
const EMOJI_FACES=/[😀-🙏🤗-🤯🥰-🥺😎👋👣👆🙂]/gu;
function VOICE(t){if(t===null||t===undefined)return t;let s=String(t);const st=stageNow();if(st==="kids")return s;
  if(st==="junior")return s.replace(/\s*[😄😢😟😎]+/gu,"").replace(/\s{2,}/g," ").trim();               /* a few emoji less, the same friendly words */
  const line=VOICE_LINES[s.trim()];if(line){const v=line[st==="senior"?1:0];return v==="—"?"":v;}
  s=s.replace(/^أهلاً! أنا «([^»]+)»\.?$/,(m,n)=>st==="senior"?`تعريف «${n}».`:`هاد «${n}».`).replace(/^📌\s*/,"• ");   /* the first line of «تعرّف عليّ» */
  VOICE_WORDS.forEach(([a,b])=>{s=s.split(a).join(b);});
  s=s.replace(EMOJI_FACES,"");
  if(st==="senior")s=s.replace(/\p{Extended_Pictographic}️?/gu,m=>"✅✔️⚠️".includes(m)?m:"").replace(/(^|[^✅✔⚠])[\u200d\ufe0f]+/gu,"$1");   /* the expert: no pictures inside the words (and no leftover glue of 🧑‍🏫) */
  return s.replace(/\s+([.،!؟:])/g,"$1").replace(/\s{2,}/g," ").trim();}

function applyStage(){const st=stageNow();document.body.dataset.stage=st;
  const sel=document.getElementById("stageSel");if(sel&&!sel.__wired){sel.__wired=true;sel.addEventListener("change",()=>{STAGE_OVERRIDE=sel.value||null;sfx("pop");
    /* 🆕 batch 29: choosing a stage TAKES you to its books (the first one of that stage); its look then follows the book by itself.

    const want=STAGE_OVERRIDE,gi=want?DATA.graphs.findIndex(g=>(g.audience||{}).stage===want):-1;

/* ⏳ two honest meanings (the factory decides from the graph's own words):
   · «becomes» (the seed sprouts): قبل / بعد — the old one fades INTO the new one;
   · «needs»  (the stem needs the root): أول / وبعدين — the first one STAYS, the second comes after it, and the «بيحتاج» arrow + the reason appear.
   A line under the slider always says in words what the picture shows (it was not explained before). */
function sceneBeforeAfter(s){const v=V(),W=v?380:640,H=v?250:300,becomes=s.mode==="becomes";const A=exName(s.before),B=exName(s.target);
  const L1=becomes?"قبل":"أول",L2=becomes?"بعد":"وبعدين";const xa=v?W-95:W-150,xb=v?95:150,Z=v?96:120;
  const arrow=becomes?`<path class="xarrow" id="baArrow" d="M${xa-Z*0.7} 150 L${xb+Z*0.7} 150" marker-end="url(#xhead)" opacity=".25"/>`
    :`<g id="baArrow" opacity="0">${flow(`M${xb+Z*0.6} 150 Q${W/2} 120 ${xa-Z*0.6} 150`,"",false,true)}</g>`;   /* «needs»: from the one who needs → to what it needs */
  const svg=`<svg class="xstage" id="xs" viewBox="0 0 ${W} ${H}" role="img" aria-label="${L1} و${L2}">${DEFS}
    <text x="${xa}" y="36" class="xlabel" text-anchor="middle">${L1}</text><text x="${xb}" y="36" class="xlabel" text-anchor="middle">${L2}</text>
    <g id="bef">${node(s.before,xa,150,Z,"happy")}</g>${arrow}
    <g id="aft" opacity=".15">${node(s.target,xb,150,Z,becomes?"sad":"happy")}</g></svg>
    <div class="slider2"><span>${L1}: «${A}»</span><input type="range" id="ba" min="0" max="100" value="0" aria-label="${L1} و${L2}"><span>${L2}: «${B}»</span></div>
    <p class="baexp" id="baexp" aria-live="polite"></p>`;
  const say0=becomes?`👀 هاد «${A}». اسحب الشريط وشوف شو بيصير فيه.`:`1️⃣ أول لازم يكون في «${A}». اسحب الشريط ←`;
  const sayMid=becomes?`⏳ «${A}» عم ${/ة$/.test(A.split(" ")[0])?"بتتغيّر":"بيتغيّر"}…`:`2️⃣ «${A}» لسا موجود، و«${B}» عم ييجي بعده…`;
  const sayEnd=s.steps[1]||"";
  return {svg,wire:root=>{const r=document.getElementById("ba"),ex=document.getElementById("baexp");let told=false,last="";
      const tell=t=>{const msg=t>=0.95?"✅ "+sayEnd:t>0.05?sayMid:say0;if(msg!==last){last=msg;ex.innerHTML=richText(msg);}};tell(0);
      r.addEventListener("input",()=>{const t=+r.value/100;
        if(becomes)root.querySelector("#bef").setAttribute("opacity",(1-0.75*t).toFixed(2));              /* becomes: the old one fades into the new */
        else root.querySelector("#bef").setAttribute("opacity","1");                                       /* needs: the first one STAYS */
        root.querySelector("#aft").setAttribute("opacity",(0.15+0.85*t).toFixed(2));
        root.querySelector("#baArrow").setAttribute("opacity",(becomes?0.25+0.75*t:Math.max(0,(t-0.4)/0.6)).toFixed(2));
        mood(root,s.target,t>0.9?"laugh":t>0.4?"happy":becomes?"sad":"happy");tell(t);
        if(t>0.95&&!told){told=true;sfx("bloom");cap("⏳ "+sayEnd);}if(t<0.5)told=false;});}};}

/* ======================= 🎞️ THE FILM ENGINE: real processes, acted out — then the student drives them =======================
   One engine for every subject. Each verb = what REALLY happens:
   visit (a bee flies to the flower) · carry (the wind takes the seed far) · transform (the seed sprouts) ·
   combine / take_away / groups / share (blocks) · cut / equivalent / compare (pizza) · build (stones become a pyramid) ·
   exchange (goods ↔ money) · flow_river (the river waters the fields) · write (pictures on a tablet).
   Each step of the narrator plays one part of the film; then «🖐️ دورك»: the student does it by hand. */
function scenePlay(s){const W=640,H=340;const A=(id,sz,x,y,cls)=>{const ic=iconOf(id);let a=(ic?artSVG(ic,""):null)||`<svg class="ch" viewBox="0 0 100 100">${ARTS.blob(colorOf(id))}</svg>`;
    return `<g class="pa ${cls||""}" data-id="${id}" transform="translate(${x} ${y})"><g class="xbody" data-mood="happy">${a.replace("<svg ",`<svg width="${sz}" height="${sz}" x="${-sz/2}" y="${-sz/2}" `)}</g><text class="xname" y="${/actor/.test(cls||"")?-sz/2-8:sz/2+16}" text-anchor="middle">${exName(id)}</text></g>`;};   /* the one who MOVES has its name on top: it never lands on the flower's petals */
  const block=(x,y,col,cls)=>`<rect class="blk ${cls||""}" x="${x-13}" y="${y-13}" width="26" height="26" rx="6" fill="${col}" stroke="#3b2a1a" stroke-width="2.2"/>`;
  const ex=s.example||{};let body="";const v=s.verb;
  if(v==="visit")body=`${A(s.with,110,300,220,"tgt")}${s.result?`<g id="res" opacity="0">${A(s.result,64,430,250)}</g>`:""}<g id="pollen"></g>${A(s.target,70,560,70,"actor drag")}`;
  else if(v==="carry")body=`<g id="windl"></g>${A(s.target,70,90,70,"actor")}${A(s.with,56,170,230,"item drag")}<path d="M60 300 H600" stroke="#B07A4A" stroke-width="10"/>${s.result?`<g id="res" opacity="0">${A(s.result,58,540,250)}</g>`:""}`;
  else if(v==="transform")body=`${A(s.with,100,320,190,"from")}<g id="to" opacity="0">${A(s.target,110,320,180)}</g>${s.result?`<g id="res" opacity="0">${A(s.result,60,500,200)}</g>`:""}`;
  else if(v==="combine")body=`<g id="ga">${[...Array(ex.a)].map((_,i)=>block(470+(i%2)*30,140+Math.floor(i/2)*30,"#7CC6F2")).join("")}</g><g id="gb">${[...Array(ex.b)].map((_,i)=>block(150+(i%2)*30,140+Math.floor(i/2)*30,"#F28AA8")).join("")}</g><text id="eq" x="320" y="300" text-anchor="middle" class="bigeq">${ex.a} + ${ex.b} = ?</text>`;
  else if(v==="take_away")body=`<g id="all">${[...Array(ex.a)].map((_,i)=>block(230+(i%4)*32,130+Math.floor(i/4)*32,"#7CC6F2",i<ex.b?"go drag":"")).join("")}</g><text id="eq" x="320" y="300" text-anchor="middle" class="bigeq">${ex.a} − ${ex.b} = ?</text>`;
  else if(v==="groups")body=`<g id="rows"></g><text id="eq" x="320" y="310" text-anchor="middle" class="bigeq">${ex.a} × ${ex.b} = ?</text>`;
  else if(v==="share")body=`${[0,1,2].map(i=>`<rect x="${100+i*170}" y="200" width="130" height="70" rx="12" fill="none" stroke="var(--line)" stroke-width="3" stroke-dasharray="6 5"/>`).join("")}<g id="pile">${[...Array(ex.a)].map((_,i)=>block(250+(i%6)*28,90+Math.floor(i/6)*28,"#F6C177","drag")).join("")}</g><text id="eq" x="320" y="320" text-anchor="middle" class="bigeq">${ex.a} ÷ ${ex.b} = ?</text>`;
  else if(v==="cut"||v==="equivalent"||v==="compare"){const pie=(cx,cy,r,parts,shade,id)=>`<g id="${id}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#F6C177" stroke="#3b2a1a" stroke-width="3"/><g class="slices" data-parts="${parts}" data-shade="${shade}" data-cx="${cx}" data-cy="${cy}" data-r="${r}"></g></g>`;
    body=v==="cut"?`${pie(320,170,110,ex.parts,ex.shade,"p1")}<text id="eq" x="320" y="320" text-anchor="middle" class="bigeq"> </text>`:
      v==="equivalent"?`${pie(190,160,90,2,1,"p1")}${pie(450,160,90,4,2,"p2")}<text id="eq" x="320" y="300" text-anchor="middle" class="bigeq"> </text>`:
      `<rect x="120" y="90" width="400" height="50" rx="8" fill="#fff" stroke="#3b2a1a" stroke-width="2.4"/><rect id="b1" x="120" y="90" width="0" height="50" rx="8" fill="#7CC6F2"/><rect x="120" y="190" width="400" height="50" rx="8" fill="#fff" stroke="#3b2a1a" stroke-width="2.4"/><rect id="b2" x="120" y="190" width="0" height="50" rx="8" fill="#F28AA8"/><text x="560" y="122" class="bigeq">1/2</text><text x="560" y="222" class="bigeq">1/4</text><text id="eq" x="320" y="300" text-anchor="middle" class="bigeq"> </text>`;}
  else if(v==="build")body=`<g id="slots"></g><g id="stones">${[...Array(6)].map((_,i)=>`<rect class="stone drag" data-i="${i}" x="${470+(i%3)*44}" y="${230+Math.floor(i/3)*34}" width="40" height="28" rx="4" fill="#E9C46A" stroke="#B8893B" stroke-width="2.4"/>`).join("")}</g>`;
  else if(v==="exchange")body=`<g transform="translate(150 180)"><g class="xbody" data-mood="happy"><svg width="90" height="90" x="-45" y="-45" class="ch" viewBox="0 0 100 100">${ARTS.blob("#9CCFD8")}</svg></g><text class="xname" y="62" text-anchor="middle">البائع</text></g><g transform="translate(490 180)"><g class="xbody" data-mood="happy"><svg width="90" height="90" x="-45" y="-45" class="ch" viewBox="0 0 100 100">${ARTS.blob("#F6C177")}</svg></g><text class="xname" y="62" text-anchor="middle">الشاري</text></g><g id="goods" class="drag" transform="translate(220 150)"><rect x="-22" y="-18" width="44" height="36" rx="5" fill="#C98A55" stroke="#3b2a1a" stroke-width="2.4"/><path d="M-22 -4 H22" stroke="#3b2a1a" stroke-width="2"/></g><g id="coins" transform="translate(420 150)"><svg width="46" height="46" x="-23" y="-23" class="ch" viewBox="0 0 100 100">${ARTS.coins()}</svg></g>`;
  else if(v==="flow_river")body=`<path id="riv" d="M40 80 C200 40 220 200 330 170 C440 140 470 280 610 260" stroke="#7CC6F2" stroke-width="34" fill="none" stroke-linecap="round"/><g id="drops"></g><g id="fields"></g>`;
  else if(v==="write")body=`<rect x="200" y="50" width="240" height="250" rx="12" fill="#E9C46A" stroke="#3b2a1a" stroke-width="3"/><g id="glyphs"></g>`;
  const svg=`<svg class="xstage play" id="xs" viewBox="0 0 ${W} ${H}" role="img" aria-label="فيلم: ${SNAME.play}">${DEFS}${body}<g id="pfx"></g></svg><div class="drive" id="drive" hidden>🖐️ ${s.drive}</div>`;
  let done=-1,driving=false,root=null;
  const $p=q=>root.querySelector(q);
  const moveTo=(el,to,ms,arc)=>new Promise(res=>{const m=(el.getAttribute("transform")||"").match(/translate\(([-\d.]+)[ ,]+([-\d.]+)/)||[0,0,0];const a=[+m[1],+m[2]];let t=0;
    const go=()=>{if(!el.isConnected)return res();t=Math.min(1,t+(reduce?1:16/ms));const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;const x=a[0]+(to[0]-a[0])*e,y=a[1]+(to[1]-a[1])*e-Math.sin(Math.PI*e)*(arc||0);
      el.setAttribute("transform",`translate(${x} ${y})`);if(t<1)requestAnimationFrame(go);else res();};go();});
  const fade=(el,op)=>{if(el){el.style.transition="opacity .6s";el.setAttribute("opacity",op);}};
  const grow=el=>{if(!el)return;el.setAttribute("opacity","1");el.classList.add("growin");};
  const blockMove=(el,dx,dy,ms)=>new Promise(res=>{const x0=+el.getAttribute("x"),y0=+el.getAttribute("y");let t=0;const go=()=>{if(!el.isConnected)return res();t=Math.min(1,t+(reduce?1:16/ms));el.setAttribute("x",x0+dx*t);el.setAttribute("y",y0+dy*t);if(t<1)requestAnimationFrame(go);else res();};go();});
  const eq=t=>{const e=$p("#eq");if(e){e.textContent=t;e.classList.remove("pop2");void e.getBBox;e.classList.add("pop2");}};
  const slices=(g,upto)=>{const n=+g.dataset.parts,sh=+g.dataset.shade,cx=+g.dataset.cx,cy=+g.dataset.cy,r=+g.dataset.r;let out="";
    for(let i=0;i<n;i++){const a0=-Math.PI/2+i*2*Math.PI/n,a1=a0+2*Math.PI/n;const p=(a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];const [x0,y0]=p(a0),[x1,y1]=p(a1);
      out+=`<path d="M${cx} ${cy} L${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1}Z" fill="${i<Math.min(sh,upto)?"#E8574A":"transparent"}" stroke="#3b2a1a" stroke-width="2.4"/>`;}g.innerHTML=out;};
  /* the film, in parts (one per narrator step); each part is safe to call again */
  const parts={
    visit:[()=>{const b=$p(".actor");say(root,null,"");return moveTo(b,[340,150],1500,60);},
           ()=>{const fx=$p("#pollen");for(let i=0;i<10;i++){const c=document.createElementNS(svgNS,"circle");c.setAttribute("r",3);c.setAttribute("fill","#F2B33D");c.setAttribute("cx",300+Math.cos(i)*40);c.setAttribute("cy",200+Math.sin(i)*30);c.classList.add("sparkle");fx.appendChild(c);}sfx("buzz");return Promise.resolve();},
           ()=>{grow($p("#res"));sfx("bloom");return Promise.resolve();}],
    carry:[()=>{const w=$p("#windl");w.innerHTML=[0,1,2].map(i=>`<path d="M${80+i*30} ${120+i*20} C200 ${100+i*20} 300 ${150+i*20} 420 ${120+i*20}" class="windline"/>`).join("");sfx("wind");return Promise.resolve();},
           ()=>moveTo($p(".item"),[520,240],1800,90),

    transform:[()=>{$p(".from").classList.add("shake");return Promise.resolve();},
               ()=>{fade($p(".from"),0);grow($p("#to"));sfx("bloom");return Promise.resolve();},          /* the old one disappears completely: no name under the new one */

    combine:[()=>Promise.resolve(),()=>{const a=$p("#ga"),b=$p("#gb");return Promise.all([moveTo(a,[-110,0],1200),moveTo(b,[110,0],1200)]).then(()=>{eq(`${ex.a} + ${ex.b} = ${ex.r}`);sfx("pop");});},()=>Promise.resolve()],
    take_away:[()=>Promise.resolve(),()=>Promise.all([...root.querySelectorAll(".blk.go")].map((b,i)=>blockMove(b,260+i*10,-60,900))).then(()=>{root.querySelectorAll(".blk.go").forEach(b=>fade(b,0.15));eq(`${ex.a} − ${ex.b} = ${ex.r}`);}),()=>Promise.resolve()],
    groups:[()=>Promise.resolve(),()=>{const g=$p("#rows");let out="";for(let r=0;r<ex.a;r++)for(let c=0;c<ex.b;c++)out+=block(230+c*34,80+r*40,["#7CC6F2","#F28AA8","#6CC27A"][r%3],"rowb r"+r);g.innerHTML=out;
      root.querySelectorAll(".rowb").forEach(b=>{const r=+b.getAttribute("class").match(/r(\d)/)[1];b.style.animationDelay=(r*0.45)+"s";b.classList.add("growin");});setTimeout(()=>eq(`${ex.a} × ${ex.b} = ${ex.r}`),1400);return Promise.resolve();},()=>Promise.resolve()],
    share:[()=>Promise.resolve(),()=>Promise.all([...root.querySelectorAll("#pile .blk")].map((b,i)=>{const box=i%ex.b,slot=Math.floor(i/ex.b);return blockMove(b,(110+box*170+12+slot*28)-(+b.getAttribute("x")),(215)-(+b.getAttribute("y")),700+i*60);})).then(()=>eq(`${ex.a} ÷ ${ex.b} = ${ex.r}`)),()=>Promise.resolve()],
    cut:[()=>{root.querySelectorAll(".slices").forEach(g=>slices(g,0));sfx("pop");return Promise.resolve();},
         ()=>{root.querySelectorAll(".slices").forEach(g=>slices(g,99));const p=$p(".slices");if(p)eq(s.target&&iconOf(s.target)==="🔼"?`البسط = ${p.dataset.shade}`:iconOf(s.target)==="🔽"?`المقام = ${p.dataset.parts}`:`${p.dataset.shade}/${p.dataset.parts}`);return Promise.resolve();},()=>Promise.resolve()],
    equivalent:[()=>{root.querySelectorAll(".slices").forEach(g=>slices(g,99));return Promise.resolve();},()=>{eq("1/2 = 2/4 ✓");sfx("pop");return Promise.resolve();},()=>Promise.resolve()],
    compare:[()=>{$p("#b1").setAttribute("width","200");$p("#b2").setAttribute("width","100");return Promise.resolve();},()=>{eq("1/2 > 1/4");sfx("pop");return Promise.resolve();},()=>Promise.resolve()],

                ()=>Promise.resolve(),()=>{$p("#fields").innerHTML=[[140,170],[250,250],[440,90],[540,190],[90,250],[380,280]].map(([x,y])=>`<g transform="translate(${x} ${y})"><g class="growin"><svg width="54" height="54" x="-27" y="-27" class="ch" viewBox="0 0 100 100">${ARTS.wheat()}</svg></g></g>`).join("");sfx("bloom");return Promise.resolve();}],
    write:[()=>Promise.resolve(),()=>{const g=$p("#glyphs");const G=["𓂀","𓃒","𓆣","𓇳","𓈖","𓊖"];g.innerHTML=G.map((x,i)=>`<text x="${240+(i%3)*70}" y="${110+Math.floor(i/3)*90}" font-size="44" class="growin" style="animation-delay:${i*0.3}s">${x}</text>`).join("");return Promise.resolve();},()=>Promise.resolve()]};
  const P=parts[v]||[];
  const playUpTo=k=>{const last=k>=s.steps.length-1;for(let i=done+1;i<=(last?P.length-1:Math.min(k,P.length-1));i++){done=i;P[i]();}if(last)setTimeout(startDrive,1600);};   /* last step → the WHOLE film has played (a 2-step film was missing its ending) */
  /* 🖐️ the student does it by hand (same result, his own hand) */

      /* drag: the actor/item/goods/stones/blocks; drop near where it really goes → that part of the film plays */
      root.querySelectorAll(".drag").forEach(el=>el.addEventListener("pointerdown",e=>{e.preventDefault();const R=root.getBoundingClientRect(),vb=root.viewBox.baseVal;

          if(v==="visit")good=Math.hypot(x-300,y-220)<110;else if(v==="carry")good=x>420;else if(v==="exchange")good=x>380;

/* ======================= THE NARRATOR + VIDEO MODE =======================
   · one place for words: a SHORT line that changes with the picture (types in once, then stays still);
   · names in the line are tappable: the same character lights up in the picture; a tooltip says what it is;
   · (batch 26: the «read aloud» button was removed — with no Arabic voice on the device it only said the numbers: «six, seven…»);
   · «📖 ليش؟» — the longer, simple «why» — opens by itself when the scene ends (and any time on tap);
   · 🎬 video mode: the scene plays by itself — everything dims, a spotlight and the camera move to what we talk about;
     at the end: «🖐️ جرّب بنفسك» and the scene becomes a playground;
   · hovering a character: each age reacts its own way (kids giggle in their own voice … seniors just show the name and meaning). */
let VIDEO=false,vTimer=0;
const byName=()=>{const m={};Object.entries(graph().names).forEach(([id,n])=>m[n]=id);return m;};
const meaningOf=id=>{const l=lesson();for(const c of l.concepts){const m=c.scenes[0];if(c.concept_id===id&&m&&m.paragraph)return m.paragraph.replace(/^«[^»]+»:\s*/,"").split(".")[0];}return "";};
function richText(t){const map=byName();return String(VOICE(t)||"").split(/(«[^»]+»)/).map(part=>{const m=part.match(/^«([^»]+)»$/);
    if(m&&map[m[1]]){const tip=meaningOf(map[m[1]]);return `<button class="kw" data-id="${map[m[1]]}" title="${tip.replace(/"/g,"")}">«${m[1]}»</button>`;}
    return part.split(/(\s+)/).map(w=>w.trim()?`<span class="w">${w}</span>`:w).join("");}).join("")
    .replace(/(<button class="kw"[^>]*>[^<]*<\/button>)(<span class="w">[.،,:!؟؛)]+<\/span>)/g,'<span class="nwr">$1$2</span>')   /* «الساق». : the dot never jumps alone to the next line */
    .replace(/(<span class="w">[وفبلك]{1,2}ـ?<\/span>)(<span class="nwr">.*?<\/span><\/span>|<button class="kw"[^>]*>[^<]*<\/button>)/g,'<span class="nwr">$1$2</span>');}   /* و«الحروف» · فـ«الجذر» · لـ«الورقة»: the little prefix stays glued to its word */
function cap(t){const c=document.getElementById("cap");if(!c)return;c.innerHTML=richText(t);
  const words=[...c.querySelectorAll(".w,.kw")];
  if(!reduce){words.forEach((w,i)=>{w.classList.add("hid");setTimeout(()=>w.classList.remove("hid"),40+i*55);});}     /* types in once, then stays still */
  c.querySelectorAll(".kw").forEach(k=>{k.classList.add("pulse");k.addEventListener("click",ev=>{ev.stopPropagation();const root=document.getElementById("xs");if(!root)return;
      const nd=root.querySelector(`.xnode[data-id="${k.dataset.id}"]`);if(nd){focus(root,[k.dataset.id]);mood(root,k.dataset.id,"joy");say(root,k.dataset.id,"أنا هون! 👋");setTimeout(()=>mood(root,k.dataset.id,"happy"),1200);}
      showTip(k);sfx("pop");});});}
function showTip(k){document.querySelectorAll(".tip").forEach(x=>x.remove());const tip=k.getAttribute("title");if(!tip)return;
  const d=document.createElement("span");d.className="tip";d.textContent=tip;k.appendChild(d);setTimeout(()=>d.remove(),3500);}

/* ---- what to look at in each step (the spotlight and the camera follow it) ---- */
function stepTargets(s,k){const N=id=>`.xnode[data-id="${id}"]`;const t=(s.steps[k]||"");
  switch(s.kind){
    case "overview":return k===0?[]:s.concepts.slice(0,3).map(N);
    case "meet":{const f=(s.focus||[])[k]||"target";if(f==="ins")return [N(s.target)].concat(s.ins.slice(0,2).map(N));
      if(f.startsWith("out:"))return [N(s.target),N(f.slice(4))];return [N(s.target)];}
    case "journey":return k===0?[N(s.route[0])]:k===1?s.route.slice(0,2).map(N):s.route.map(N);
    case "what_if":return k===0?[N(s.target)]:k===1?[N(s.target)].concat(s.affected.map(N)):s.affected.map(N).concat((s.calm||[]).map(N));
    case "world":return t.includes("🚿")?["#can","#roots","#stem"]:t.includes("☀️")?["#sun","#leaves"]:t.includes("💨")?["#win","#leaves"]:["#plant"];}
  return [];}
function svgBoxes(root,sels){const R=root.getBoundingClientRect(),vb=root.viewBox.baseVal;const sx=vb.width/R.width,sy=vb.height/R.height;
  return sels.map(q=>root.querySelector(q)).filter(Boolean).map(el=>{const r=el.getBoundingClientRect();return {x:vb.x+(r.left-R.left)*sx,y:vb.y+(r.top-R.top)*sy,w:r.width*sx,h:r.height*sy};});}
let FULL=null;
function camera(root,boxes){if(!FULL)return;let x0=FULL[0],y0=FULL[1],w=FULL[2],h=FULL[3];
  if(boxes&&boxes.length){const a=Math.min(...boxes.map(b=>b.x)),b2=Math.min(...boxes.map(b=>b.y)),c=Math.max(...boxes.map(b=>b.x+b.w)),d=Math.max(...boxes.map(b=>b.y+b.h));
    const pad=70,ratio=FULL[2]/FULL[3];w=Math.max(c-a+pad*2,FULL[2]*0.62);h=w/ratio;if(d-b2+pad*2>h){h=d-b2+pad*2;w=h*ratio;}   /* zoom in at most ×1.6: the place stays clear */
    w=Math.min(w,FULL[2]);h=Math.min(h,FULL[3]);
    /* centre on the thing; near an edge the frame may look only a LITTLE past the picture (15%) — the dark layer covers it, so no white strips */
    const mx=FULL[2]*0.15,my=FULL[3]*0.15;
    x0=Math.max(FULL[0]-mx,Math.min(FULL[0]+FULL[2]+mx-w,(a+c)/2-w/2));y0=Math.max(FULL[1]-my,Math.min(FULL[1]+FULL[3]+my-h,(b2+d)/2-h/2));}
  const vb=root.viewBox.baseVal,from=[vb.x,vb.y,vb.width,vb.height],to=[x0,y0,w,h];let t=0;cancelAnimationFrame(root.__cam||0);const t0=performance.now();
  const go=()=>{if(!root.isConnected)return;t=reduce?1:Math.min(1,(performance.now()-t0)/650);   /* by the clock (not by frames): same speed on a slow phone */const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    root.setAttribute("viewBox",from.map((v,i)=>(v+(to[i]-v)*e).toFixed(1)).join(" "));placeBubble(root);   /* the bubble glides with the camera: same size, inside the frame */
    if(t<1)root.__cam=requestAnimationFrame(go);};go();}
/* 🔦 the spotlight: a SOFT light (feathered edges, not a hard white hole); the dark layer goes UNDER the speech bubble */
function spotlight(root,boxes){let g=root.querySelector("#spot");if(!boxes){if(g){g.classList.add("off");setTimeout(()=>{if(g.classList.contains("off"))g.remove();},380);}return;}
  if(!g){g=document.createElementNS(svgNS,"g");g.id="spot";g.setAttribute("pointer-events","none");}
  g.classList.remove("off");const lay=root.querySelector(":scope > #saylayer");if(lay)root.insertBefore(g,lay);else root.appendChild(g);
  const F=FULL,big=Math.max(F[2],F[3]);
  g.innerHTML=`<defs><filter id="spf" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${(big/45).toFixed(1)}"/></filter>
      <mask id="spm" maskUnits="userSpaceOnUse" x="${F[0]-big}" y="${F[1]-big}" width="${F[2]+2*big}" height="${F[3]+2*big}"><rect x="${F[0]-big}" y="${F[1]-big}" width="${F[2]+2*big}" height="${F[3]+2*big}" fill="white"/>
      <g filter="url(#spf)">${boxes.map(b=>`<ellipse cx="${b.x+b.w/2}" cy="${b.y+b.h/2}" rx="${b.w/2+34}" ry="${b.h/2+30}" fill="black"/>`).join("")}</g></mask></defs>
    <rect class="spotdim" x="${F[0]-big}" y="${F[1]-big}" width="${F[2]+2*big}" height="${F[3]+2*big}" mask="url(#spm)"/>`;}
/* the camera goes to the NEW thing of this step (not to the middle between two characters) */
function cameraTargets(s,k){const N=id=>`.xnode[data-id="${id}"]`;const f=(s.focus||[])[k]||"";
  if(s.kind==="meet"){if(f==="ins")return s.ins.slice(0,2).map(N);if(f.startsWith("out:"))return [N(f.slice(4))];return [N(s.target)];}
  if(s.kind==="journey")return k===0?[N(s.route[0])]:k===1?[N(s.route[1])]:null;
  if(s.kind==="what_if")return k===0?[N(s.target)]:null;
  return stepTargets(s,k);}
function videoStep(root,s,k){if(!VIDEO)return;const sel=stepTargets(s,k);if(s.kind==="overview"&&k===0){spotlight(root,null);camera(root,null);return;}
  let camSel=cameraTargets(s,k);const vb=root.viewBox.baseVal;
  const spk=root.__lastSay&&`.xnode[data-id="${root.__lastSay[0]}"]`;if(camSel&&camSel.length&&spk&&!camSel.includes(spk)&&root.querySelector(spk))camSel=camSel.concat([spk]);   /* who is talking stays in the picture with its bubble */const keep=[vb.x,vb.y,vb.width,vb.height];
  root.setAttribute("viewBox",FULL.join(" "));                              /* measure in the full picture… */
  const boxes=svgBoxes(root,sel),camBoxes=camSel?svgBoxes(root,camSel):null;
  root.setAttribute("viewBox",keep.join(" "));                              /* …then glide from where we are */
  spotlight(root,boxes.length?boxes:null);camera(root,camBoxes&&camBoxes.length?camBoxes:null);}
function stopVideo(root,keepWhy){VIDEO=false;clearTimeout(vTimer);const pb=document.getElementById("play");if(pb){pb.textContent="▶️ شغّل";pb.setAttribute("aria-pressed","false");}
  if(root){spotlight(root,null);camera(root,null);}}
function endOfScene(root){stopVideo(root);const why=document.getElementById("why");if(why){why.hidden=false;why.classList.add("pop2");}
  const tr=document.getElementById("tryit");if(tr)tr.hidden=false;}
/* ---- 👆 hovering a character, by age (batch 26):
   kids: the eyes go ^ ^, it hops and giggles in its OWN voice · junior: it leans, curious, a soft «همم؟» ·
   teen: it glows + one light tick + its name and meaning · senior: no sound, only its name and meaning (a small label). ---- */
let lastHover=0;
function hoverTip(root,n){let L=root.querySelector(":scope > #hvlayer");if(!n){if(L)L.innerHTML="";return;}
  const id=n.dataset.id,txt=meaningOf(id);if(!txt||!graph().names[id])return;
  if(!L){L=document.createElementNS(svgNS,"g");L.id="hvlayer";L.setAttribute("pointer-events","none");}
  const lay=root.querySelector(":scope > #saylayer");if(lay)root.insertBefore(L,lay);else root.appendChild(L);   /* under the speech bubble, above everything else */
  const ls=[exName(id)].concat(lines(VOICE(txt),30,2)),LH=17,h=12+ls.length*LH;
  L.innerHTML=`<g class="hvtip">${'<rect rx="9" height="'+h+'"/>'}${ls.map((l,i)=>`<text class="${i?"":"hvn"}" y="${18+i*LH}" text-anchor="middle">${l}</text>`).join("")}</g>`;
  const g=L.firstChild;let w=0;g.querySelectorAll("text").forEach(t=>{try{w=Math.max(w,t.getComputedTextLength());}catch(e){}});w=Math.max(90,Math.ceil(w||ls.join("").length*7)+24);
  g.querySelector("rect").setAttribute("width",w);g.querySelectorAll("text").forEach(t=>t.setAttribute("x",w/2));
  const vb=root.viewBox.baseVal,sp=nodeSpot(root,n);let top=sp.y-sp.r-h-8;if(top<vb.y+4)top=Math.min(vb.y+vb.height-h-4,sp.y+sp.r+26);
  const left=Math.max(vb.x+4,Math.min(vb.x+vb.width-4-w,sp.x-w/2));g.setAttribute("transform",`translate(${left.toFixed(1)} ${top.toFixed(1)})`);}
function giggles(root){const st=stageNow();
  root.querySelectorAll(".xnode").forEach(n=>{let before=null;
    const on=()=>{const b=n.querySelector(".xbody");if(!b)return;
      if(st==="kids"){if(b.dataset.mood==="joy")return;before=b.dataset.mood;b.dataset.mood="joy";n.classList.add("hop");}
      else n.classList.add("hv-"+st);
      if(st==="teen"||st==="senior")hoverTip(root,n);
      const now=Date.now();if(now-lastHover>(st==="kids"?900:450)){lastHover=now;if(soundOn)try{SOUND.hover(n.dataset.id);}catch(e){}}};
    const off=()=>{const b=n.querySelector(".xbody");if(st==="kids"){if(b&&b.dataset.mood==="joy")b.dataset.mood=before||"happy";n.classList.remove("hop");}else n.classList.remove("hv-"+st);hoverTip(root,null);};
    n.addEventListener("pointerenter",e=>{if(e.pointerType==="mouse")on();});n.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse")off();});
    if(st==="kids")n.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"){on();setTimeout(off,900);}});});}

    <g id="meters" transform="translate(${W-150} 22)">${["water","sun","air"].filter(has).map((p,i)=>`<g transform="translate(0 ${i*22})"><text x="-6" y="11" text-anchor="end" class="xtag">${{water:"💧",sun:"☀️",air:"💨"}[p]}</text><rect width="120" height="12" rx="6" fill="#ffffffaa" stroke="#3b2a1a"/><rect id="m_${p}" width="0" height="12" rx="6" fill="${{water:"#4FA3E0",sun:"#F2B33D",air:"#8EC9E8"}[p]}"/></g>`).join("")}<g transform="translate(0 ${s.needs.length*22})"><text x="-6" y="11" text-anchor="end" class="xtag">✨</text><rect width="120" height="12" rx="6" fill="#ffffffaa" stroke="#3b2a1a"/><rect id="m_food" width="0" height="12" rx="6" fill="#7BC67E"/></g></g>

      let sunXY=[520,200];const placeSun=([x,y])=>{sunXY=[Math.max(50,Math.min(W-50,x)),Math.max(46,Math.min(GY-30,y))];sun.setAttribute("transform",`translate(${sunXY[0]} ${sunXY[1]})`);};

        can.setAttribute("transform",`translate(${canXY[0]} ${canXY[1]})`);$$("canbody").setAttribute("transform",over?"rotate(28)":"");};

        if(was)cap("💧 سقيت! «"+nm("water")+"» "+(s.info.water||"")+"، شوف النقاط الزرقا كيف بتطلع من "+(nm("root")?"«"+nm("root")+"»":"الجذور")+" لـ"+(nm("stem")?"«"+nm("stem")+"»":"الساق")+" للأوراق.");

      if(win)win.addEventListener("click",()=>{st.air=st.air>0.5?0:1;$$("paneL").setAttribute("transform",st.air?"translate(-34 0) scale(.15 1)":"");$$("paneR").setAttribute("transform",st.air?"translate(34 0) scale(.15 1)":"");sfx(st.air?"wind":"pop");cap(st.air?"💨 «"+nm("air")+"» دخل! "+(s.info.air||""):"سكّرنا الشباك.");});
      root.querySelectorAll(".wpart").forEach(el=>el.addEventListener("click",()=>{const p=el.dataset.part;if(p==="air")return;const key={sun:"sun",water:"water",root:"root",stem:"stem",soil:"soil"}[p];

      const fx=$$("fx");const dot=(x,y,r,fill)=>{const c=document.createElementNS(svgNS,"circle");c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("r",r);c.setAttribute("fill",fill);fx.appendChild(c);return c;};
