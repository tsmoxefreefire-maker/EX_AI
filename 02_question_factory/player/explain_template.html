<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الشرح التفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Noto+Kufi+Arabic:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{--bg:#F4F6F8;--panel:#FFFFFF;--ink:#17222D;--muted:#5C6A77;--line:#D6DEE6;--chip:#EDF1F5;--brand:#1F6F78;--good:#2E8B57;--bad:#C8473D;--warn:#B9770E;--focus:#1F6F78;
  --water:#3A8DDE;--leaf:#2F8F4E;--soil:#7A4D2B;--sun:#F2B33D;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E151B;--panel:#151F28;--ink:#E4ECF2;--muted:#9AAAB8;--line:#283643;--chip:#1C2834;--brand:#4FB3BD;--good:#4CB36E;--bad:#E2685E;--warn:#E3B44F;--focus:#7FD0D8;--water:#62A8EE;--leaf:#4CB36E}}
:root[data-theme="dark"]{--bg:#0E151B;--panel:#151F28;--ink:#E4ECF2;--muted:#9AAAB8;--line:#283643;--chip:#1C2834;--brand:#4FB3BD;--good:#4CB36E;--bad:#E2685E;--warn:#E3B44F;--focus:#7FD0D8;--water:#62A8EE;--leaf:#4CB36E}
/* garden skin: the same games, a look that fits plant lessons */
body.skin-garden{--brand:#2F8F4E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.skin-garden{--brand:#4CB36E}}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",system-ui,sans-serif;line-height:1.7}
h1,h2,h3{font-family:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;margin:0;line-height:1.35}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 48px}
.hero{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:end;justify-content:space-between;margin-bottom:16px}
.hero h1{font-size:clamp(1.5rem,3vw,2.1rem);font-weight:800}
.hero p{margin:4px 0 0;color:var(--muted);max-width:64ch}
.pipe{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.88rem}
.pipe span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.pipe i{font-style:normal;color:var(--muted)}
.layout{display:grid;grid-template-columns:290px 1fr;gap:16px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.layout>*{min-width:0}
.side{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);max-height:calc(100vh - 30px);overflow:auto}
@media (max-width:860px){.side{position:relative;top:0;max-height:260px}}
.side h3{font-size:.95rem;margin:8px 4px 6px;color:var(--muted)}
.tree{font-size:.85rem;font-weight:700;color:var(--muted);padding:6px 10px 2px}
.tree.t{padding-inline-start:18px}.tree.t::before{content:'◇ '}
.les{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:right;border:0;background:transparent;border-radius:10px;padding:7px 10px 7px 10px;padding-inline-start:28px;cursor:pointer}
.les span{overflow-wrap:anywhere}
.les:hover{background:var(--chip)}
.les[aria-current="true"]{background:var(--brand);color:#fff}
.les small{opacity:.8;white-space:nowrap}
.main{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.lhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.lhead h2{font-size:1.35rem}
.status{font-size:.82rem;font-weight:700;border-radius:999px;padding:3px 10px;background:color-mix(in srgb,var(--warn) 18%,var(--panel))}
.cov{font-size:.82rem;font-weight:700;border-radius:999px;padding:3px 10px;background:color-mix(in srgb,var(--good) 16%,var(--panel))}
.cov.miss{background:color-mix(in srgb,var(--bad) 16%,var(--panel))}
.small{color:var(--muted);font-size:.9rem}
.sec{font-size:.95rem;margin:14px 0 8px;color:var(--muted)}
.stations{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.station{border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:6px 12px;cursor:pointer;display:grid;text-align:center;min-width:86px}
.station.on{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.station .st{letter-spacing:2px;color:var(--warn);font-size:.95rem}
.station small{color:var(--muted);font-size:.75rem}
.link{width:16px;height:3px;background:var(--line);border-radius:2px}
.qtabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.qtab{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.9rem}
.qtab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qtab.done::after{content:" ✓";color:var(--good);font-weight:800}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.diff{font-size:.8rem;font-weight:700;border-radius:999px;padding:2px 10px;color:#fff}
.diff.easy{background:var(--good)}.diff.mid{background:var(--warn)}.diff.hard{background:var(--bad)}
.qtext{font-family:"Noto Kufi Arabic",sans-serif;font-size:1.12rem;font-weight:800;margin:8px 0 2px}
.how{color:var(--muted);margin:0 0 12px}
.feedback{min-height:1.6em;margin-top:10px;font-weight:700}
.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}
.tests{margin-top:6px;font-size:.86rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.btn{border:0;border-radius:12px;padding:9px 16px;cursor:pointer;font-weight:700;background:var(--brand);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:46px}
.chip{border:1.5px solid var(--line);background:var(--chip);border-radius:12px;padding:8px 13px;cursor:pointer;font-weight:700;direction:auto}
.chip.used{opacity:.3;pointer-events:none}
.chip.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--panel))}
.chip.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel))}
.solution{margin-top:14px;border-radius:14px;padding:12px 14px;background:color-mix(in srgb,var(--good) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--good) 30%,var(--line))}
.solution h3{font-size:1rem;margin-bottom:6px}
.solution ol{margin:0;padding-inline-start:1.3em}
.solution li{direction:auto}
.stars{letter-spacing:2px;color:var(--warn)}
.code{direction:ltr;text-align:left;background:var(--chip);border-radius:12px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;line-height:1.5;overflow:auto;max-height:280px;white-space:pre}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:5px 12px;cursor:pointer;font-weight:600}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ===== shared fun ===== */
#q{position:relative;overflow:hidden}
.conf{position:absolute;top:-10px;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:fall 1.3s ease-in forwards;z-index:5}
@keyframes fall{to{transform:translateY(560px) rotate(540deg);opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes dance{25%{transform:rotate(-12deg) translateY(-6px)}75%{transform:rotate(12deg) translateY(-6px)}}
@keyframes wiggle{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.drag{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.drag-ghost{position:fixed;z-index:80;pointer-events:none;transform:translate(-50%,-60%) scale(1.06);opacity:.96;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.over{outline:3px dashed var(--warn)!important;outline-offset:3px}
/* mascot «بذور» */
.mascot{position:absolute;inset-inline-end:14px;top:10px;flex-direction:row-reverse;display:flex;align-items:center;gap:6px;z-index:6;pointer-events:none}
.mascot .m-body{font-size:2rem;display:inline-block;transform-origin:50% 90%}
.mascot .m-say{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:3px 10px;font-size:.85rem;font-weight:700;opacity:0;transform:scale(.6);transition:all .25s;white-space:nowrap}
.mascot.talk .m-say{opacity:1;transform:scale(1)}
.mascot.happy .m-body{animation:dance .5s 3}
.mascot.oops .m-body{animation:wiggle .3s 3}
.mascot.dive .m-body{animation:dive 1.2s}
@keyframes dive{40%{transform:translateY(30px) rotate(160deg)}100%{transform:translateY(0) rotate(360deg)}}
@media (max-width:520px){.mascot .m-say{white-space:normal;max-width:150px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.conf{display:none}}
</style>
<!--CSS_GAMES-->
<style>
/* ---------- 1. مين الصادق؟ (meaning) ---------- */
.namecard{display:block;width:max-content;margin:44px auto 12px;font-family:"Noto Kufi Arabic",sans-serif;font-weight:800;font-size:1.2rem;border-radius:14px;padding:8px 18px;background:var(--brand);color:#fff}
.faces{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fcard{position:relative;border:2px solid var(--line);border-radius:18px;padding:10px 10px 12px;background:color-mix(in srgb,var(--chip) 70%,var(--panel));cursor:pointer;display:grid;justify-items:center;gap:6px;text-align:center;transition:opacity .4s,transform .6s}
.fcard .ftxt{font-size:.92rem;direction:auto}
.face{position:relative;width:64px;height:64px;border-radius:50%;animation:bob 2.6s ease-in-out infinite}
.fcard:nth-child(2) .face{animation-delay:-.6s}.fcard:nth-child(3) .face{animation-delay:-1.2s}.fcard:nth-child(4) .face{animation-delay:-1.8s}
.eye{position:absolute;top:20px;width:15px;height:15px;border-radius:50%;background:#fff;overflow:hidden;animation:blink 4s infinite}
.eye.l{left:13px}.eye.r{right:13px}
.pupil{position:absolute;left:4px;top:4px;width:7px;height:7px;border-radius:50%;background:#1b1b1b;transition:transform .08s}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
.mouth{position:absolute;left:50%;bottom:12px;width:22px;height:9px;margin-left:-11px;border-radius:0 0 12px 12px;background:#3b1d1d}
.talking .mouth{animation:talk .25s infinite alternate}
@keyframes talk{to{height:3px;border-radius:6px}}
.nose{position:absolute;left:50%;top:30px;width:11px;height:10px;margin-left:-5px;border-radius:5px 9px 9px 5px;background:inherit;border:2px solid rgba(0,0,0,.18);box-shadow:inset -3px -2px 0 rgba(0,0,0,.08);filter:brightness(.96);z-index:1;transform-origin:0 50%;transition:width 1.2s cubic-bezier(.3,1.6,.5,1)}
.fcard.liar .nose{width:46px}
.bubble-say{position:absolute;top:-14px;inset-inline-end:-6px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:2px 9px;font-size:.78rem;font-weight:800;white-space:nowrap;animation:pop .3s}
.fcard.truth{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--panel))}
.fcard.truth .face{animation:dance .5s 4}
.fcard.away{opacity:.25;transform:translateY(16px) scale(.94)}
.fcard.laugh .face{animation:wiggle .2s 6}
@media (max-width:520px){.faces{grid-template-columns:1fr 1fr;gap:10px}.face{width:54px;height:54px}.eye{top:16px}.mouth{bottom:9px}}

/* ---------- 2. وصّل (match) = بذرة ← ساق ← برعم ---------- */
.mwrap{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:12px 40px;margin-top:6px}
.mwrap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mcol{display:grid;gap:10px;align-content:start}
.mterm,.mdef{border:2px solid var(--line);background:var(--chip);border-radius:14px;padding:10px 12px;text-align:start;direction:auto;display:flex;gap:8px;align-items:center}
.mterm{font-weight:800}
.mterm .ic,.mdef .ic{font-size:1.4rem;flex:none;display:inline-block}
.mterm[aria-pressed="true"]{border-color:var(--warn)}
.mterm.ok,.mdef.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--panel))}
.mdef.bloom .ic{animation:pop .6s}
.leaf-fall{position:absolute;font-size:1.3rem;pointer-events:none;animation:leaffall 1.4s ease-in forwards;z-index:4}
@keyframes leaffall{to{transform:translate(-30px,120px) rotate(220deg);opacity:0}}
.flow{stroke-dasharray:4 10;animation:flow .6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.droop{transition:all .7s ease-in;opacity:0}

/* ---------- 3. بطاقات الذاكرة ---------- */
.mem{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;perspective:800px}
@media (max-width:520px){.mem{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mc{position:relative;min-height:96px;border:0;background:none;padding:0;cursor:pointer;transform-style:preserve-3d;transition:transform .45s}
.mc.open{transform:rotateY(180deg)}
.mc .side-a,.mc .side-b{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;padding:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--line)}
.mc .side-a{background:color-mix(in srgb,var(--brand) 20%,var(--panel));font-size:2rem}
.mc .side-b{background:var(--chip);transform:rotateY(180deg);font-size:.88rem;font-weight:700;direction:auto}
.mc.done .side-b{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--panel))}
.mc.oops{animation:wiggle .25s 3}

/* ---------- 4. ركّب الاسم ---------- */
.clue{border-radius:14px;padding:10px 14px;background:color-mix(in srgb,var(--warn) 12%,var(--panel));font-weight:700;margin-bottom:12px;direction:auto}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.lslot{width:46px;height:52px;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;font-size:1.5rem;font-weight:800;background:var(--bg)}
.lslot.filled{border-style:solid;border-color:var(--brand)}
.lslot.gap{border:0;background:none;width:18px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{width:46px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--chip);font-size:1.5rem;font-weight:800;cursor:pointer;display:grid;place-items:center;position:relative}
.skin-garden .tile{border-radius:50% 4px 50% 4px;background:color-mix(in srgb,var(--leaf) 22%,var(--panel))}
.tile.spin{animation:spinback .6s}
@keyframes spinback{50%{transform:rotate(200deg) scale(.8)}}
.word-done{font-family:"Noto Kufi Arabic",sans-serif;font-size:2rem;font-weight:800;text-align:center;color:var(--good);animation:pop .6s}

/* ---------- 5. صح ولا غلط (سحب البطاقة) ---------- */
.tfzone{position:relative;display:grid;place-items:center;min-height:210px;margin:6px 0 10px;padding:0 64px}
#deck{display:grid;width:100%;justify-items:center}
.tfside{position:absolute;top:50%;transform:translateY(-50%);font-weight:800;font-size:1.05rem;opacity:.75;pointer-events:none}
.tfside.yes{right:0;color:var(--good)}.tfside.no{left:0;color:var(--bad)}
.tfcard{grid-area:1/1;position:relative;width:min(320px,100%);min-height:170px;border-radius:18px;border:2px solid var(--line);background:var(--panel);box-shadow:0 8px 20px rgba(0,0,0,.08);display:grid;place-items:center;padding:26px 16px 16px;text-align:center;font-weight:700;direction:auto;touch-action:none;cursor:grab;transition:transform .35s,opacity .35s}
.tfcard.under{transform:translateY(8px) scale(.96);opacity:.6}
.tfcard .tfn{position:absolute;top:8px;inset-inline-start:12px;font-size:.8rem;color:var(--muted)}
@media (max-width:520px){.tfzone{padding:0 46px}.tfside{font-size:.85rem}}
.tfbtns{display:flex;justify-content:center;gap:12px}

/* ---------- 6. الجسر ---------- */
.stage{display:block;width:100%;height:auto;margin:8px 0}
.stage.small{max-width:380px;margin:8px auto}
.chip.star{border-color:var(--warn)}
#br{max-width:640px;margin:8px auto}
#br .plank{cursor:pointer}
.bridge-shake{animation:bshake .5s}
@keyframes bshake{20%{transform:translate(-4px,1px)}40%{transform:translate(4px,-1px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}

/* ---------- 7. صلّح السلسلة (القطار) ---------- */
.train{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;justify-content:center;padding:10px 0 4px;transition:transform 1.6s ease-in}
.wagon{position:relative;border:2px solid var(--line);background:var(--chip);border-radius:12px 12px 6px 6px;padding:10px 12px 18px;min-width:86px;text-align:center;font-weight:800;cursor:pointer;direction:auto}
.wagon::before,.wagon::after{content:"";position:absolute;bottom:-9px;width:16px;height:16px;border-radius:50%;background:#333;border:3px solid #888}
.wagon::before{left:12px}.wagon::after{right:12px}
.wagon.engine{background:color-mix(in srgb,var(--brand) 25%,var(--panel));cursor:default}
.wagon.gap{border-style:dashed;background:transparent;color:var(--muted)}
.wagon.picked{border-color:var(--bad)}
.wagon.honk{animation:shake .4s}
.wagon .say{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:1px 8px;font-size:.78rem;white-space:nowrap;animation:pop .3s}
.train.go{transform:translateX(-120%)}

/* ---------- 8. الباب بوجه ---------- */
.doorbox{position:relative;width:min(300px,90%);margin:6px auto 10px;height:230px;perspective:900px}
.behind{position:absolute;inset:14px 34px 0;border-radius:10px;background:color-mix(in srgb,var(--sun) 30%,var(--panel));display:grid;place-items:center;align-content:center;gap:6px;text-align:center;padding:8px}
.behind .who{font-family:"Noto Kufi Arabic",sans-serif;font-weight:800;font-size:1.15rem;border-radius:12px;padding:4px 12px;background:var(--brand);color:#fff;opacity:0;transform:scale(.5);transition:all .5s .4s}
.behind .friends{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.behind .friends span{border-radius:10px;padding:2px 8px;background:var(--panel);font-weight:700;font-size:.85rem;animation:pop .5s}
.behind .line{font-weight:700;font-size:.9rem;opacity:0;transition:opacity .4s .9s}
.door{position:absolute;inset:14px 34px 0;border-radius:10px;background:#8B5A2B;border:6px solid #5E3A1F;transform-origin:left center;transition:transform 1.1s ease-in-out;display:grid;justify-items:center;align-content:start;padding-top:18px;gap:4px}
.skin-garden .door{background:repeating-linear-gradient(90deg,#7A4D2B 0 12px,#6d4426 12px 14px);border-color:#4f2f17}
.door .dface{position:relative;width:96px;height:56px}
.door .eye{top:4px;width:20px;height:20px}.door .eye.l{left:16px}.door .eye.r{right:16px}
.door .pupil{left:6px;top:6px;width:9px;height:9px}
.door .mouth{bottom:2px;width:30px;margin-left:-15px;height:11px}
.door .dname{color:#fff;font-weight:800;font-size:1rem;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.door .locks{display:flex;gap:6px;font-size:1.6rem}
.door .lk.drop{animation:lockdrop .8s forwards}
@keyframes lockdrop{to{transform:translateY(120px) rotate(70deg);opacity:0}}
.door.giggle{animation:wiggle .18s 6}
.doorbox.open .door{transform:rotateY(-105deg)}
.doorbox.open .who,.doorbox.open .line{opacity:1;transform:none}
.keys .chip::before{content:"🔑 "}
.chip.bent{transform:skewX(-18deg) rotate(-8deg)}

/* ---------- 9. ضوّي الطرق ---------- */
.dest{cursor:pointer}
.dest text{font-weight:800}
.dest.lit circle{fill:color-mix(in srgb,var(--good) 30%,var(--panel));stroke:var(--good)}
.dest.nope{opacity:.35}

/* ---------- 10. المصعد ---------- */
.lift{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:10px;align-items:stretch;max-width:520px;margin:6px auto}
.floors{display:grid;gap:6px}

.na-msg.na-them{align-self:flex-end;background:var(--chip)}

<body class="kid">

<script>
(function(){
"use strict";
const DATA = /*DATA*/null;
const $=s=>document.querySelector(s);
const svgNS="http://www.w3.org/2000/svg";
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const DIFF={easy:"سهل",mid:"متوسط",hard:"صعب"};
const TNAME={meaning:"🤥 مين الصادق؟",match:"🔗 وصّل",memory:"🃏 الذاكرة",spell:"🔤 ركّب الاسم",true_false:"👉👈 صح ولا غلط",
  sequence:"🌉 ابنِ الجسر",fix_chain:"🚂 صلّح القطار",prereq:"🚪 افتح الباب",unlocks:"🗺️ ضوّي الطرق",sort:"🛗 المصعد",
  odd_one_out:"🧩 الدخيل",who_am_i:"🕵️ مين أنا؟",predict:"🔮 شو بيصير لو؟",adjust:"🎚️ اضبط"};
function shuffle(a,seed){a=a.slice();let s=seed||1;for(let i=a.length-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const pickOne=(arr)=>arr[Math.floor(Math.random()*arr.length)];
let G=0,L=0,C=0,Qi=0; const done=new Set(); const evidence=[]; let tab="file"; let t0=performance.now();
const graph=()=>DATA.graphs[G]; const lesson=()=>graph().lessons[L]; const concept=()=>lesson().concepts[C];
const name=id=>graph().names[id]||id; const key=(c,i)=>G+":"+L+":"+c+":"+i;
const theme=()=>lesson().theme||"default"; const garden=()=>theme()==="garden";
let timers=[]; const later=(fn,ms)=>{const t=setTimeout(fn,reduce?Math.min(ms,30):ms);timers.push(t);return t;};
function clearTimers(){timers.forEach(clearTimeout);timers=[];}
let cleanups=[]; const onCleanup=f=>cleanups.push(f); function runCleanups(){cleanups.forEach(f=>{try{f();}catch(e){}});cleanups=[];}

function record(cid,outcome){const q=concept().questions[Qi];evidence.push({concept_id:cid,lesson_id:lesson().lesson_id,activity:q.template,correctness:outcome,question_difficulty:q.difficulty,response_time_ms:Math.round(performance.now()-t0),modality:"interaction",interaction_yields_evidence:true,timestamp:new Date().toISOString()});t0=performance.now();if(tab==="ev")renderBelow();}

/* ---------- header + side ---------- */
const total=DATA.graphs.reduce((a,g)=>a+g.lessons.reduce((b,l)=>b+l.question_count,0),0);
const nl=DATA.graphs.reduce((a,g)=>a+g.lessons.length,0);
const nc=DATA.graphs.reduce((a,g)=>a+g.lessons.reduce((b,l)=>b+l.concepts.length,0),0);
$("#sub").textContent=`المصنع قرأ الكتاب بالستركشر الجديد، مرّ على ${nl} دروس، ولكل مفهوم (${nc} مفهوم) ولّد تحدياته: ${total} تحدي تفاعلي من 13 نوع، فحصهم وحفظهم مع الدرس.`;
let kid=true; const unlocked=new Set(); let openAll=false;   /* 🔓 demo switch: opens every lesson, station and challenge */
function lessonDone(gi,li){const l=DATA.graphs[gi].lessons[li];return l.concepts.every((c,ci)=>c.questions.every((_,qi)=>done.has(gi+":"+li+":"+ci+":"+qi)));}
function lessonLocked(gi,li){if(!kid||openAll)return false;const g=DATA.graphs[gi],l=g.lessons[li];if(unlocked.has(gi+":"+li))return false;
  return (l.requires||[]).some(rid=>{const ri=g.lessons.findIndex(x=>x.lesson_id===rid);return ri>=0&&!lessonDone(gi,ri);});}
const PLACE=["🏡","🌳","🌻","🪴","⛲","🏞️"];
function renderSide(){
  if(kid){$("#side").innerHTML=DATA.graphs.map((g,gi)=>`<h3>🗺️ ${g.title}</h3><div class="kmap">`+g.lessons.map((l,li)=>{const lock=lessonLocked(gi,li),dn=lessonDone(gi,li);
      const need=(l.requires||[]).map(rid=>(g.lessons.find(x=>x.lesson_id===rid)||{}).lesson_title).filter(Boolean);
      return `<div><button class="kplace${lock?" locked":""}${dn?" done":""}" data-g="${gi}" data-l="${li}" ${gi===G&&li===L?'aria-current="true"':""}><span class="ke">${alive(placeOf(gi,li))}</span><span><b dir="auto">${l.lesson_title}</b><small>${lock?"🔒 بينفتح بعد «"+need.join("» و«")+"»":l.concepts.length+" محطات"}</small></span><span class="klock">${lock?"🔒":""}</span></button>${lock?`<button class="unlockbtn" data-u="${gi}:${li}">🔓 افتحه هلأ</button>`:""}</div>`;}).join("")+`</div>`).join("");
    $("#side").querySelectorAll(".kplace").forEach(b=>b.addEventListener("click",()=>{const gi=+b.dataset.g,li=+b.dataset.l;if(lessonLocked(gi,li)){b.classList.add("shake");later(()=>b.classList.remove("shake"),450);return;}G=gi;L=li;C=0;Qi=0;renderAll();}));
    $("#side").querySelectorAll(".unlockbtn").forEach(b=>b.addEventListener("click",()=>{unlocked.add(b.dataset.u);const [gi,li]=b.dataset.u.split(":").map(Number);G=gi;L=li;C=0;Qi=0;renderAll();}));
    return;}
  $("#side").innerHTML=DATA.graphs.map((g,gi)=>{let last=null,unitShown=false;return `<h3>📘 ${g.title}</h3>`+g.lessons.map((l,li)=>{let head="";
    if(!unitShown&&l.unit_id){head+=`<div class="tree u">${g.names[l.unit_id]||l.unit_id}</div>`;unitShown=true;}
    if(l.topic_id&&l.topic_id!==last){head+=`<div class="tree t">${g.names[l.topic_id]||l.topic_id}</div>`;last=l.topic_id;}
    return head+`<button class="les" data-g="${gi}" data-l="${li}" ${gi===G&&li===L?'aria-current="true"':""}><span dir="auto">${l.lesson_title}</span><small>${l.concepts.length} مفاهيم</small></button>`;}).join("");}).join("");
  $("#side").querySelectorAll(".les").forEach(b=>b.addEventListener("click",()=>{G=+b.dataset.g;L=+b.dataset.l;C=0;Qi=0;renderAll();}));}

/* ---------- stars (note 3: no discouraging "0 of 1") ---------- */
const scores={};
const starStr=r=>{const n=r>=0.99?3:r>=0.5?2:1;return "★".repeat(n)+"☆".repeat(3-n);};
const starWord=r=>r>=0.99?"من أول مرة! 🤩":r>=0.5?"قرّبت كثير! 💪":"وصلت بالآخر، برافو! 💪";
function conceptDone(ci){return lesson().concepts[ci].questions.every((_,i)=>done.has(key(ci,i)));}
/* student mode: one step at a time — a station opens when the one before it is finished, a challenge when the one before it is done */
const stationOpen=ci=>!kid||openAll||ci===0||conceptDone(ci-1)||conceptDone(ci);
const challengeOpen=(ci,i)=>!kid||openAll||i===0||done.has(key(ci,i-1))||done.has(key(ci,i));
function nudge(el,msg){el.classList.add("shake");setTimeout(()=>el.classList.remove("shake"),450);fb(msg,"bad");}
function stars(ci){const qs=lesson().concepts[ci].questions;if(!conceptDone(ci))return "☆☆☆";return starStr(qs.reduce((a,_,i)=>a+(scores[key(ci,i)]||0),0)/qs.length);}
function firstOpenChallenge(ci){const qs=lesson().concepts[ci].questions;const i=qs.findIndex((_,k)=>!done.has(key(ci,k)));return i<0?0:i;}
function renderWelcome(){const l=lesson();$("#welcome").innerHTML=`<span class="big">${alive(skin().mascot)}</span><div><h1>أهلاً! 👋 أنا «${skin().name}»</h1><p>اليوم رح نكتشف <b>${l.lesson_title}</b> مع بعض. كل محطة فيها تحديات، واجمع النجوم ⭐!</p></div>`;}
function renderLesson(){const l=lesson(),c=concept();document.body.classList.toggle("skin-garden",garden());const icons=l.icons||{};
  if(kid){const total=l.concepts.length,fin=l.concepts.filter((_,i)=>conceptDone(i)).length;const plant=skin().grow[Math.min(4,Math.round(fin/Math.max(1,total)*4))];
    const stickers=l.concepts.map((k,i)=>conceptDone(i)?`<span class="stk">🏅 ${alive(icons[k.concept_id]||"")} ${k.title}</span>`:"").join("");
    $("#lesson").innerHTML=`<div class="lhead"><h2 dir="auto">${garden()?"🌿":"📘"} ${l.lesson_title}</h2></div>
      <h3 class="sec">طريق الدرس: كل حجر محطة 🪨</h3>
      <div class="kpath">${l.concepts.map((k,i)=>`${i?'<span class="kdots"></span>':""}<button class="kstone${i===C?" on":""}${stationOpen(i)?"":" locked"}" data-c="${i}">${stationOpen(i)?"":'<span class="klk">🔒</span>'}<span class="si">${alive(icons[k.concept_id]||"🔹")}</span>${k.title}${i===C?'<span class="walkerk">🚶</span>':""}${conceptDone(i)?`<span class="bloom">${skin().done}</span>`:""}<span class="st">${stars(i)}</span></button>`).join("")}</div>
      <div class="kbar"><span class="potplant"><span class="pp">${alive(plant)}</span> ${skin().growLabel}: ${fin} من ${total}</span><span class="album">${stickers||'<small class="small">الملصقات 🏅 بتطلع لما تخلص محطة</small>'}</span></div>
      <h3 class="sec">تحديات «${alive(icons[c.concept_id]||"")} ${c.title}»</h3>
      <div class="kcards" role="tablist">${c.questions.map((q,i)=>`<button class="kcard${done.has(key(C,i))?" done":""}${challengeOpen(C,i)?"":" locked"}" role="tab" aria-selected="${i===Qi}" data-i="${i}">${challengeOpen(C,i)?"":'<span class="klk">🔒</span>'}<span class="kci">${alive((TNAME[q.template]||"").split(" ")[0])}</span>${(TNAME[q.template]||q.template).split(" ").slice(1).join(" ")}</button>`).join("")}</div>`;
    $("#lesson").querySelectorAll(".kstone").forEach(b=>b.addEventListener("click",()=>{const ci=+b.dataset.c;if(!stationOpen(ci))return nudge(b,"🔒 خلّص المحطة اللي قبلها أول");C=ci;Qi=firstOpenChallenge(ci);renderAll();}));
    $("#lesson").querySelectorAll(".kcard").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.i;if(!challengeOpen(C,i))return nudge(b,"🔒 خلّص التحدي اللي قبله أول");Qi=i;renderAll();}));return;}
  $("#lesson").innerHTML=`<div class="lhead"><h2 dir="auto">${l.lesson_title}</h2><span><span class="cov${l.coverage.missing.length?" miss":""}">جاهز: ${l.coverage.ready} من ${l.coverage.concepts} مفاهيم</span> <span class="status">بانتظار مراجعة المعلم</span></span></div>
   <div class="small">${l.unit_id?name(l.unit_id)+" ← "+name(l.topic_id)+" ← ":""}<b>${l.lesson_title}</b>${l.lesson_minutes?" · ⏱️ "+l.lesson_minutes+" دقيقة":""} · ${garden()?"🌿 جو الجنينة":"جو عام"}</div>
   <h3 class="sec">رحلة الدرس: كل محطة مفهوم، واجمع النجوم ⭐</h3>
   <div class="stations">${l.concepts.map((k,i)=>`${i?'<span class="link"></span>':""}<button class="station${i===C?" on":""}" data-c="${i}"><b dir="auto">${k.title}</b><span class="st">${stars(i)}</span><small>${k.questions.length} تحديات</small></button>`).join("")}</div>
   <h3 class="sec">تحديات «${c.title}»</h3>
   <div class="qtabs" role="tablist">${c.questions.map((q,i)=>`<button class="qtab${done.has(key(C,i))?" done":""}" role="tab" aria-selected="${i===Qi}" data-i="${i}">${i+1}. ${TNAME[q.template]||q.template}</button>`).join("")}</div>`;
  $("#lesson").querySelectorAll(".station").forEach(b=>b.addEventListener("click",()=>{C=+b.dataset.c;Qi=0;renderAll();}));
  $("#lesson").querySelectorAll(".qtab").forEach(b=>b.addEventListener("click",()=>{Qi=+b.dataset.i;renderAll();}));}

/* ---------- question frame ---------- */
function frame(q,body){return `<div class="mascot" id="mascot" aria-hidden="true"><span class="m-body" data-mood="happy">${artSVG(skin().mascot,"mascotart")}</span><span class="m-say" id="msay"></span></div>
  <div class="qhead"><span class="diff ${q.difficulty}">${DIFF[q.difficulty]}</span></div><p class="qtext" dir="auto">${q.question}</p><p class="how">${q.how}</p>${body}
  <div class="feedback" id="fb"></div><div class="tests">🎯 بيفحص: ${(q.concepts||[]).map(name).join("، ")}</div>`;}
let soundOn=true,actx=null;
/* little sound effects, made in the browser (no files): water, train, door, cat, lift… */
function ac(){actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();return actx;}
function tone(f1,f2,dur,type,vol,delay){const a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(delay||0);o.type=type||"sine";o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.12,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02);}
function noise(dur,f1,f2,vol,delay,q){const a=ac(),n=a.sampleRate*dur,buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const src=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime+(delay||0);src.buffer=buf;fl.type="bandpass";fl.Q.value=q||1.2;fl.frequency.setValueAtTime(f1,t);fl.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);src.connect(fl);fl.connect(g);g.connect(a.destination);src.start(t);src.stop(t+dur);}
const SFX={
  good:()=>{tone(660,990,.18);},bad:()=>{tone(300,140,.25,"triangle");},
  ding:()=>{tone(1320,1300,.5,"sine",.14);tone(1760,1750,.4,"sine",.06,.05);},
  pop:()=>{tone(500,1500,.08,"sine",.12);},click:()=>{noise(.04,3000,2000,.25);},
  splash:()=>{noise(.5,1800,300,.35);noise(.3,900,200,.2,.08);},
  bubbles:()=>{for(let i=0;i<6;i++)tone(500+Math.random()*500,1200+Math.random()*600,.07,"sine",.06,i*.12);},
  whistle:()=>{[0,.32].forEach(d=>{tone(880,870,.28,"sine",.09,d);tone(1108,1100,.28,"sine",.07,d);tone(1318,1310,.28,"sine",.05,d);});for(let i=0;i<6;i++)noise(.07,700,300,.14,.7+i*.14,2);},
  chug:()=>{for(let i=0;i<4;i++)noise(.09,700,300,.18,i*.18,2);},
  honk:()=>{tone(392,392,.25,"sawtooth",.05);tone(330,330,.3,"sawtooth",.05,.22);},
  creak:()=>{tone(180,90,.9,"sawtooth",.04);},
  meow:()=>{tone(500,900,.18,"triangle",.1);tone(900,420,.35,"triangle",.1,.17);},
  hiss:()=>{noise(.5,4000,6000,.12,0,.6);},
  whoosh:()=>{noise(.35,400,2500,.18,0,.8);},
  hoot:()=>{tone(420,400,.25,"sine",.12);tone(420,380,.35,"sine",.12,.32);},
  laugh:()=>{for(let i=0;i<4;i++)tone(520-i*20,460-i*20,.09,"square",.04,i*.11);},
  crumble:()=>{noise(.5,600,120,.3,0,.7);},
  step:()=>{noise(.05,900,500,.15);noise(.05,900,500,.15,.22);},
  water:()=>{for(let i=0;i<5;i++)tone(700+i*90,900+i*90,.06,"sine",.05,i*.07);},
  bloom:()=>{tone(784,1568,.25,"sine",.08);},
  thud:()=>{tone(120,60,.15,"sine",.18);noise(.08,400,200,.15);},
  flip:()=>{noise(.08,2500,1200,.15);},
  buzz:()=>{tone(220,240,.4,"sawtooth",.03);},

const iconOf=id=>(lesson().icons||{})[id];
const V=()=>{const q=document.getElementById("q");return !!q&&q.clientWidth<600;};   /* narrow screen → scenes go top-to-bottom */
function pathOf(){const l=lesson();const p=[{c:-1,s:l.overview}];if(l.world)p.push({c:-1,s:l.world});if(l.assemble)p.push({c:-1,s:l.assemble});l.concepts.forEach((c,ci)=>c.scenes.forEach(s=>p.push({c:ci,s})));return p;}
function node(id,x,y,size,mood,extra){const ic=iconOf(id);let art=ic?artSVG(ic,""):null;
  if(!art)art=`<svg class="ch" viewBox="0 0 100 100">${ARTS.blob(colorOf(id))}</svg>`;
  art=art.replace("<svg ",`<svg width="${size}" height="${size}" x="${-size/2}" y="${-size/2}" `);
  return `<g class="xnode ${extra||""}" data-id="${id}" transform="translate(${x} ${y})" tabindex="0" role="button" aria-label="${exName(id)}">
    <g class="xbody" data-mood="${mood||"happy"}">${art}</g><text class="xname" y="${size/2+18}" text-anchor="middle">${exName(id)}</text><g class="xsay"></g></g>`;}
/* split what a character says into short lines (≈22 letters); never cut a word; very long → «…» at a word boundary */
function lines(t,n,max){n=n||22;max=max||4;const w=String(t).split(/\s+/).filter(Boolean);const out=[""];let cut=false;
  for(const x of w){const cur=out[out.length-1];if(!cur||(cur+" "+x).length<=n)out[out.length-1]=(cur+" "+x).trim();else if(out.length<max)out.push(x);else{cut=true;break;}}
  if(cut)out[out.length-1]=out[out.length-1].replace(/\s+\S+$/,"")+" …";return out;}
/* 💬 the speech bubble lives in ITS OWN top layer (#saylayer, always the last thing in the picture):
   · above the video spotlight → never dimmed, never half-dark;
   · above the other characters → never hidden behind one;
   · it always stays INSIDE the current frame (also when the camera is zoomed in), with a tail pointing to who speaks;
   · it keeps the same size on the screen while the camera moves. */
function sayLayer(svg){let g=svg.querySelector(":scope > #saylayer");if(!g){g=document.createElementNS(svgNS,"g");g.id="saylayer";g.setAttribute("pointer-events","none");}
  if(svg.lastElementChild!==g)svg.appendChild(g);return g;}
function nodeSpot(svg,nd){   /* the speaker's centre and radius in picture units (works inside moved groups, too) */
  const sz=parseFloat((nd.querySelector("svg")||{getAttribute:()=>70}).getAttribute("width"))||70;
  const m=(nd.getAttribute("transform")||"").match(/translate\(([-\d.]+)[ ,]+([-\d.]+)/)||[0,0,0];
  let x=+m[1],y=+m[2];const P=nd.parentNode&&nd.parentNode.getScreenCTM?nd.parentNode.getScreenCTM():null,S=svg.getScreenCTM();
  if(P&&S){const pt=svg.createSVGPoint();pt.x=x;pt.y=y;const q=pt.matrixTransform(S.inverse().multiply(P));x=q.x;y=q.y;}
  return {x,y,r:sz/2};}
function placeBubble(svg){const g=svg.querySelector(":scope > #saylayer .bub");if(!g||!svg.__lastSay)return;
  const nd=svg.querySelector(`.xnode[data-id="${svg.__lastSay[0]}"]`);if(!nd){g.remove();return;}
  const vb=svg.viewBox.baseVal,F=FULL||[vb.x,vb.y,vb.width,vb.height],shown=svg.getBoundingClientRect().width||F[2];
  const k0=Math.min(2.2,Math.max(1,13/(13.5*shown/F[2]))),k=k0*Math.min(1,vb.width/F[2]);   /* small screen → bigger bubble (text ≥13px); zoomed in → smaller (looks the same) */
  const w=+g.dataset.w,h=+g.dataset.h,M=8*k,T=9;
  const n=nodeSpot(svg,nd),bw=w*k,bh=(h+T)*k;
  let top=n.y-n.r-2*k-bh,down=false;                                               /* first choice: above the speaker */
  if(top<vb.y+M){const below=n.y+n.r+24;if(below+bh<=vb.y+vb.height-M){top=below;down=true;}else top=vb.y+M;}   /* no room → below the name */
  const left=Math.max(vb.x+M,Math.min(vb.x+vb.width-M-bw,n.x-bw/2));
  const tx=Math.max(16,Math.min(w-16,(n.x-left)/k));                              /* the tail points at the speaker */
  const tail=down?`M${tx-8} ${T+2} L${tx} 0 L${tx+8} ${T+2}`:`M${tx-8} ${h-2} L${tx} ${h+T} L${tx+8} ${h-2}`;
  g.querySelector(".btail").setAttribute("d",tail);g.querySelector(".bin").setAttribute("transform",`translate(0 ${down?T:0})`);
  g.setAttribute("transform",`translate(${left.toFixed(1)} ${top.toFixed(1)}) scale(${k.toFixed(3)})`);}
function say(svg,id,text){text=VOICE(text);const layer=sayLayer(svg);layer.innerHTML="";svg.querySelectorAll(".xsay").forEach(x=>x.innerHTML="");   /* 👥 said the way this age talks */
  if(!text||!id){svg.__lastSay=null;return;}const nd=svg.querySelector(`.xnode[data-id="${id}"]`);if(!nd)return;svg.__lastSay=[id,text];
  const ls=lines(text),LH=19,h=14+ls.length*LH;
  layer.innerHTML=`<g class="bub" data-for="${id}"><g class="bin"><rect x="0" y="0" height="${h}" rx="13"/>${ls.map((l,i)=>`<text y="${22+i*LH}" text-anchor="middle">${l}</text>`).join("")}</g><path class="btail"/></g>`;
  const g=layer.querySelector(".bub");let tw=0;g.querySelectorAll("text").forEach(t=>{try{tw=Math.max(tw,t.getComputedTextLength());}catch(e){}});
  if(!tw)tw=Math.max(...ls.map(l=>l.length))*8.6;                                    /* (not drawn yet: measure generously) */
  const w=Math.max(70,Math.ceil(tw)+30);g.querySelector("rect").setAttribute("width",w);g.querySelectorAll("text").forEach(t=>t.setAttribute("x",w/2));
  g.dataset.w=w;g.dataset.h=h;placeBubble(svg);}
function mood(svg,id,m){const b=svg.querySelector(`.xnode[data-id="${id}"] .xbody`);if(b)b.dataset.mood=m;}
function focus(svg,ids){const keep=new Set(ids||[]);svg.querySelectorAll(".xnode").forEach(n=>n.classList.toggle("dim",!!ids&&!keep.has(n.dataset.id)));}
const curve=(a,b,bend)=>{const L=Math.hypot(b[0]-a[0],b[1]-a[1]),mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2-(bend||0)*Math.min(1,L/220);return `M${a[0]} ${a[1]} Q${mx} ${my} ${b[0]} ${b[1]}`;};   /* batch 29: a short arrow is (almost) straight, never «bent» */
/* a «needs» arrow: it reads like the sentence «الساق بيحتاج الجذر» — from the one who needs to what it needs; nothing flows on it */
function flow(d,cls,dots,label){const m=d.match(/M([-\d.]+) ([-\d.]+) Q([-\d.]+) ([-\d.]+) ([-\d.]+) ([-\d.]+)/);let t="";
  if(m&&label!==false){const x=(+m[1]+2*+m[3]+ +m[5])/4,y=(+m[2]+2*+m[4]+ +m[6])/4;const nw=ARROW_WORD(),hw=Math.max(24,nw.length*3.6+10);
    if(Math.hypot(m[5]-m[1],m[6]-m[2])<2*hw+24)return `<path class="xarrow ${cls||""}" d="${d}" marker-end="url(#xhead)"/>`;   /* batch 29: no room → no word ON the arrow (the legend says what it means) */
    t=`<g class="needs" transform="translate(${x} ${y})"><rect x="${-hw}" y="-11" width="${2*hw}" height="20" rx="10"/><text y="4" text-anchor="middle">${nw}</text></g>`;}   /* «بيعتمد على» for the bigger grades */
  return `<path class="xarrow ${cls||""}" d="${d}" marker-end="url(#xhead)"/>${t}`;}
const DEFS=`<defs><marker id="xhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></marker></defs>`;
const edgeEnds=(a,b,r)=>{const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy)||1;return [[a[0]+dx/d*r,a[1]+dy/d*r],[b[0]-dx/d*r,b[1]-dy/d*r]];};

/* 🗺️ the big picture: in learning order, numbered, columns sorted to avoid crossings */
function sceneOverview(s){const v=V(),lv=s.levels;const cols={};s.concepts.forEach(c=>{(cols[lv[c]]=cols[lv[c]]||[]).push(c);});
  const L=Object.keys(cols).map(Number).sort((a,b)=>a-b);
  const W=v?380:Math.max(600,L.length*190),H=v?Math.max(420,L.length*150+80):Math.max(320,Math.max(...L.map(k=>cols[k].length))*140+60);const pos={};
  L.forEach((k,i)=>{if(i){const m=x=>{const ps=s.edges.filter(e=>e[1]===x&&pos[e[0]]).map(e=>v?W-pos[e[0]][0]:pos[e[0]][1]);return ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:(v?W/2:H/2);};cols[k].sort((a,b)=>m(a)-m(b));}
    const n=cols[k].length;cols[k].forEach((c,j)=>{const along=L.length===1?0.5:i/(L.length-1),across=(j+1)/(n+1);pos[c]=v?[(1-across)*W,70+along*(H-150)]:[W-90-along*(W-180),across*H];});});
  let num=0;const order=[];L.forEach(k=>cols[k].forEach(c=>order.push(c)));
  const svg=`<svg class="xstage" id="xs" viewBox="0 0 ${W} ${H}" data-bubble="78" role="img" aria-label="الصورة الكبيرة للدرس">${DEFS}
    ${s.edges.map(([a,b])=>{const [p,q]=edgeEnds(pos[b],pos[a],46);return `<g class="xedge" data-a="${a}" data-b="${b}">${flow(curve(p,q,v?0:16),"",0,false)}</g>`;}).join("")}
    ${order.map(c=>node(c,pos[c][0],pos[c][1],72)+`<g class="xnum" transform="translate(${pos[c][0]+30} ${pos[c][1]-34})"><circle r="12"/><text y="5" text-anchor="middle">${++num}</text></g>`).join("")}</svg>`;
  return {svg,wire:root=>{root.querySelectorAll(".xnode").forEach(n=>n.addEventListener("click",()=>{const id=n.dataset.id;sfx("pop");
      const linked=new Set([id]);root.querySelectorAll(".xedge").forEach(e=>{const on=e.dataset.a===id||e.dataset.b===id;e.classList.toggle("dim",!on);e.classList.toggle("lit",on);if(on){linked.add(e.dataset.a);linked.add(e.dataset.b);}});
      focus(root,[...linked]);const ins=s.edges.filter(e=>e[1]===id).map(e=>"«"+exName(e[0])+"»"),outs=s.edges.filter(e=>e[0]===id).map(e=>"«"+exName(e[1])+"»");
      cap((ins.length?"«"+exName(id)+"» بيحتاج "+ins.join(" و")+". ":"«"+exName(id)+"» من البداية، ما بيحتاج إشي قبله. ")+(outs.length?"وبيحتاجه "+outs.join(" و")+".":""));}));},
    onStep:(root,k)=>{focus(root,null);root.querySelectorAll(".xedge").forEach(e=>{e.classList.remove("dim");e.classList.toggle("lit",k===1);});}};}

/* 👋 meet: blue = what comes IN, green = what goes OUT */
function sceneMeet(s){const v=V(),ins=s.ins.slice(0,2),outs=s.outs.slice(0,2);
  const W=v?380:660,H=v?560:360,c=v?[190,285]:[330,190];const spread=(n,i,a,b)=>n===1?(a+b)/2:a+i*((b-a)/(n-1));
  const inP=ins.map((x,i)=>v?[spread(ins.length,i,290,90),78]:[W-92,spread(ins.length,i,90,290)]);
  const outP=outs.map((x,i)=>v?[spread(outs.length,i,290,90),H-78]:[92,spread(outs.length,i,90,290)]);
  const svg=`<svg class="xstage" id="xs" viewBox="0 0 ${W} ${H}" data-bubble="${v?92:96}" role="img" aria-label="تعرّف على ${exName(s.target)}">${DEFS}
    ${ins.map((x,i)=>{const [p,q]=edgeEnds(c,inP[i],v?58:70);return `<g class="xedge in" data-a="${x}">${flow(curve(p,q,0),"in")}</g>`;}).join("")}
    ${outs.map((x,i)=>{const [p,q]=edgeEnds(outP[i],c,v?58:70);return `<g class="xedge out" data-b="${x}">${flow(curve(p,q,0),"out")}</g>`;}).join("")}
    ${node(s.target,c[0],c[1],v?110:128,"happy","star")}
    ${ins.map((x,i)=>node(x,inP[i][0],inP[i][1],70,"happy","side in")).join("")}${outs.map((x,i)=>node(x,outP[i][0],outP[i][1],70,"happy","side out")).join("")}</svg>
    <div class="legend"><span class="lg">${ARROW_LEGEND()}</span></div>`;

      say(root,id,ins.includes(id)?"«"+exName(s.target)+"» بيحتاج «"+exName(id)+"»":"«"+exName(id)+"» بيحتاج «"+exName(s.target)+"»");
      focus(root,[id,s.target]);root.querySelectorAll(".xedge").forEach(e=>{const on=e.dataset.a===id||e.dataset.b===id;e.classList.toggle("lit",on);e.classList.toggle("dim",!on);});

      else{focus(root,[s.target]);mood(root,s.target,"happy");}}};}

/* 🚶 journey — natural:
   · a thing that REALLY travels (water, air, light) moves ALONG the road itself, station by station;
   · stages (flower → pollination → fruit) do not travel: tap the next stage, the road lights up from the one it needs, and it wakes up. */
function sceneJourney(s){const v=V(),n=s.route.length;
  const W=v?380:Math.max(640,n*160),H=v?Math.max(460,n*135+60):320;
  const pos=s.route.map((x,i)=>v?[i%2?120:260,90+i*((H-160)/(n-1))]:[W-90-i*((W-180)/(n-1)),200+(i%2?-24:24)]);
  const segs=pos.slice(1).map((p,i)=>{const [a,b]=edgeEnds(pos[i],p,46);return curve(a,b,v?0:26);});
  const mover=s.traveller!=="spark";const ti=mover?iconOf(s.traveller):null;
  const tart=mover?((ti?artSVG(ti,""):null)||`<svg class="ch" viewBox="0 0 100 100">${ARTS.blob(colorOf(s.traveller))}</svg>`):"";
  const svg=`<svg class="xstage" id="xs" viewBox="0 0 ${W} ${H}" data-bubble="84" role="img" aria-label="رحلة">${DEFS}
    ${segs.map((d,i)=>`<path class="xroad" data-i="${i}" d="${d}"/><path class="xglow" data-i="${i}" d="${d}"/>`).join("")}
    ${s.route.map((x,i)=>node(x,pos[i][0],pos[i][1],76,i===0?"happy":"sad",i===0?"woke":"sleep")).join("")}
    ${mover?`<g id="trav"><g class="xbody" data-mood="laugh">${tart.replace("<svg ",'<svg width="40" height="40" x="-20" y="-20" ')}</g></g>`:""}</svg>`;
  let at=0,busy=false;
  return {svg,wire:root=>{const trav=root.querySelector("#trav");
      root.querySelectorAll(".xglow").forEach(g=>{const L=g.getTotalLength();g.style.strokeDasharray=L;g.style.strokeDashoffset=L;});
      const road=i=>root.querySelector(`.xglow[data-i="${i}"]`);
      if(trav){const p0=road(0).getPointAtLength(0);trav.setAttribute("transform",`translate(${p0.x} ${p0.y})`);}
      const arrive=i=>{at=i;busy=false;root.querySelector(`.xroad[data-i="${i-1}"]`).classList.add("lit");
        const nd=root.querySelector(`.xnode[data-id="${s.route[i]}"]`);nd.classList.remove("sleep");nd.classList.add("woke");mood(root,s.route[i],"laugh");sfx("pop");
        say(root,s.route[i],mover?"وصلتني! 😄":"صار دوري! 😄");cap("📍 "+s.stops[i].say);
        if(i===n-1){sfx("tada");sparkles();setTimeout(()=>cap("🏁 "+(mover?"«"+exName(s.traveller)+"» وصل لآخر محطة: ":"صارت كل المراحل: ")+s.route.map(exName).join(" ← ")),1600);}};
      const go=i=>{if(busy||i!==at+1||i>=n){if(!busy&&i>at+1)cap("خطوة خطوة 🙂 الجاي «"+exName(s.route[at+1])+"»، لأنه "+(s.stops[at+1].say||""));return;}
        busy=true;sfx("step");const g=road(i-1),L=g.getTotalLength();let t=0;const t0=performance.now();
        const step=()=>{if(!g.isConnected)return;t=Math.min(1,(performance.now()-t0)/850);   /* by the clock: same on a slow phone */g.style.strokeDashoffset=String(L*(1-t));
          if(trav){const pt=g.getPointAtLength(L*t);trav.setAttribute("transform",`translate(${pt.x} ${pt.y})`);}
          if(t<1&&!reduce)requestAnimationFrame(step);else{g.style.strokeDashoffset="0";arrive(i);}};step();};
      root.querySelectorAll(".xnode").forEach((nd,i)=>nd.addEventListener("click",()=>go(i)));
      if(trav)trav.addEventListener("pointerdown",e=>{if(busy||at>=n-1)return;e.preventDefault();go(at+1);});
      say(root,s.route[0],mover?"اكبس المحطة الجاية، وأنا بمشي بالطريق 👣":"اكبس المرحلة الجاية 👆");
      cap(mover?"«"+exName(s.traveller)+"» رح يمشي بالطريق من «"+exName(s.route[0])+"» لـ«"+exName(s.route[n-1])+"».":"كل مرحلة بتصحى لما يكون اللي بتحتاجه موجود.");}};}

/* 🔮 what if: one switch; the domino follows the arrows */
function sceneWhatIf(s){const v=V(),all=[s.target].concat(s.affected),n=all.length;
  const W=v?380:Math.max(640,(n+1)*150),H=v?Math.max(460,n*130+80):330;const pos={};
  all.forEach((x,i)=>pos[x]=v?[i%2?130:250,80+i*((H-200)/Math.max(1,n-1))]:[W-90-i*((W-250)/Math.max(1,n-1)),190]);
  (s.calm||[]).forEach(x=>pos[x]=v?[W/2,H-60]:[70,90]);
  const svg=`<svg class="xstage" id="xs" viewBox="0 0 ${W} ${H}" data-bubble="78" role="img" aria-label="شو بيصير لو">${DEFS}
    ${s.edges.map(([a,b])=>{const [p,q]=edgeEnds(pos[b],pos[a],48);return `<g class="xedge" data-b="${b}">${flow(curve(p,q,v?0:22),"")}</g>`;}).join("")}
    ${all.map((x,i)=>node(x,pos[x][0],pos[x][1],i===0?96:74,"happy",i===0?"star":"")).join("")}${(s.calm||[]).map(x=>node(x,pos[x][0],pos[x][1],58,"happy","calm")).join("")}</svg>
    <div class="xswitch"><button class="switch on" id="sw" role="switch" aria-checked="true"><span class="knob"></span></button><b id="swl">«${exName(s.target)}» شغّال ✅</b></div>`;
  let on=true,busy=false;

      sw.addEventListener("click",()=>{if(busy)return;busy=true;on=!on;sw.classList.toggle("on",on);sw.setAttribute("aria-checked",String(on));
        document.getElementById("swl").textContent=on?"«"+exName(s.target)+"» شغّال ✅":"«"+exName(s.target)+"» مطفي ⛔";
        root.querySelector(`.xnode[data-id="${s.target}"]`).classList.toggle("gone",!on);sfx(on?"bloom":"whoosh");say(root,null,"");
        s.affected.forEach((x,i)=>setTimeout(()=>{if(!root.isConnected)return;root.querySelector(`.xnode[data-id="${x}"]`).classList.toggle("tired",!on);mood(root,x,on?"laugh":"sad");
            const e=root.querySelector(`.xedge[data-b="${x}"]`);if(e)e.classList.toggle("dim",!on);say(root,x,on?"رجعت! 😄":(i===0?"وين راح؟ 😢":"وأنا كمان! 😢"));sfx(on?"pop":"bad");
            if(i===s.affected.length-1){busy=false;cap(on?"رجع «"+exName(s.target)+"»، فرجعوا كلهم مبسوطين 😄":"شايف؟ كل واحد بيحتاج اللي قبله، فتعبوا ورا بعض."+((s.calm||[]).length?" بس «"+exName(s.calm[0])+"» ما بيحتاجه، فضل مبسوط 😎":""));}},500+i*700));});}};}

const SCENES={overview:sceneOverview,meet:sceneMeet,journey:sceneJourney,what_if:sceneWhatIf};
const SNAME={overview:"🗺️ الصورة الكبيرة",meet:"👋 تعرّف عليّ",journey:"🚶 الرحلة",what_if:"🔮 شو بيصير لو"};
let current=null;
/* ======================= 🎵 THE SOUNDS (batch 26) — made in the browser with Web Audio, no sound files =======================
   · the AGE STAGE decides the character of the sound: kids = little melodies, high and bouncy · junior = soft and friendly ·
     teen = short clean notes · senior = deeper and calmer (one octave lower, a bigger room) — 🆕 batch 29: EVERY stage has a sound
     for every touch and move (Hareth: «لكل مرحلة أصوات خاصة، والكبار أصوات كبيرة»), only the little ones are the loudest;
   · the SUBJECT decides the instrument and the scale, so every subject sounds different:
       science = marimba · maths = plucked string · physics = electric piano · chemistry = glass bells ·
       geography = kalimba · history = wood · language = a soft flute · (anything else = a small bell);
   · never the same sound twice in a row: every event picks a note of the subject's pentatonic scale (always pleasant together),
     not the one it played last time, with a tiny change of pitch and loudness;
   · right moves in a row climb up the scale (a little tune that grows); a wrong move is a soft low note, never a buzzer;
   · a soft room echo + a limiter: never harsh, never too loud;
   · hovering a character (its pitch always comes from its name, so each one has its OWN voice): kids = a giggle · junior = a curious
     «همم؟» · teen = two quick rising notes · senior = one warm low note (🆕 batch 29: it used to be silent).
   Events it does not know (the films' cat, train, water…) go back to the old sounds (part3_core.js) and the stage packs (stage.js).
   🆕 batch 27 — a NEW subject (identity.py) brings its OWN sound in the page data (graph().sound = {instr, root, scale}):

        const ring=root.querySelector(".na-ring");ring.setAttribute("stroke-dasharray",`${(C*on.size/n).toFixed(1)} ${C.toFixed(1)}`);ring.style.opacity=on.size?1:0;   /* (0: no dot) */
        document.getElementById("naCount").textContent=`${on.size} ${VOICE("من")} ${n}`;
        const all=on.size===n;tgt.classList.toggle("na-ready",all);
        sfx(val?"on":"off",{n:on.size-(val?1:0)});
        if(all){mood(root,s.target,"laugh");cap(s.ready);if(!wasAll){setTimeout(()=>{if(root.isConnected&&on.size===n)sfx("ready");},220);if(!grown())sparkles();}}
        else{mood(root,s.target,on.size?"happy":"sad");const miss=s.needs.map((_,k)=>k).filter(k=>!on.has(k));
          cap((val?`✔️ شغّلت ${naQ(id)}. `:`⛔ طفّيت ${naQ(id)}. `)+`${VOICE("لسا ناقص")} ${miss.map(k=>naQ(s.needs[k].id)).join(" و")}. `+s.needs[i].why);}
        wasAll=all;};
      document.querySelectorAll(".na-tog").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.i;set(i,!on.has(i));}));
      root.querySelectorAll(".na-ing").forEach(nd=>nd.addEventListener("click",()=>{const i=s.needs.findIndex(x=>x.id===nd.dataset.id);if(i>=0)set(i,!on.has(i));}));}};}

/* ✏️ CONNECT — the student draws the «needs» arrows himself: drag from the one who needs to what it needs (or tap them in order).
   Right → the arrow stays + the reason. Reversed → it is explained (the commonest mistake). No link → said so. */
function sceneConnect(s){const v=V(),W=v?380:640,H=v?480:390,c=[W/2,v?H/2:H/2-4],others=s.nodes.slice(1),n=others.length,TZ=v?96:104,OZ=v?64:70;
  const slots=v?[[296,80],[84,400],[296,400],[84,80],[190,54]]:[[544,80],[96,290],[544,290],[96,80],[588,186],[52,186]];   /* the corners first: far from the middle one */
  const pos={};pos[s.target]=c;shuffle(slots.slice(0,n),[...s.target].reduce((a,ch)=>a+ch.charCodeAt(0),7)).forEach((p,i)=>pos[others[i]]=p);   /* mixed: the place never tells who needs whom */
  const size=id=>id===s.target?TZ:OZ;
  const svg=`<svg class="xstage" id="xs" viewBox="0 0 ${W} ${H}" data-bubble="78" role="img" aria-label="${naEsc(VOICE("ارسم الأسهم"))}">${DEFS}<g id="naArrows"></g>
    ${node(s.target,c[0],c[1],TZ,"happy","star na-cn")}${others.map(id=>node(id,pos[id][0],pos[id][1],OZ,"happy","na-cn")).join("")}
    <g id="naTop" pointer-events="none"><line class="na-rubber" x1="0" y1="0" x2="0" y2="0" visibility="hidden"/></g></svg>
    <div class="row center na-crow"><span class="na-count" id="naCount" aria-live="polite"></span><button class="chipbtn na-help" id="naHelp">💡 ${VOICE("ساعدني")}</button></div>`;
  const req=s.links.map((l,k)=>k).filter(k=>s.links[k].required);
  return {svg,wire:root=>{let sel=null,drag=null;const drawn=new Set();const rub=root.querySelector(".na-rubber");
      const count=()=>{document.getElementById("naCount").textContent=`✏️ ${req.filter(k=>drawn.has(k)).length} ${VOICE("من")} ${req.length}`;};count();
      const toSvg=e=>{const pt=root.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(root.getScreenCTM().inverse());};
      const hit=p=>{let best=null,bd=1e9;s.nodes.forEach(id=>{const q=pos[id],d=Math.hypot(p.x-q[0],p.y-q[1]);if(d<size(id)/2+18&&d<bd){bd=d;best=id;}});return best;};
      const select=id=>{sel=id;root.querySelectorAll(".na-cn").forEach(nd=>nd.classList.toggle("na-sel",nd.dataset.id===id));};
      const arrow=(a,b,cls)=>{const [p,q]=naEnds(pos[a],pos[b],size(a)/2+6,size(b)/2+12);const g=document.createElementNS(svgNS,"g");g.setAttribute("class","xedge lit na-arr "+(cls||""));
        g.innerHTML=flow(curve(p,q,16),"");root.querySelector("#naArrows").appendChild(g);return g;};
      const wrong=(a,b)=>{const [p,q]=naEnds(pos[a],pos[b],size(a)/2+6,size(b)/2+12);const l=document.createElementNS(svgNS,"line");
        l.setAttribute("class","na-wrongline");[["x1",p[0]],["y1",p[1]],["x2",q[0]],["y2",q[1]]].forEach(([k,x])=>l.setAttribute(k,x.toFixed(1)));
        root.querySelector("#naTop").appendChild(l);setTimeout(()=>l.remove(),900);};
      const finish=()=>{cap(s.end_say);sfx("ready");if(!grown())sparkles();document.getElementById("naHelp").hidden=true;root.querySelectorAll(".na-ghost").forEach(x=>x.remove());};
      const attempt=(a,b)=>{const k=s.links.findIndex(l=>l.from===a&&l.to===b),r=s.links.findIndex(l=>l.from===b&&l.to===a);
        if(k>=0){if(drawn.has(k)){cap(VOICE("هاد السهم مرسوم ✔️"));return;}drawn.add(k);root.querySelectorAll(".na-ghost").forEach(x=>x.remove());
          arrow(a,b,s.links[k].required?"":"na-bonus");cap(s.links[k].ok_say);sfx("connect",{n:drawn.size});mood(root,a,"laugh");mood(root,b,"laugh");count();
          if(s.links[k].required&&req.every(x=>drawn.has(x)))setTimeout(()=>{if(root.isConnected)finish();},900);}
        else if(r>=0){wrong(a,b);cap(s.links[r].rev_say);sfx("nope");}
        else{wrong(a,b);cap(`🙂 ما في سهم مباشر بين ${naQ(a)} و${naQ(b)}.`);sfx("nope");}};
      const rubber=(a,p)=>{if(!a){rub.setAttribute("visibility","hidden");return;}rub.setAttribute("visibility","visible");rub.setAttribute("x1",a[0]);rub.setAttribute("y1",a[1]);rub.setAttribute("x2",p[0].toFixed(1));rub.setAttribute("y2",p[1].toFixed(1));};
      root.querySelectorAll(".na-cn").forEach(nd=>{nd.style.touchAction="none";});
      root.addEventListener("pointerdown",e=>{const id=hit(toSvg(e));if(!id){if(sel)select(null);return;}naTake(root);e.preventDefault();
        if(sel&&sel!==id){const a=sel;select(null);attempt(a,id);return;}
        select(id);drag={id};try{root.setPointerCapture(e.pointerId);}catch(_){}});
      root.addEventListener("pointermove",e=>{if(drag){const p=toSvg(e);rubber(pos[drag.id],[p.x,p.y]);}});
      root.addEventListener("pointerup",e=>{if(!drag)return;const from=drag.id,id=hit(toSvg(e));drag=null;rubber(null);
        if(id&&id!==from){select(null);attempt(from,id);}
        else if(id===from){sfx("pick");cap(`👉 اخترت ${naQ(from)}. ${VOICE("هلأ اكبس على المفهوم الثاني.")}`);}});
      root.addEventListener("pointercancel",()=>{drag=null;rubber(null);});
      document.getElementById("naHelp").addEventListener("click",()=>{naTake(root);const k=req.find(x=>!drawn.has(x));if(k===undefined)return;const l=s.links[k];
        root.querySelectorAll(".na-ghost").forEach(x=>x.remove());arrow(l.from,l.to,"na-ghost");sfx("pick");cap(`💡 ${VOICE("جرّب")}: ${VOICE("من")} ${naQ(l.from)} ${VOICE("لـ")}${naQ(l.to)}.`);});}};}

/* ⚖️ COMPARE — two close concepts. Each fact card goes to «X», to «Y», or to «الاثنين» (tap the card, then its place).
   Right → it is explained. Wrong → «try another place»; a second wrong try puts it in its place, with the reason. */
function sceneCompare(s){const v=V(),W=v?380:640,H=v?196:216,Z=v?76:90,A=s.target,B=s.other;
  const pa=[W*0.77,H/2-10],pb=[W*0.23,H/2-10];
  const svg=`<svg class="xstage" id="xs" viewBox="0 0 ${W} ${H}" role="img" aria-label="${naEsc(VOICE("قارن"))}">
    <ellipse class="na-venn na-va" cx="${W*0.62}" cy="${H/2}" rx="${W*0.25}" ry="${H*0.45}"/><ellipse class="na-venn na-vb" cx="${W*0.38}" cy="${H/2}" rx="${W*0.25}" ry="${H*0.45}"/>
    <text class="na-vlab" x="${W/2}" y="${H/2+5}" text-anchor="middle">${VOICE("الاثنين")}</text>
    ${node(A,pa[0],pa[1],Z,"happy","na-ca")}${node(B,pb[0],pb[1],Z,"happy","na-cb")}</svg>
    <div class="na-tray" id="naTray">${s.facts.map((f,i)=>`<div class="na-card" role="button" tabindex="0" data-i="${i}" aria-pressed="false">${naEsc(VOICE(f.fact))}</div>`).join("")}</div>
    <div class="na-zones">${[["a",naQ(A)],["both",VOICE("الاثنين")],["b",naQ(B)]].map(([k,t])=>`<div class="na-zone na-z-${k}" role="button" tabindex="0" data-side="${k}"><b class="na-zh">${naEsc(t)}</b><div class="na-zl"></div></div>`).join("")}</div>`;
  return {svg,wire:root=>{let pick=null;const tries={};
      const choose=i=>{naTake(root);pick=pick===i?null:i;document.querySelectorAll(".na-card").forEach(c=>{const on=+c.dataset.i===pick;c.classList.toggle("na-picked",on);c.setAttribute("aria-pressed",String(on));});if(pick!==null)sfx("pick");};
      const place=(i,side,auto)=>{const f=s.facts[i],card=document.querySelector(`.na-card[data-i="${i}"]`);if(!card)return;
        const z=document.querySelector(`.na-zone[data-side="${side}"] .na-zl`);const d=document.createElement("div");d.className="na-placed";d.textContent="✔️ "+VOICE(f.fact);z.appendChild(d);card.remove();pick=null;
        cap((auto?"💡 ":"")+f.why);sfx(auto?"pick":"place");(side==="both"?[A,B]:[side==="a"?A:B]).forEach(id=>mood(root,id,"laugh"));
        if(!document.querySelector(".na-card"))setTimeout(()=>{if(!root.isConnected)return;cap(s.end_say);sfx("ready");if(!grown())sparkles();},900);};
      const drop=side=>{naTake(root);if(pick===null){cap(VOICE("👆 اختار بطاقة أول، وبعدين مكانها."));return;}const i=pick,f=s.facts[i];
        if(f.side===side){place(i,side,false);return;}
        tries[i]=(tries[i]||0)+1;const z=document.querySelector(`.na-zone[data-side="${side}"]`);z.classList.remove("na-nope");void z.offsetWidth;z.classList.add("na-nope");sfx("nope");
        if(tries[i]>=2)place(i,f.side,true);else cap(VOICE("🙂 مش هون. فكّر فيها كمان، وجرّب مكان ثاني."));};
      document.querySelectorAll(".na-card").forEach(c=>{c.addEventListener("click",()=>choose(+c.dataset.i));naKeys(c,()=>choose(+c.dataset.i));});
      document.querySelectorAll(".na-zone").forEach(z=>{z.addEventListener("click",()=>drop(z.dataset.side));naKeys(z,()=>drop(z.dataset.side));});}};}

/* 🧑‍🏫 TEACH — a classmate does not get it. He asks; the student picks the answer; the classmate repeats it in his words.
   A wrong pick is answered with WHY (that definition belongs to «Y» · the arrow is the other way). At the end: the explanation he built. */
function sceneTeach(s){const v=V(),W=v?380:640,H=v?226:236,st=stageNow(),Z=v?90:104;
  const mate=st==="kids"?skin().name:st==="junior"?"صاحبك":"زميلك";
  const M=v?[92,104]:[180,108],T=v?[W-96,104]:[W-180,108];                      /* the classmate on the left: his messages are on the left */
  const person=`<svg class="ch" viewBox="0 0 100 100"><circle cx="50" cy="34" r="19" style="fill:var(--chip);stroke:var(--brand)" stroke-width="3"/><path d="M16 94 Q18 60 50 58 Q82 60 84 94 Z" style="fill:var(--chip);stroke:var(--brand)" stroke-width="3"/></svg>`;
  const mart=((st==="kids"||st==="junior")&&artSVG(skin().mascot,""))||person;   /* teen / senior: a plain person (no cartoon face) */
  const svg=`<svg class="xstage" id="xs" viewBox="0 0 ${W} ${H}" data-bubble="70" role="img" aria-label="${naEsc(VOICE("اشرح لزميلك"))}">
    <g class="xnode na-mate" data-id="__mate" transform="translate(${M[0]} ${M[1]})"><g class="xbody" data-mood="o">${mart.replace("<svg ",`<svg width="${Z}" height="${Z}" x="${-Z/2}" y="${-Z/2}" `)}</g><text class="xname" y="${Z/2+18}" text-anchor="middle">${naEsc(mate)}</text><g class="xsay"></g></g>
    ${node(s.target,T[0],T[1],Z,"happy","star")}</svg>
    <div class="na-chat" id="naChat" aria-live="polite"></div><div class="na-opts" id="naOpts"></div><div class="na-note" id="naNote" hidden></div>`;
  return {svg,wire:root=>{let r=0;const chat=document.getElementById("naChat"),opts=document.getElementById("naOpts");
      const msg=(who,html)=>{chat.insertAdjacentHTML("beforeend",`<div class="na-msg na-${who}">${who==="them"?`<b>${naEsc(mate)}:</b> `:""}${html}</div>`);};
      const ask=()=>{const R=s.rounds[r];msg("them",naEsc(VOICE(R.ask)));say(root,"__mate",R.ask);mood(root,"__mate","o");
        opts.innerHTML=R.options.map((o,k)=>`<button class="na-opt" data-k="${k}">${naEsc(VOICE(o.opt))}</button>`).join("");
        opts.querySelectorAll(".na-opt").forEach(b=>b.addEventListener("click",()=>choose(+b.dataset.k,b)));};
      const end=()=>{const note=document.getElementById("naNote");note.hidden=false;note.innerHTML=richText(s.learnt);cap(s.learnt);sfx("ready");if(!grown())sparkles();
        say(root,"__mate",VOICE(st==="kids"?"هلأ فهمت! شكراً 😄":"هلأ وضحت. شكراً."));mood(root,"__mate","laugh");};
      const choose=(k,b)=>{naTake(root);const R=s.rounds[r],o=R.options[k];msg("me",naEsc(VOICE(o.opt)));
        if(o.ok){opts.innerHTML="";msg("them",richText(o.reply));say(root,"__mate",o.reply.replace(/[«»]/g,""));cap(o.reply);sfx("place");mood(root,"__mate","laugh");mood(root,s.target,"laugh");r++;
          setTimeout(()=>{if(!root.isConnected)return;if(r<s.rounds.length)ask();else end();},1300);}
        else{b.disabled=true;b.classList.add("na-wrong");msg("them",richText(o.reply));say(root,"__mate",o.reply.replace(/[«»]/g,""));cap(o.reply);sfx("nope");mood(root,"__mate","sad");}};
      ask();}};}

/* 🪜 LADDER — «ليش؟» again and again: each answer is the reason one rung deeper, down to the base
   (or «وبعدين؟»: what comes after, rung by rung). The arrows keep the «needs» direction (from the one who needs). */
function sceneLadder(s){const v=V(),n=s.rungs.length,W=v?380:640,G=v?128:140,TZ=v?94:100,Z=v?68:72;const H=72+G*n+82;   /* room between rungs: the «needs» label never sits on a name */
  const ids=[s.target].concat(s.rungs.map(r=>r.id));const dx=v?72:112;
  const pos=ids.map((id,k)=>[W/2+(k%2?-dx:dx),66+k*G]);const rail=v?160:200;   /* zigzag: every rung is beside the one before it */
  const svg=`<svg class="xstage" id="xs" viewBox="0 0 ${W} ${H}" data-bubble="74" role="img" aria-label="${naEsc(VOICE("السلّم"))}">${DEFS}
    <path class="na-rail" d="M${W/2-rail} 26 V${H-30} M${W/2+rail} 26 V${H-30}"/>${ids.slice(1).map((_,k)=>`<path class="na-rungline" d="M${W/2-rail} ${66+(k+1)*G} H${W/2+rail}"/>`).join("")}
    ${ids.slice(1).map((id,k)=>`<g class="na-slot" data-k="${k+1}"><circle cx="${pos[k+1][0]}" cy="${pos[k+1][1]}" r="${Z/2-4}"/><text x="${pos[k+1][0]}" y="${pos[k+1][1]+9}" text-anchor="middle">؟</text></g>`).join("")}
    <g id="naArrows"></g>${ids.map((id,k)=>node(id,pos[k][0],pos[k][1],k?Z:TZ,"happy",k?"na-hid":"star")).join("")}</svg>
    <div class="row center na-lrow"><button class="btn na-ask" id="naAsk">${s.mode==="why"?"❓ "+VOICE("ليش؟"):"⏭️ "+VOICE("وبعدين؟")}</button><button class="btn ghost" id="naReset" hidden>↺ ${VOICE("من الأول")}</button></div>`;
  return {svg,wire:root=>{let k=0;const ask=document.getElementById("naAsk"),reset=document.getElementById("naReset");
      const up=(a,b)=>s.mode==="why"?[a,b]:[b,a];                                 /* [the one who needs, what it needs] */
      ask.addEventListener("click",()=>{naTake(root);if(k>=n)return;const r=s.rungs[k];
        const [a,b]=up(ids[k],ids[k+1]),ia=ids.indexOf(a),ib=ids.indexOf(b);
        root.querySelector(`.xnode[data-id="${ids[k+1]}"]`).classList.remove("na-hid");root.querySelector(`.na-slot[data-k="${k+1}"]`).classList.add("na-found");
        const sg=pos[ib][0]>pos[ia][0]?1:-1,p=[pos[ia][0]+sg*((ia?Z:TZ)/2+6),pos[ia][1]],q=[pos[ib][0]-sg*((ib?Z:TZ)/2+12),pos[ib][1]];   /* from side to side: the arrow never crosses a name */
        const g=document.createElementNS(svgNS,"g");g.setAttribute("class","xedge lit na-arr");g.innerHTML=flow(curve(p,q,14),"");root.querySelector("#naArrows").appendChild(g);
        say(root,a,r.short);cap(r.because);mood(root,ids[k+1],"laugh");sfx("rung",{n:k,down:s.mode==="why"});k++;
        if(k>=n){ask.hidden=true;setTimeout(()=>{if(!root.isConnected)return;cap(s.end_say);sfx("ready");if(!grown())sparkles();reset.hidden=false;},1900);}});
      reset.addEventListener("click",()=>{k=0;root.querySelector("#naArrows").innerHTML="";root.querySelectorAll(".na-slot").forEach(x=>x.classList.remove("na-found"));ids.slice(1).forEach(id=>root.querySelector(`.xnode[data-id="${id}"]`).classList.add("na-hid"));
        say(root,null,"");ask.hidden=false;reset.hidden=true;cap(s.steps[0]);sfx("flip");});}};}

SCENES.recipe=sceneRecipe;SNAME.recipe="🧪 الوصفة";SCENES.connect=sceneConnect;SNAME.connect="✏️ ارسم الأسهم";SCENES.compare=sceneCompare;SNAME.compare="⚖️ قارن";
SCENES.teach=sceneTeach;SNAME.teach="🧑‍🏫 علّم صاحبك";SCENES.ladder=sceneLadder;SNAME.ladder="🪜 السلّم";

     ONE main part (the metaphor: memory = drawers, processor = chip, error = bug…) + its face + up to 2 small badges.

     «lego:<main>:<extra>+<extra>:<colour 0-7>:<motion>»      e.g.  lego:drawers:gear+spark:3:wobble

   (it only CHOOSES parts from these lists; it never draws). WHO draws: this code + the browser.
   The API draws the SAME pictures: every part is exported with holes ({{FILL}} {{INK}}) to art/art.json, and

/* ======================= 👥 THE AGE STAGES (grade 1 → 12) =======================
   The same scenes for every grade, but the WORLD around them grows up with the student:
   · 🌈 kids   (1–4):  a playful friend — full faces, giggles, hops, emoji, playful sounds (as before);
   · 🧭 junior (5–7):  a curious explorer — faces without cheeks, no giggles, fewer emoji, soft sounds;
   · 🔬 teen   (8–9):  a confident classmate — eyes only, no hopping, «بيعتمد على» instead of «بيحتاج», clean clicks, a lab-notebook look;
   · 📐 senior (10–12): a calm expert — NO faces (textbook diagrams, thin lines), no emoji in the words, «نقاش» instead of «حوار», almost silent.
   The stage comes from the lesson (lesson.audience.stage, set by the factory from the book's grade). A small switcher lets you try any stage. */
const STAGES={

const STAGE_ORDER=["kids","junior","teen","senior"];
let STAGE_OVERRIDE=null;
function stageAuto(){const l=lesson()||{},g=graph()||{};const a=l.audience||g.audience||{};return STAGES[a.stage]?a.stage:"kids";}
function stageNow(){return STAGE_OVERRIDE&&STAGES[STAGE_OVERRIDE]?STAGE_OVERRIDE:stageAuto();}
const grown=()=>stageNow()==="teen"||stageNow()==="senior";

  "أهلاً! 👋":["هاد أنا.","—"],"أنا هون! 👋":["هون.","هون."],"وصلتني! 😄":["وصلت.","اكتملت هالمرحلة."],"صار دوري! 😄":["دوري هلأ.","هلأ هالمرحلة."],

  "أنا تمام 😎":["أنا ما تأثرت.","لا يتأثر."]};
const EMOJI_FACES=/[😀-🙏🤗-🤯🥰-🥺😎👋👣👆🙂]/gu;
function VOICE(t){if(t===null||t===undefined)return t;let s=String(t);const st=stageNow();if(st==="kids")return s;
  if(st==="junior")return s.replace(/\s*[😄😢😟😎]+/gu,"").replace(/\s{2,}/g," ").trim();               /* a few emoji less, the same friendly words */
  const line=VOICE_LINES[s.trim()];if(line){const v=line[st==="senior"?1:0];return v==="—"?"":v;}
  s=s.replace(/^أهلاً! أنا «([^»]+)»\.?$/,(m,n)=>st==="senior"?`تعريف «${n}».`:`هاد «${n}».`).replace(/^📌\s*/,"• ");   /* the first line of «تعرّف عليّ» */
  VOICE_WORDS.forEach(([a,b])=>{s=s.split(a).join(b);});

  return s.replace(/\s+([.،!؟:])/g,"$1").replace(/\s{2,}/g," ").trim();}

/* split a sentence into lines of about n characters (max lines; the last one keeps the rest) */
function wrapLines(t,n,max){const w=String(t).split(" ");const out=[""];w.forEach(x=>{const c=out[out.length-1];if((c+" "+x).trim().length>n&&out.length<max)out.push(x);else out[out.length-1]=(c+" "+x).trim();});return out;}
/* 🔍 the magnifying glass: the character is in the fog; where the lens goes, the fog clears and a fact appears */
function sceneLens(s){const v=V(),W=v?380:640,H=v?460:350,c=[W/2,v?220:175];const n=s.facts.length;
  /* the facts sit around the character, AWAY from the edges (a box is 210 wide; on the phone they go top and bottom) */
  const BW=v?(n>2?168:300):210;let spots;
  if(v)spots=s.facts.map((f,i)=>n>2?[i%2?W*0.27:W*0.73,i<2?56:H-60]:[W/2,i?H-58:54]);           /* phone: top and bottom */
  else spots=s.facts.map((f,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [c[0]+Math.cos(a)*(W/2-BW/2-24),c[1]+Math.sin(a)*(H/2-52)];});
  const fogs=[[.2,.25,90],[.75,.2,110],[.5,.8,120],[.15,.75,80],[.85,.7,95]];
  const svg=`<svg class="xstage" id="xs" viewBox="0 0 ${W} ${H}" role="img" aria-label="العدسة" style="touch-action:none"><defs><mask id="fogm"><rect width="${W}" height="${H}" fill="white"/><circle id="hole" cx="${c[0]}" cy="${c[1]}" r="72" fill="black"/></mask>
      <radialGradient id="fogg" cx="50%" cy="45%" r="70%"><stop offset="0" style="stop-color:var(--chip)"/><stop offset="1" style="stop-color:var(--line)"/></radialGradient>
      <filter id="fogb" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter></defs>
    ${node(s.target,c[0],c[1],130,"happy","star")}
    <g id="facts">${s.facts.map((f,i)=>{f=VOICE(f);const ls=wrapLines(f,v?(n>2?18:34):22,3);const h=16+ls.length*18;return `<g class="fact" data-i="${i}" transform="translate(${spots[i][0].toFixed(1)} ${spots[i][1].toFixed(1)})"><rect x="${-BW/2}" y="${-h/2}" width="${BW}" height="${h}" rx="12"/>${ls.map((l,j)=>`<text y="${-h/2+21+j*18}" text-anchor="middle">${l}</text>`).join("")}</g>`;}).join("")}</g>
    <g class="fog" mask="url(#fogm)"><rect width="${W}" height="${H}" fill="url(#fogg)"/>${fogs.map(([x,y,r])=>`<ellipse cx="${x*W}" cy="${y*H}" rx="${r}" ry="${r*.6}" style="fill:var(--panel)" opacity=".6" filter="url(#fogb)"/>`).join("")}</g>
    <g id="found"></g>
    <g id="lens" style="pointer-events:none" transform="translate(${c[0]} ${c[1]})"><g class="lenshint"><rect x="-78" y="80" width="156" height="30" rx="15"/><text y="100" text-anchor="middle">👆 حرّك العدسة</text></g><circle r="72" fill="none" stroke="#3b2a1a" stroke-width="6"/><circle r="66" fill="none" stroke="#fff" stroke-width="2" opacity=".6"/><line x1="52" y1="52" x2="96" y2="96" stroke="#7A4D2B" stroke-width="12" stroke-linecap="round"/></g></svg>`;
  return {svg,wire:root=>{const hole=root.querySelector("#hole"),lens=root.querySelector("#lens");const seen=new Set();const R=()=>root.getBoundingClientRect();
      const at=(x,y)=>{x=Math.max(20,Math.min(W-20,x));y=Math.max(20,Math.min(H-20,y));hole.setAttribute("cx",x);hole.setAttribute("cy",y);lens.setAttribute("transform",`translate(${x} ${y})`);
        spots.forEach((p,i)=>{if(!seen.has(i)&&Math.abs(p[0]-x)<BW/2+10&&Math.abs(p[1]-y)<46){seen.add(i);const f=root.querySelector(`.fact[data-i="${i}"]`);
          root.querySelector("#found").appendChild(f);f.classList.add("found");                 /* found → it comes OUT of the fog, whole and clear */
          sfx("pop");mood(root,s.target,"laugh");cap("🔍 «"+exName(s.target)+"»: "+s.facts[i]);
          if(seen.size===n){setTimeout(()=>{root.querySelector(".fog").classList.add("gone2");cap("✨ اكتشفت كل أسرار «"+exName(s.target)+"»!");sfx("tada");},700);}}});};
      /* 🎬 video mode does NOT move the lens: the student discovers by himself. It only shows a «move me» hint until the first touch. */
      root.querySelector("#lens").classList.add("hintme");

      root.addEventListener("pointermove",e=>{first();mv(e);});root.addEventListener("pointerdown",e=>{first();mv(e);});at(c[0],c[1]);}};}

/* ======================= 🎞️ THE FILM ENGINE: real processes, acted out — then the student drives them =======================
   One engine for every subject. Each verb = what REALLY happens:
   visit (a bee flies to the flower) · carry (the wind takes the seed far) · transform (the seed sprouts) ·
   combine / take_away / groups / share (blocks) · cut / equivalent / compare (pizza) · build (stones become a pyramid) ·
   exchange (goods ↔ money) · flow_river (the river waters the fields) · write (pictures on a tablet).
