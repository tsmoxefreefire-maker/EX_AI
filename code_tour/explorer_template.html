<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مستكشف الكود</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Kufi+Arabic:wght@700&display=swap" rel="stylesheet">
<style>
/* The project explorer (💡 Hareth's idea): like PyCharm — the project tree on the LEFT, the code in the middle (tabs, line numbers,
   colours), and the Arabic explanation on the RIGHT. Phone: one panel at a time (الملفات · الشرح · الكود). */
:root{
  --bg:#F7F8FA; --panel:#FFFFFF; --panel2:#F2F3F5; --line:#E4E6EB; --ink:#1F2329; --muted:#646A78; --faint:#8D93A1;
  --accent:#3574F0; --accent-ink:#FFFFFF; --accent-soft:#EAF1FE; --sel:#D4E2FF; --hover:#EEF0F4;
  --opt:#A15C00; --opt-soft:#FFF1DC; --good:#1F7A4D; --good-soft:#E3F4EA;
  --ed-bg:#FFFFFF; --ed-ink:#1B1D22; --ed-ln:#A9AEBB; --ed-hl:#FFF4CC; --ed-hl-edge:#E2B93B; --ed-gut:#FAFAFB;
  --t-kw:#0033B3; --t-str:#067D17; --t-com:#8C8C8C; --t-num:#1750EB; --t-fn:#00627A; --t-dec:#9E880D; --t-tag:#0033B3; --t-attr:#174AD4; --t-prop:#871094; --t-key:#871094; --t-head:#0033B3;
  --py:#3572A5; --js:#B08800; --css:#6E40C9; --html:#D9480F; --json:#5F6B76; --md:#2F6F9F; --text:#7A808C; --folder:#9AA0AC;
  --f-ui:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-head:"Noto Kufi Arabic","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --top:44px; --status:26px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E1F22; --panel:#2B2D30; --panel2:#26282B; --line:#393B40; --ink:#DFE1E5; --muted:#9A9DA5; --faint:#6F737A;
  --accent:#548AF7; --accent-ink:#FFFFFF; --accent-soft:#25324D; --sel:#2E436E; --hover:#35373C;
  --opt:#E8A848; --opt-soft:#3A2F1C; --good:#5FB98A; --good-soft:#1E3A2B;
  --ed-bg:#1E1F22; --ed-ink:#BCBEC4; --ed-ln:#4E535C; --ed-hl:#3B3523; --ed-hl-edge:#B8932E; --ed-gut:#1E1F22;
  --t-kw:#CF8E6D; --t-str:#6AAB73; --t-com:#7A7E85; --t-num:#2AACB8; --t-fn:#56A8F5; --t-dec:#B3AE60; --t-tag:#D5B778; --t-attr:#BABABA; --t-prop:#C77DBB; --t-key:#C77DBB; --t-head:#56A8F5;
  --py:#6CA0DC; --js:#E5C04B; --css:#A98BEA; --html:#F08A5D; --json:#9AA7B2; --md:#7DB3E0; --text:#9A9DA5; --folder:#8C9099;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1E1F22; --panel:#2B2D30; --panel2:#26282B; --line:#393B40; --ink:#DFE1E5; --muted:#9A9DA5; --faint:#6F737A;
  --accent:#548AF7; --accent-ink:#FFFFFF; --accent-soft:#25324D; --sel:#2E436E; --hover:#35373C;
  --opt:#E8A848; --opt-soft:#3A2F1C; --good:#5FB98A; --good-soft:#1E3A2B;
  --ed-bg:#1E1F22; --ed-ink:#BCBEC4; --ed-ln:#4E535C; --ed-hl:#3B3523; --ed-hl-edge:#B8932E; --ed-gut:#1E1F22;
  --t-kw:#CF8E6D; --t-str:#6AAB73; --t-com:#7A7E85; --t-num:#2AACB8; --t-fn:#56A8F5; --t-dec:#B3AE60; --t-tag:#D5B778; --t-attr:#BABABA; --t-prop:#C77DBB; --t-key:#C77DBB; --t-head:#56A8F5;
  --py:#6CA0DC; --js:#E5C04B; --css:#A98BEA; --html:#F08A5D; --json:#9AA7B2; --md:#7DB3E0; --text:#9A9DA5; --folder:#8C9099;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 var(--f-ui);overflow:hidden}
button{font:inherit;color:inherit}
code,.mono{font-family:var(--f-code);font-size:.92em}
code{direction:ltr;unicode-bidi:isolate;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px;white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- the frame ---------- */
.app{height:100%;display:grid;grid-template-rows:var(--top) 1fr var(--status);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.top{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);direction:ltr;min-width:0}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.logo .mark{width:22px;height:22px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 12px var(--f-code)}
.logo .t{font-family:var(--f-head);font-size:14px}
.crumbs{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--muted);font:12.5px var(--f-code)}
.crumbs b{color:var(--ink);font-weight:600}
.tbtn{border:1px solid var(--line);background:var(--panel2);border-radius:7px;height:30px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:var(--hover)}
.tbtn kbd{font:11px var(--f-code);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.main{display:grid;grid-template-columns:280px minmax(0,1fr) 420px;min-height:0;direction:ltr}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel)}
.pane+.pane{border-left:1px solid var(--line)}
.status{display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--panel);border-top:1px solid var(--line);font:12px var(--f-code);color:var(--muted);direction:ltr;white-space:nowrap;overflow:hidden}
.status .sp{flex:1}
.status .ok{color:var(--good)}

/* ---------- left: the project ---------- */
.ptabs{display:flex;gap:2px;padding:6px 6px 0;border-bottom:1px solid var(--line);direction:rtl}
.ptab{flex:1;border:0;background:none;padding:7px 2px 8px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);font-weight:600;font-size:12.5px;white-space:nowrap}
.ptab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pfilter{margin:8px;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:0 8px;background:var(--panel2)}
.pfilter input{flex:1;min-width:0;border:0;background:none;height:30px;font:13px var(--f-ui);color:var(--ink);outline:none}
.pbody{flex:1;overflow:auto;padding:2px 0 16px}
.row{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;text-align:left;padding:2px 8px 2px calc(8px + var(--d,0) * 16px);cursor:pointer;min-height:26px;white-space:nowrap}
.row:hover{background:var(--hover)}
.row[aria-current="true"]{background:var(--sel)}
.row .tw{width:12px;color:var(--faint);font-size:10px;transition:transform .12s;flex:none}
.row.open .tw{transform:rotate(90deg)}
.row .nm{overflow:hidden;text-overflow:ellipsis;font:13px var(--f-code)}
.row.dir .nm{font-weight:600}
.row.dir .nm{flex:none;max-width:72%}
.row .fd{flex:1 1 auto;min-width:0;color:var(--faint);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:right;margin-left:auto;padding-left:8px}
.row .stp{margin-left:auto;flex:none;min-width:20px;height:18px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font:600 11px var(--f-code);display:grid;place-items:center;padding:0 5px}
.ficon{flex:none;width:16px;height:16px;border-radius:3px;display:grid;place-items:center;font:700 8.5px/1 var(--f-code);color:#fff;letter-spacing:-.3px}
.f-python{background:var(--py)}.f-js{background:var(--js);color:#1b1b1b}.f-css{background:var(--css)}.f-html{background:var(--html)}.f-json{background:var(--json)}.f-md{background:var(--md)}.f-text{background:var(--text)}
.folder{flex:none;width:16px;height:14px;color:var(--folder)}
.jsub{display:flex;gap:6px;padding:8px;direction:rtl}
.jsub button{flex:1;border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:5px;cursor:pointer;font-size:12.5px}
.jsub button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.jphase{direction:rtl;padding:12px 12px 4px}
.jphase h4{margin:0;font:700 13px var(--f-head);color:var(--accent)}
.jphase p{margin:2px 0 0;color:var(--muted);font-size:12px;line-height:1.5}
.jstep{direction:rtl;display:grid;grid-template-columns:28px 1fr;gap:8px;width:100%;border:0;background:none;text-align:right;padding:7px 12px;cursor:pointer;align-items:start}
.jstep:hover{background:var(--hover)}
.jstep[aria-current="true"]{background:var(--sel)}
.jstep .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 11.5px var(--f-code);background:var(--panel)}
.jstep[aria-current="true"] .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.jstep.opt .n{border-style:dashed;border-color:var(--opt);color:var(--opt)}
.jstep b{display:block;font-weight:600;line-height:1.35}
.jstep small{display:block;color:var(--faint);font:11.5px var(--f-code);direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl{direction:rtl;padding:6px 12px}
.gl dt{font-weight:700;margin-top:10px}
.gl dd{margin:2px 0 0;color:var(--muted);line-height:1.6}

/* ---------- middle: tabs + code ---------- */
.tabs{display:flex;overflow-x:auto;background:var(--panel2);border-bottom:1px solid var(--line);scrollbar-width:thin;min-height:36px}
.tab{display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;height:36px;border:0;border-right:1px solid var(--line);background:none;cursor:pointer;white-space:nowrap;font:12.5px var(--f-code);color:var(--muted);flex:none}
.tab[aria-selected="true"]{background:var(--ed-bg);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.tab .x{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;color:var(--faint)}
.tab .x:hover{background:var(--hover);color:var(--ink)}
.cbar{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line);background:var(--ed-bg);font:12px var(--f-code);color:var(--muted);min-height:34px}
.cbar .path{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbar .path b{color:var(--ink)}
.cbtn{border:1px solid var(--line);background:var(--panel2);border-radius:6px;height:26px;padding:0 8px;cursor:pointer;font:12px var(--f-ui);white-space:nowrap}
.cbtn:hover{background:var(--hover)}
.cbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.code{flex:1;overflow:auto;background:var(--ed-bg);color:var(--ed-ink);font:12.8px/1.62 var(--f-code);tab-size:4;padding:6px 0 40px}
.ln{display:grid;grid-template-columns:var(--gw,64px) minmax(0,1fr);min-height:20.7px}
.ln .g{position:sticky;left:0;z-index:1;background:var(--ed-gut);display:flex;justify-content:flex-end;align-items:flex-start;gap:4px;padding-right:12px;color:var(--ed-ln);user-select:none;cursor:pointer}
.ln .g:hover{color:var(--ink)}
.ln .tx{white-space:pre;padding-right:24px}
.code.wrap .ln .tx{white-space:pre-wrap;overflow-wrap:anywhere}
.ln.hl{background:var(--ed-hl)}
.ln.hl .g{background:var(--ed-hl);box-shadow:inset -3px 0 0 var(--ed-hl-edge)}
.mk{font-style:normal;font-weight:700;font-size:10.5px;width:15px;height:15px;margin-top:3px;border-radius:3px;display:grid;place-items:center;color:#fff;cursor:pointer}
.k-func,.k-method{background:var(--t-fn)}.k-class{background:var(--t-kw)}.k-data{background:var(--t-prop)}.k-section{background:var(--t-head)}
.genbar{direction:rtl;margin:10px 14px;padding:10px 12px;border:1px dashed var(--opt);background:var(--opt-soft);border-radius:8px;color:var(--ink);font:13px var(--f-ui)}
.t-kw{color:var(--t-kw)}.t-str{color:var(--t-str)}.t-com{color:var(--t-com);font-style:italic}.t-num{color:var(--t-num)}.t-fn{color:var(--t-fn)}.t-dec{color:var(--t-dec)}
.t-tag{color:var(--t-tag)}.t-attr{color:var(--t-attr)}.t-prop{color:var(--t-prop)}.t-key{color:var(--t-key)}.t-head{color:var(--t-head);font-weight:700}.t-b{font-weight:700}
.t-def{color:var(--t-fn);font-weight:600}

/* ---------- welcome (no file open) ---------- */
.welcome{direction:rtl;flex:1;overflow:auto;padding:28px clamp(16px,4vw,48px) 48px;background:var(--ed-bg)}
.welcome h1{font:700 clamp(22px,2.4vw,30px)/1.3 var(--f-head);margin:0 0 8px;text-wrap:balance}
.welcome .lead{color:var(--muted);max-width:66ch;margin:0 0 22px;font-size:15px}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin:0 0 22px}
.flow button{flex:1 1 150px;min-width:0;text-align:right;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;cursor:pointer}
.flow button:hover{border-color:var(--accent)}
.flow .no{font:600 11px var(--f-code);color:var(--accent)}
.flow b{display:block;font-size:14px;margin:2px 0}
.flow span{display:block;color:var(--muted);font-size:12.5px;line-height:1.5}
.flow .ar{align-self:center;color:var(--faint);font-size:18px;flex:none}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.stats span{border:1px solid var(--line);border-radius:999px;padding:3px 12px;background:var(--panel2);font-size:13px}
.stats b{font-family:var(--f-code);font-variant-numeric:tabular-nums}
.how3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 22px}
.how3 div{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel)}
.how3 b{display:block;margin-bottom:2px}
.how3 p{margin:0;color:var(--muted);font-size:13px}
.go{display:flex;flex-wrap:wrap;gap:8px}
.gobtn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
.gobtn.alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}

/* ---------- right: the explanation ---------- */
.info{direction:rtl;flex:1;overflow:auto;padding:0 0 40px}
.ih{padding:16px 18px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.ih .ip{font:12px var(--f-code);color:var(--faint);direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ih h2{margin:2px 0 4px;font:700 19px/1.35 var(--f-head);text-wrap:balance}
.ih .one{margin:0;color:var(--ink);font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:12px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.opt{background:var(--opt-soft);color:var(--opt);border-color:transparent}
.jnav{display:flex;align-items:center;gap:6px;margin-top:10px}
.jnav .chip{flex:1;justify-content:center}
.jnav button{border:1px solid var(--line);background:var(--panel);border-radius:6px;height:26px;padding:0 9px;cursor:pointer;font-size:12.5px}
.jnav button:disabled{opacity:.4;cursor:default}
.sec{padding:14px 18px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 6px;font:700 13px var(--f-head);color:var(--accent)}
.sec p{margin:0}
.sec ol,.sec ul{margin:0;padding-right:20px}
.sec li{margin:3px 0}
.sec li.sub{list-style:circle;margin-right:14px;color:var(--muted)}
.ideas{display:grid;gap:6px;margin:0}
.ideas div{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel2)}
.ideas dt{font-weight:700}.ideas dd{margin:0;color:var(--muted)}
.tip{margin:12px 18px;padding:10px 12px;border-radius:8px;background:var(--good-soft);border:1px solid transparent;color:var(--ink)}
.tip b{color:var(--good)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.lk{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:2px 8px;cursor:pointer;font:12px var(--f-code);direction:ltr;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.lk:hover{border-color:var(--accent);color:var(--accent)}
.lk .ar{font-family:var(--f-ui);color:var(--muted);margin-left:4px;direction:rtl}
.none{color:var(--faint);font-size:13px}
.items{list-style:none;margin:0;padding:0 !important;display:grid;gap:4px}
.it{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;width:100%;text-align:right;border:1px solid transparent;background:none;border-radius:8px;padding:7px 8px;cursor:pointer;align-items:start}
.it:hover{background:var(--hover)}
.it[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.it .ik{grid-row:span 2;margin-top:3px}
.it .ih2{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.it .ih2 code{font-weight:600}
.it .ih2 small{color:var(--faint);font:11px var(--f-code)}
.it .itx{color:var(--muted);font-size:13px;line-height:1.55}
.it.more .itx{color:var(--ink)}
.ik{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;color:#fff;font:700 10.5px var(--f-code)}
.icard{margin:12px 12px 4px;border:1.5px solid var(--accent);border-radius:12px;background:var(--panel);overflow:hidden}
.icard .ich{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--accent-soft)}
.icard .ich code{font-weight:700;font-size:13px;background:var(--panel)}
.icard .ich small{color:var(--muted);font:11.5px var(--f-code)}
.icard .ich .x{margin-right:auto;border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px;width:26px;height:26px;border-radius:6px}
.icard .ich .x:hover{background:var(--hover)}
.icard .ib{padding:10px 14px 12px}
.icard .ib p{margin:0 0 8px}
.icard h4{margin:10px 0 4px;font:700 12.5px var(--f-head);color:var(--muted)}
.icard ol,.icard ul{margin:0;padding-right:20px}
.icard .stepbadge{display:inline-block;margin:0 0 6px;font-size:12px;color:var(--accent);font-weight:600}
.note{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--opt-soft);color:var(--ink);font-size:13px}

/* ---------- search ---------- */
.search{position:fixed;inset:0;z-index:20;background:rgba(10,12,16,.45);display:grid;align-items:start;justify-items:center;padding:10vh 16px 16px}
.search[hidden]{display:none}
.sbox{width:min(640px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;direction:rtl}
.sbox input{width:100%;border:0;border-bottom:1px solid var(--line);padding:14px 16px;font:15px var(--f-ui);background:none;color:var(--ink);outline:none}
.sres{max-height:60vh;overflow:auto;padding:6px}
.sr{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;width:100%;text-align:right;border:0;background:none;border-radius:8px;padding:8px 10px;cursor:pointer;align-items:center}
.sr[aria-selected="true"],.sr:hover{background:var(--accent-soft)}
.sr .st{display:flex;gap:8px;align-items:baseline;min-width:0}
.sr .st b{font-weight:600}
.sr .st code{font-size:12px}
.sr small{grid-column:2;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shint{padding:8px 14px;border-top:1px solid var(--line);color:var(--faint);font-size:12px}

/* ---------- phone: one panel at a time ---------- */
.seg{display:none}
@media (max-width:1099px){
  .app{grid-template-rows:var(--top) auto 1fr var(--status)}
  .seg{display:flex;gap:4px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);direction:rtl}

<script>
const D = /*EXPLORER*/null;

const store={get(k,d){try{const v=localStorage.getItem("pe2:"+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem("pe2:"+k,JSON.stringify(v));}catch(e){}}};
const S={open:[],cur:null,item:null,fstep:null,mode:"files",jsub:"files",wrap:store.get("wrap",true),filter:""};
const LANG_LABEL={python:"Python",js:"JavaScript",css:"CSS",html:"HTML",json:"JSON",md:"Markdown",text:"Text"};
const LANG_ICON={python:"py",js:"JS",css:"#",html:"<>",json:"{}",md:"M",text:"T"};
const KIND_ICON={func:"ƒ",method:"m",class:"C",data:"≡",section:"§"};

const folderSvg=`<svg class="folder" viewBox="0 0 16 14" aria-hidden="true"><path fill="currentColor" d="M1 2.5A1.5 1.5 0 0 1 2.5 1h3.6l1.6 1.6h5.8A1.5 1.5 0 0 1 15 4.1v7.4A1.5 1.5 0 0 1 13.5 13h-11A1.5 1.5 0 0 1 1 11.5z"/></svg>`;

/* ---------- Arabic text with code names inside: names in <code>, a project file name becomes a link ---------- */
const PLAIN=new Set(["SVG","JSON","HTML","CSS","AI","API","JavaScript","FastAPI","Python","Gemini","OpenAI","PyCharm","GitHub","LLM","Web","Audio","Playwright","Chromium","SDK","UI","PNG","URL","HTTP","GET","POST","DELETE","Pydantic","unittest","Lego","ID","AST"]);
function inl(t){const s=String(t==null?"":t);let out="",last=0;const re=/\d+(?:[.,]\d+)?\s?(?:ms|px|Hz|KB|MB|s)\b|[A-Za-z_$][\w$]*(?:[.\/:\-][\w$]+)*(?:\(\))?/g;let m;

    if(hit.length===1&&/\.(py|js|css|css2|css3|html|json|md|txt)$/.test(base))out+=`<button class="lk" data-open="${esc(hit[0])}" type="button">${esc(w)}</button>`;

/* ---------- syntax colours (one small tokenizer per language) ---------- */
const PYKW=/^(?:and|as|assert|async|await|break|continue|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|nonlocal|not|or|pass|raise|return|try|while|with|yield|None|True|False|self|cls|def|class|print)$/;
const JSKW=/^(?:const|let|var|function|return|if|else|for|while|do|break|continue|switch|case|default|new|this|typeof|instanceof|in|of|try|catch|finally|throw|class|extends|async|await|null|undefined|true|false|void|delete|yield)$/;
function tokPy(s){const T=[];let i=0,prev="";const n=s.length;
  while(i<n){const c=s[i];let m;
    if(c==="#"){const e=s.indexOf("\n",i);const j=e<0?n:e;T.push(["com",s.slice(i,j)]);i=j;continue;}
    if((m=/^[rRbBuUfF]{0,2}("""|''')/.exec(s.slice(i,i+5)))){const q=m[1];const st=i+m[0].length;const e=s.indexOf(q,st);const j=e<0?n:e+3;T.push(["str",s.slice(i,j)]);i=j;continue;}
    if((m=/^[rRbBuUfF]{0,2}(["'])/.exec(s.slice(i,i+3)))){const q=m[1];let j=i+m[0].length;while(j<n&&s[j]!==q&&s[j]!=="\n"){if(s[j]==="\\")j++;j++;}j=Math.min(n,j+1);T.push(["str",s.slice(i,j)]);i=j;continue;}
    if(c==="@"&&(i===0||s[i-1]==="\n"||/\s/.test(s[i-1]))){m=/^@[\w.]+/.exec(s.slice(i));if(m){T.push(["dec",m[0]]);i+=m[0].length;continue;}}
    if(/[A-Za-z_]/.test(c)){m=/^[A-Za-z_]\w*/.exec(s.slice(i,i+80));const w=m[0];
      if(prev==="def"||prev==="class")T.push(["def",w]);else if(PYKW.test(w))T.push(["kw",w]);else if(/^\s*\(/.test(s.slice(i+w.length,i+w.length+3)))T.push(["fn",w]);else T.push(["",w]);
      prev=w;i+=w.length;continue;}
    if(/\d/.test(c)&&!/\w/.test(s[i-1]||"")){m=/^\d[\d_]*(?:\.\d+)?(?:[eE][+-]?\d+)?/.exec(s.slice(i,i+40));T.push(["num",m[0]]);i+=m[0].length;continue;}
    if(!/\s/.test(c))prev="";T.push(["",c]);i++;}
  return T;}
function tokJs(s){const T=[];let i=0,prev="";const n=s.length;
  const tpl=(k)=>{let j=k+1,depth=0;while(j<n){const ch=s[j];if(ch==="\\"){j+=2;continue;}if(depth===0&&ch==="`")return j+1;if(ch==="$"&&s[j+1]==="{"){depth++;j+=2;continue;}if(depth&&ch==="`"){j=tpl(j);continue;}if(depth&&ch==="}"){depth--;j++;continue;}j++;}return n;};
  while(i<n){const c=s[i];let m;
    if(c==="/"&&s[i+1]==="/"&&s[i-1]!==":"&&s[i-1]!=="\\"){const e=s.indexOf("\n",i);const j=e<0?n:e;T.push(["com",s.slice(i,j)]);i=j;continue;}
    if(c==="/"&&s[i+1]==="*"){const e=s.indexOf("*/",i+2);const j=e<0?n:e+2;T.push(["com",s.slice(i,j)]);i=j;continue;}
    if(c==="`"){const j=tpl(i);T.push(["str",s.slice(i,j)]);i=j;continue;}
    if(c==='"'||c==="'"){let j=i+1;while(j<n&&s[j]!==c&&s[j]!=="\n"){if(s[j]==="\\")j++;j++;}j=Math.min(n,j+1);T.push(["str",s.slice(i,j)]);i=j;continue;}
    if(/[A-Za-z_$]/.test(c)){m=/^[A-Za-z_$][\w$]*/.exec(s.slice(i,i+80));const w=m[0];
      if(prev==="function")T.push(["def",w]);else if(JSKW.test(w))T.push(["kw",w]);else if(/^\s*\(/.test(s.slice(i+w.length,i+w.length+3)))T.push(["fn",w]);else T.push(["",w]);
      prev=w;i+=w.length;continue;}
    if(/\d/.test(c)&&!/[\w$]/.test(s[i-1]||"")){m=/^\d[\d_]*(?:\.\d+)?(?:[eE][+-]?\d+)?/.exec(s.slice(i,i+40));T.push(["num",m[0]]);i+=m[0].length;continue;}
    if(!/\s/.test(c))prev="";T.push(["",c]);i++;}
  return T;}
function tokRx(s,rules){const T=[];let i=0;const n=s.length;
  outer:while(i<n){for(const [re,cls] of rules){re.lastIndex=i;const m=re.exec(s);if(m&&m.index===i&&m[0].length){T.push([cls,m[0]]);i+=m[0].length;continue outer;}}T.push(["",s[i]]);i++;}
  return T;}
const R=(src)=>new RegExp(src,"y");
const RULES={
  css:[[R("/\\*[\\s\\S]*?\\*/"),"com"],[R("\"(?:\\\\.|[^\"\\\\])*\"|'(?:\\\\.|[^'\\\\])*'"),"str"],[R("@[\\w-]+"),"kw"],[R("--[\\w-]+"),"prop"],[R("[\\w-]+(?=\\s*:[^;{}]*[;}])"),"prop"],[R("#[0-9a-fA-F]{3,8}\\b"),"num"],[R("-?\\d*\\.?\\d+(?:px|em|rem|%|s|ms|deg|vh|vw|fr|ch)?\\b"),"num"],[R("[.#][\\w-]+"),"fn"],[R("[\\w-]+"),""],[R("\\s+"),""]],
  html:[[R("<!--[\\s\\S]*?-->"),"com"],[R("</?[\\w-]+"),"tag"],[R("/?>"),"tag"],[R("[\\w:-]+(?==)"),"attr"],[R("\"[^\"]*\"|'[^']*'"),"str"],[R("&\\w+;"),"num"],[R("[^<&\"']+"),""]],
  json:[[R("\"(?:\\\\.|[^\"\\\\])*\"(?=\\s*:)"),"key"],[R("\"(?:\\\\.|[^\"\\\\])*\""),"str"],[R("-?\\d+(?:\\.\\d+)?(?:[eE][+-]?\\d+)?"),"num"],[R("\\b(?:true|false|null)\\b"),"kw"],[R("[^\"\\d\\-tfn]+"),""]],
  md:[[R("```[\\s\\S]*?```"),"str"],[R("(?<=^|\\n)#{1,6} [^\\n]*"),"head"],[R("`[^`\\n]+`"),"str"],[R("\\*\\*[^*\\n]+\\*\\*"),"b"],[R("(?<=^|\\n)\\s*(?:[-*]|\\d+\\.) "),"kw"],[R("\\|"),"com"],[R("[^`*#|\\n]+"),""],[R("\\n"),""]]};
function tokens(f){const s=f.code||"";if(f.lang==="python")return tokPy(s);if(f.lang==="js")return tokJs(s);if(RULES[f.lang])return tokRx(s,RULES[f.lang]);return [["",s]];}
const CACHE=new Map();
function codeLines(f){if(CACHE.has(f.p))return CACHE.get(f.p);const lines=[""];
  for(const [cls,txt] of tokens(f)){const parts=txt.split("\n");parts.forEach((pt,k)=>{if(k)lines.push("");if(pt)lines[lines.length-1]+=cls?`<span class="t-${cls}">${esc(pt)}</span>`:esc(pt);});}
  CACHE.set(f.p,lines);return lines;}

/* ---------- the left panel ---------- */
const OPEN_DIRS=new Set(store.get("dirs",["02_question_factory","03_explain_player_src","05_explanation_api","05_explanation_api/api","05_explanation_api/core","code_tour","02_question_factory/player"]));
function tree(){const root={dirs:{},files:[],path:""};for(const f of FILES){const parts=f.p.split("/");let nd=root;for(let k=0;k<parts.length-1;k++){const key=parts[k];nd=nd.dirs[key]||(nd.dirs[key]={dirs:{},files:[],path:parts.slice(0,k+1).join("/")});}nd.files.push(f);}return root;}
const TREE=tree();
function fileMatches(f,q){if(!q)return true;q=q.toLowerCase();return f.p.toLowerCase().includes(q)||((f.card||{}).title||"").includes(q)||((f.card||{}).one||"").includes(q);}
function renderTreeRows(nd,depth,q){let h="";
  const dirs=Object.keys(nd.dirs).sort();
  for(const name of dirs){const d=nd.dirs[name];const inner=renderTreeRows(d,depth+1,q);if(q&&!inner)continue;const open=q?true:OPEN_DIRS.has(d.path);
    h+=`<button class="row dir ${open?"open":""}" type="button" data-dir="${esc(d.path)}" style="--d:${depth}" aria-expanded="${open}"><span class="tw" aria-hidden="true">▶</span>${folderSvg}<span class="nm">${esc(name)}</span>${D.folders[d.path]?`<span class="fd">${esc(D.folders[d.path])}</span>`:""}</button>`;
    if(open)h+=inner;}
  for(const f of nd.files.slice().sort((a,b)=>a.base.localeCompare(b.base))){if(!fileMatches(f,q))continue;
    h+=`<button class="row file" type="button" data-p="${esc(f.p)}" style="--d:${depth}" aria-current="${S.cur===f.p}" title="${esc((f.card||{}).title||"")}"><span class="tw"></span>${ficon(f.lang)}<span class="nm">${esc(f.base)}</span>${f.step?`<span class="stp" title="الخطوة ${f.step} من رحلة المشروع">${f.step}</span>`:""}</button>`;}
  return h;}
function renderLeft(){$$(".ptab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.mode===S.mode)));$("#pfilterBox").style.display=S.mode==="files"?"":"none";const B=$("#pbody");
  if(S.mode==="files"){B.innerHTML=renderTreeRows(TREE,0,S.filter.trim())||`<p class="none" style="padding:12px;direction:rtl">ما في ملف بهالاسم.</p>`;}
  else if(S.mode==="journey"){let h=`<div class="jsub"><button type="button" data-jsub="files" aria-pressed="${S.jsub==="files"}">الملفات بالترتيب (${AR(D.journey.length)})</button><button type="button" data-jsub="funcs" aria-pressed="${S.jsub==="funcs"}">الفانكشنز بالترتيب (${AR(D.fsteps.length)})</button></div>`;
    if(S.jsub==="files"){for(const ph of D.jphases){h+=`<div class="jphase"><h4>${esc(ph.title)}</h4><p>${esc(ph.desc)}</p></div>`;for(const st of D.journey.filter(x=>x.phase===ph.id))h+=`<button class="jstep" type="button" data-jfile="${esc(st.p)}" aria-current="${S.cur===st.p&&!S.item&&S.fstep==null}"><span class="n">${st.n}</span><span><b>${esc(st.title)}</b><small>${esc(st.p)}</small></span></button>`;}}
    else{for(const ph of D.fphases){h+=`<div class="jphase"><h4>${esc(ph.title)}</h4><p>${esc(ph.desc)}</p></div>`;for(const st of D.fsteps.filter(x=>x.phase===ph.id))h+=`<button class="jstep ${st.optional?"opt":""}" type="button" data-fstep="${st.n}" aria-current="${S.fstep===st.n}"><span class="n">${st.n}</span><span><b>${esc(st.title)}</b><small>${esc(st.func?st.func+"()":(st.file||"المتصفح"))}</small></span></button>`;}}
    B.innerHTML=h;}
  else{B.innerHTML=`<dl class="gl">${D.glossary.map(([w,m])=>`<dt>${inl(w)}</dt><dd>${inl(m)}</dd>`).join("")}</dl>`;}}

/* ---------- the middle: tabs + code ---------- */
function renderTabs(){$("#tabs").innerHTML=S.open.map(p=>{const f=BY.get(p);return `<button class="tab" role="tab" type="button" data-tab="${esc(p)}" aria-selected="${S.cur===p}" title="${esc(p)}">${ficon(f.lang)}${esc(f.base)}<span class="x" data-close="${esc(p)}" aria-label="سكّر ${esc(f.base)}">×</span></button>`;}).join("");

function renderCode(){const A=$("#codeArea");const f=BY.get(S.cur);
  if(!f){A.innerHTML=welcome();return;}

  h+=`<div class="code ${S.wrap?"wrap":""}" id="code" style="--gw:${gw}px" tabindex="0" aria-label="كود ${esc(f.base)}">`;

    <div class="flow">${flow}</div>
    <div class="stats"><span><b>${AR(nF)}</b> ملف</span><span><b>${AR(nI)}</b> فانكشن وجدول، كلهم مشروحين</span><span><b>${AR(nL.toLocaleString("en"))}</b> سطر</span><span><b>${AR(D.journey.length)}</b> خطوة بالرحلة</span></div>
    <div class="how3"><div><b>📁 اختار ملف من اليسار</b><p>بيطلع كوده كامل بالنص، وشرحه بالعربي عاليمين.</p></div><div><b>🔢 أو امشِ خطوة خطوة</b><p>من «خطوة خطوة»: الملفات (أو الفانكشنز) بترتيب الشغل الحقيقي.</p></div><div><b>ƒ اكبس على أي فانكشن</b><p>بتتلوّن أسطرها بالكود، وبيطلع شرحها: شو بتعمل، وعلى مين بتعتمد، ومين بيستعملها.</p></div></div>
    <div class="go"><button class="gobtn" type="button" data-start="1">▶ ابدأ من الخطوة ١</button><button class="gobtn alt" type="button" data-act="search">🔍 دوّر (Ctrl K)</button></div></div>`;}

/* ---------- the right: the explanation ---------- */
const refBtn=([fi,key])=>{const f=FILES[fi];if(!f)return "";const it=f.itemsBy.get(key);const ar=it&&it.text?it.text.split(/[.،:]/)[0].slice(0,38):"";return `<button class="lk" type="button" data-open="${esc(f.p)}" data-item="${esc(key)}" title="${esc(f.p)}">${esc(key)}${f.p!==S.cur?` <span class="ar">· ${esc(f.base)}</span>`:""}</button>`;};
const fileBtn=p=>{const f=BY.get(p);return f?`<button class="lk" type="button" data-open="${esc(p)}" title="${esc((f.card||{}).title||"")}">${esc(f.base)}${(f.card||{}).title?` <span class="ar">${esc(f.card.title)}</span>`:""}</button>`:"";};
function stepCard(st){const L=(arr)=>`<ol>${(arr||[]).map(x=>x.startsWith("  ")?`<li class="sub">${inl(x.trim())}</li>`:`<li>${inl(x)}</li>`).join("")}</ol>`;
  return `<span class="stepbadge">رحلة الفانكشنز · الخطوة ${AR(st.n)} من ${AR(D.fsteps.length)}${st.optional?" · بس مع الموديل":""}</span>
    <p><b>${esc(st.title)}:</b> ${inl(st.what)}</p>
    ${st.takes&&st.takes.length?`<h4>بتاخد</h4><ul>${st.takes.map(x=>`<li>${inl(x)}</li>`).join("")}</ul>`:""}
    ${st.does&&st.does.length?`<h4>بتعمل، بالترتيب</h4>${L(st.does)}`:""}
    ${st.gives?`<h4>بتطلّع</h4><p>${inl(st.gives)}</p>`:""}
    ${st.note?`<div class="note">${inl(st.note)}</div>`:""}`;}
function itemCard(f){let it=S.item&&f.itemsBy.get(S.item);const st=S.fstep!=null?D.fsteps[S.fstep-1]:(it&&it.fstep?D.fsteps[it.fstep-1]:null);
  if(!it&&!st)return "";
  const head=it?`<span class="ik k-${it.kind}">${KIND_ICON[it.kind]||"·"}</span><code>${esc(it.key)}</code><small>سطر ${AR(it.start)}${it.end>it.start?"–"+AR(it.end):""} · ${KIND_AR[it.kind]||""}</small>`:`<span class="ik k-func">ƒ</span><b>${esc(st.title)}</b>`;
  let body="";
  if(it)body+=`<p>${inl(it.text||"…")}</p>`;
  if(st)body+=stepCard(st);
  if(it&&it.calls&&it.calls.length)body+=`<h4>بتستعمل (من الكود نفسه)</h4><div class="links">${it.calls.map(refBtn).join("")}</div>`;
  if(it&&it.by&&it.by.length)body+=`<h4>مين بيستعملها</h4><div class="links">${it.by.map(refBtn).join("")}</div>`;
  return `<section class="icard" aria-label="شرح ${esc(it?it.key:st.title)}"><div class="ich">${head}<button class="x" type="button" data-act="unitem" aria-label="رجوع لشرح الملف كله">✕</button></div><div class="ib">${body}</div></section>`;}
function renderInfo(){const I=$("#info");const f=BY.get(S.cur);
  if(!f){I.innerHTML=`<div class="ih"><h2>أهلاً 👋</h2><p class="one">اختار ملف من اليسار، أو ابدأ «خطوة خطوة». الشرح بيطلع هون.</p></div>
    <div class="sec"><h3>كيف بيشتغل المشروع، باختصار</h3><ol>${D.jphases.map(ph=>`<li><b>${esc(ph.short)}:</b> ${esc(ph.desc)}</li>`).join("")}</ol></div>
    <div class="sec"><h3>مين بيعمل شو</h3><p>${inl(D.project.who)}</p></div>`;return;}
  const c=f.card||{};const js=D.journey.find(x=>x.p===f.p);const items=(f.items||[]);
  const real=items.filter(x=>x.kind!=="section");
  let h=`<div class="ih"><div class="ip">${esc(f.p)}</div><h2>${esc(c.title||f.base)}</h2><p class="one">${inl(c.one||"لسا ما انكتب شرح لهالملف.")}</p>
    <div class="chips"><span class="chip">${ficon(f.lang)} ${LANG_LABEL[f.lang]||f.lang}</span><span class="chip">${AR(f.lines)} سطر</span>${real.length?`<span class="chip">${AR(real.length)} ${f.lang==="python"||f.lang==="js"?"فانكشن وجدول":"عنصر"}</span>`:""}${f.gen?`<span class="chip opt">بيتولّد لحاله</span>`:""}${js?`<span class="chip acc">الخطوة ${AR(js.n)} بالرحلة</span>`:""}</div>`;
  if(js){const k=D.journey.indexOf(js);h+=`<div class="jnav"><button type="button" data-jfile="${esc((D.journey[k-1]||{}).p||"")}" ${k?"":"disabled"} aria-label="الخطوة اللي قبل">→ قبل</button><span class="chip acc">${esc(js.title)}</span><button type="button" data-jfile="${esc((D.journey[k+1]||{}).p||"")}" ${k<D.journey.length-1?"":"disabled"} aria-label="الخطوة اللي بعد">بعد ←</button></div>`;}
  h+=`</div>`;
  h+=itemCard(f);
  if(js&&js.what)h+=`<div class="sec"><h3>بالرحلة</h3><p>${inl(js.what)}</p></div>`;
  if(c.role)h+=`<div class="sec"><h3>دوره بالمشروع</h3><p>${inl(c.role)}</p></div>`;
  if(c.how&&c.how.length)h+=`<div class="sec"><h3>${f.lang==="python"||f.lang==="js"?"كيف بيشتغل، خطوة خطوة":"شو فيه"}</h3><ol>${c.how.map(x=>`<li>${inl(x)}</li>`).join("")}</ol></div>`;
  if(c.ideas&&c.ideas.length)h+=`<div class="sec"><h3>كلمات لازم تعرفها</h3><dl class="ideas">${c.ideas.map(([w,m])=>`<div><dt>${inl(w)}</dt><dd>${inl(m)}</dd></div>`).join("")}</dl></div>`;
  if(c.tip)h+=`<div class="tip"><b>💡 نصيحة:</b> ${inl(c.tip)}</div>`;
  h+=`<div class="sec"><h3>بيعتمد على</h3>${f.uses&&f.uses.length?`<div class="links">${f.uses.map(fileBtn).join("")}</div>`:`<p class="none">ولا ملف من المشروع.</p>`}
      <h3 style="margin-top:12px">مين بيستعمله</h3>${f.used_by&&f.used_by.length?`<div class="links">${f.used_by.map(fileBtn).join("")}</div>`:`<p class="none">${f.p.includes("test")?"هاد فحص: إنت بتشغّله.":"ولا ملف (بيشتغل لحاله، أو إنت بتفتحه)."}</p>`}</div>`;
  if(real.length){h+=`<div class="sec"><h3>جوّا الملف (${AR(real.length)}) · اكبس على أي واحد</h3><ul class="items">${real.map(it=>`<li><button class="it ${it.fstep?"more":""}" type="button" data-item="${esc(it.key)}" aria-current="${S.item===it.key}"><span class="ik k-${it.kind}">${KIND_ICON[it.kind]||"·"}</span><span class="ih2"><code>${esc(it.key)}</code><small>${AR(it.start)}${it.end>it.start?"–"+AR(it.end):""}</small>${it.fstep?`<span class="chip acc">شرح مفصّل · خطوة ${AR(it.fstep)}</span>`:""}</span><span class="itx">${inl(it.text||"")}</span></button></li>`).join("")}</ul></div>`;}
  else if(items.length){h+=`<div class="sec"><h3>الأقسام (${AR(items.length)})</h3><ul class="items">${items.map(it=>`<li><button class="it" type="button" data-item="${esc(it.key)}"><span class="ik k-section">§</span><span class="ih2"><span>${esc(it.key)}</span><small>${AR(it.start)}</small></span></button></li>`).join("")}</ul></div>`;}
  I.innerHTML=h;I.scrollTop=0;}

/* ---------- status + crumbs ---------- */
function renderStatus(){const f=BY.get(S.cur);const it=f&&S.item&&f.itemsBy.get(S.item);
  $("#crumbs").innerHTML=f?`${esc(f.p.split("/").slice(0,-1).join(" / "))}${f.p.includes("/")?" / ":""}<b>${esc(f.base)}</b>${it?` › ${esc(it.key)}`:""}`:"INTERACTIVE_EXPLANATION";
  $("#status").innerHTML=f?`<span>${esc(f.p)}</span><span class="sp"></span>${it?`<span class="hide-s">Ln ${it.start}–${it.end}</span>`:""}<span>${LANG_LABEL[f.lang]||""}</span><span class="hide-s">${f.lines} lines</span><span class="ok">● شرح بالعربي</span>`:`<span>INTERACTIVE_EXPLANATION</span><span class="sp"></span><span>${FILES.length} files</span><span class="ok">● كل ملف إله شرح</span>`;}

/* ---------- actions ---------- */
function setPane(p){document.body.dataset.pane=p;$$(".seg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.pane===p)));
  if(p==="code")requestAnimationFrame(()=>{markLines();scrollToItem();});}   /* the code was hidden: scroll to the function once it shows */
function openFile(p,item,opts){opts=opts||{};const f=BY.get(p);if(!f)return;
  if(!S.open.includes(p)){S.open.push(p);if(S.open.length>8)S.open.splice(0,S.open.length-8);}
  const same=S.cur===p;S.cur=p;S.item=item&&f.itemsBy.has(item)?item:null;S.fstep=opts.fstep!=null?opts.fstep:null;store.set("cur",p);
  try{history.replaceState(null,"","#"+p.replace(/\//g,"~"));}catch(e){}
  renderTabs();if(!same)renderCode();else markLines();renderInfo();renderStatus();renderLeft();
  if(S.item)requestAnimationFrame(()=>{markLines();scrollToItem();});else if(!same){const c=$("#code");if(c)c.scrollTop=0;}
  if(mobile()&&opts.pane!==false)setPane(opts.pane||"info");}
function selectItem(k,toCode){const f=BY.get(S.cur);if(!f||!f.itemsBy.has(k))return;S.item=k;S.fstep=null;markLines();scrollToItem();renderInfo();renderStatus();
  if(mobile())setPane(toCode?"code":"info");else{const c=$("#info .icard");if(c)c.scrollIntoView({block:"nearest"});}}
function closeTab(p){const k=S.open.indexOf(p);if(k<0)return;S.open.splice(k,1);if(S.cur===p){const nx=S.open[k]||S.open[k-1];if(nx){S.cur=null;openFile(nx,null,{pane:false});}else{S.cur=null;S.item=null;renderTabs();renderCode();renderInfo();renderStatus();renderLeft();}}else renderTabs();}
function openFStep(n){const st=D.fsteps[n-1];if(!st)return;const p=st.file&&BY.has(st.file)?st.file:"03_explain_player_src/explain.js";openFile(p,st.func||null,{fstep:st.func&&BY.get(p).itemsBy.has(st.func)?null:n});}
function innermost(f,n){let best=null;for(const it of f.items||[])if(it.kind!=="section"&&it.start<=n&&n<=it.end&&(!best||it.end-it.start<best.end-best.start))best=it;return best;}

document.addEventListener("click",e=>{const t=e.target.closest("button,[data-k],.g");if(!t)return;
  if(t.matches(".row.dir")){const d=t.dataset.dir;OPEN_DIRS.has(d)?OPEN_DIRS.delete(d):OPEN_DIRS.add(d);store.set("dirs",[...OPEN_DIRS]);renderLeft();return;}
  if(t.matches(".row.file")){openFile(t.dataset.p);return;}
  if(t.matches(".ptab")){S.mode=t.dataset.mode;renderLeft();return;}
  if(t.dataset.jsub){S.jsub=t.dataset.jsub;renderLeft();return;}
  if(t.dataset.jfile!==undefined){if(t.dataset.jfile)openFile(t.dataset.jfile);return;}
  if(t.dataset.fstep){openFStep(+t.dataset.fstep);return;}
  if(t.dataset.close){e.stopPropagation();closeTab(t.dataset.close);return;}
  if(t.dataset.tab){openFile(t.dataset.tab,null,{pane:false});return;}
  if(t.matches(".mk")){selectItem(t.dataset.k,false);return;}
  if(t.matches(".g")){const f=BY.get(S.cur);const n=+t.parentNode.dataset.n;const it=f&&innermost(f,n);if(it)selectItem(it.key,false);return;}
  if(t.dataset.open){openFile(t.dataset.open,t.dataset.item||null);return;}
  if(t.matches(".it")&&t.dataset.item){const f=BY.get(S.cur);const it=f&&f.itemsBy.get(t.dataset.item);if(it&&it.kind==="section"){S.item=it.key;markLines();scrollToItem();if(mobile())setPane("code");return;}selectItem(t.dataset.item,mobile());return;}
  if(t.dataset.act==="unitem"){S.item=null;S.fstep=null;markLines();renderInfo();renderStatus();return;}
  if(t.dataset.act==="search"||t.id==="btnSearch"){openSearch();return;}
  if(t.dataset.start){openFile(D.journey[0].p);S.mode="journey";S.jsub="files";renderLeft();return;}
  if(t.id==="btnWrap"){S.wrap=!S.wrap;store.set("wrap",S.wrap);t.setAttribute("aria-pressed",String(S.wrap));$("#code").classList.toggle("wrap",S.wrap);return;}
  if(t.id==="btnCopy"){const f=BY.get(S.cur);const done=()=>{t.textContent="✓ انتسخ";setTimeout(()=>t.textContent="نسخ الكود",1400);};
    try{navigator.clipboard.writeText(f.code).then(done,()=>{selectCode();t.textContent="انعلّم: Ctrl C";});}catch(err){selectCode();}return;}
  if(t.id==="btnInfo2"){setPane("info");return;}
  if(t.id==="btnTheme"){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";store.set("theme",r.dataset.theme);return;}
  if(t.closest(".seg")&&t.dataset.pane){setPane(t.dataset.pane);return;}
  if(t.matches(".sr")){pickResult(+t.dataset.r);return;}});
function selectCode(){const c=$("#code");if(!c)return;const r=document.createRange();r.selectNodeContents(c);const s=getSelection();s.removeAllRanges();s.addRange(r);}
$("#pfilter").addEventListener("input",e=>{S.filter=e.target.value;renderLeft();});

/* ---------- search (Ctrl K) ---------- */
let RES=[],RI=0;
function openSearch(){$("#search").hidden=false;const q=$("#sq");q.value="";runSearch("");setTimeout(()=>q.focus(),0);}
function closeSearch(){$("#search").hidden=true;}
function runSearch(q){q=q.trim().toLowerCase();const out=[];
  for(const f of FILES){const c=f.card||{};const hay=(f.p+" "+(c.title||"")+" "+(c.one||"")).toLowerCase();if(!q||hay.includes(q))out.push({f,score:(f.base.toLowerCase().startsWith(q)?3:0)+(f.step?1:0)});}
  if(q)for(const f of FILES)for(const it of f.items||[]){if(it.kind==="section")continue;if(it.key.toLowerCase().includes(q)||(it.text||"").toLowerCase().includes(q))out.push({f,it,score:it.key.toLowerCase()===q?5:it.key.toLowerCase().startsWith(q)?2:0});}
  out.sort((a,b)=>b.score-a.score);RES=out.slice(0,50);RI=0;
  $("#sres").innerHTML=RES.map((r,k)=>r.it?`<button class="sr" type="button" role="option" data-r="${k}" aria-selected="${k===0}"><span class="ik k-${r.it.kind}">${KIND_ICON[r.it.kind]}</span><span class="st"><code>${esc(r.it.key)}</code><span class="mono" style="color:var(--faint);font-size:11.5px">${esc(r.f.base)}</span></span><small>${esc(r.it.text||"")}</small></button>`
    :`<button class="sr" type="button" role="option" data-r="${k}" aria-selected="${k===0}">${ficon(r.f.lang)}<span class="st"><b>${esc((r.f.card||{}).title||r.f.base)}</b><span class="mono" style="color:var(--faint);font-size:11.5px">${esc(r.f.p)}</span></span><small>${esc((r.f.card||{}).one||"")}</small></button>`).join("")||`<p class="none" style="padding:12px">ما لقيت إشي. جرّب كلمة ثانية.</p>`;}
function pickResult(k){const r=RES[k];if(!r)return;closeSearch();openFile(r.f.p,r.it?r.it.key:null);}
$("#sq").addEventListener("input",e=>runSearch(e.target.value));
$("#sq").addEventListener("keydown",e=>{if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();RI=Math.max(0,Math.min(RES.length-1,RI+(e.key==="ArrowDown"?1:-1)));$$(".sr").forEach((b,k)=>b.setAttribute("aria-selected",String(k===RI)));const b=$$(".sr")[RI];if(b)b.scrollIntoView({block:"nearest"});}else if(e.key==="Enter"){e.preventDefault();pickResult(RI);}});
$("#search").addEventListener("click",e=>{if(e.target.id==="search")closeSearch();});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openSearch();}else if(e.key==="Escape"&&!$("#search").hidden)closeSearch();});
addEventListener("resize",()=>{const b=$("#btnInfo2");if(b)b.style.display=mobile()?"":"none";});

/* ---------- start ---------- */
try{const th=store.get("theme",null);if(th)document.documentElement.dataset.theme=th;}catch(e){}
const fromHash=decodeURIComponent((location.hash||"").slice(1)).replace(/~/g,"/");
setPane(document.body.dataset.pane||"tree");
renderLeft();renderTabs();renderCode();renderInfo();renderStatus();
const first=BY.has(fromHash)?fromHash:store.get("cur",null);
if(first&&BY.has(first))openFile(first,null,{pane:mobile()?"info":false});
try{window.__EXPLORER={open:openFile,item:selectItem,fstep:openFStep,state:S};}catch(e){}   /* for the browser check only */
})();
</script>
</body>
</html>
